name: Console generative vs Search usage 319

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/console_search_usage_319.py'
      - 'src/rasai/interactive_console.py'
      - 'tests/test_console_search_usage_319.py'
      - 'docs/CONSOLE_COST_AND_USAGE.md'
      - '.github/workflows/console-usage-separation.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/console_search_usage_319.py'
      - 'src/rasai/interactive_console.py'
      - 'tests/test_console_search_usage_319.py'
      - 'docs/CONSOLE_COST_AND_USAGE.md'
      - '.github/workflows/console-usage-separation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage-separation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RASAi and test runner
        run: python -m pip install -e . pytest
      - name: Validate isolated read-only usage projection
        run: python -m pytest -q tests/test_console_search_usage_319.py
