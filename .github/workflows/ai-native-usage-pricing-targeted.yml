name: AI native usage pricing targeted

on:
  push:
    branches:
      - feat/ai-native-usage-pricing-units
    paths:
      - 'src/rasai/ai_native_usage.py'
      - 'src/rasai/ai_pricing_catalog.py'
      - 'src/rasai/ai_cost_policy.py'
      - 'src/rasai/ai_pricing_saas.py'
      - 'src/rasai/ai_catalog_control_plane.py'
      - 'src/rasai/m18_ai.py'
      - 'src/rasai/m18_persistence.py'
      - 'src/rasai/m20_persistence.py'
      - 'src/rasai/platform/usage_ingestion.py'
      - 'src/rasai/platform/consumption.py'
      - 'src/rasai/platform/saas_management.py'
      - 'src/rasai/platform/postgres_ai_catalog_migration.py'
      - 'src/rasai/console_cost.py'
      - 'src/rasai/interactive_console.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/config/ai-pricing-defaults.toml'
      - 'config/ai-pricing.toml'
      - 'tests/test_ai_native_usage_pricing.py'
      - 'tests/test_ai_cost_policy.py'
      - 'tests/test_ai_pricing_configuration.py'
      - 'tests/test_ai_pricing_saas.py'
      - 'tests/test_m18_multi_ai_provider.py'
      - 'tests/test_catalog_report_final_refinements.py'
      - 'tests/test_m9_scoring.py'
      - '.github/workflows/ai-native-usage-pricing-targeted.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/rasai/ai_native_usage.py'
      - 'src/rasai/ai_pricing_catalog.py'
      - 'src/rasai/ai_cost_policy.py'
      - 'src/rasai/ai_pricing_saas.py'
      - 'src/rasai/ai_catalog_control_plane.py'
      - 'src/rasai/m18_ai.py'
      - 'src/rasai/m18_persistence.py'
      - 'src/rasai/m20_persistence.py'
      - 'src/rasai/platform/usage_ingestion.py'
      - 'src/rasai/platform/consumption.py'
      - 'src/rasai/platform/saas_management.py'
      - 'src/rasai/platform/postgres_ai_catalog_migration.py'
      - 'src/rasai/console_cost.py'
      - 'src/rasai/interactive_console.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/config/ai-pricing-defaults.toml'
      - 'config/ai-pricing.toml'
      - 'tests/test_ai_native_usage_pricing.py'
      - 'tests/test_ai_cost_policy.py'
      - 'tests/test_ai_pricing_configuration.py'
      - 'tests/test_ai_pricing_saas.py'
      - 'tests/test_m18_multi_ai_provider.py'
      - 'tests/test_catalog_report_final_refinements.py'
      - 'tests/test_m9_scoring.py'
      - '.github/workflows/ai-native-usage-pricing-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile only affected Python surfaces
        run: |
          python -m compileall -q             src/rasai/ai_native_usage.py             src/rasai/ai_pricing_catalog.py             src/rasai/ai_cost_policy.py             src/rasai/ai_pricing_saas.py             src/rasai/ai_catalog_control_plane.py             src/rasai/m18_ai.py             src/rasai/m18_persistence.py             src/rasai/m20_persistence.py             src/rasai/platform/usage_ingestion.py             src/rasai/platform/consumption.py             src/rasai/platform/saas_management.py             src/rasai/platform/postgres_ai_catalog_migration.py             src/rasai/console_cost.py             src/rasai/interactive_console.py             src/rasai/catalog_report_integrations.py
      - name: Run native-usage and directly affected boundary tests
        run: |
          python -m pytest -q             tests/test_ai_native_usage_pricing.py             tests/test_ai_cost_policy.py             tests/test_ai_pricing_configuration.py             tests/test_ai_pricing_saas.py             tests/test_m18_multi_ai_provider.py             tests/test_catalog_report_final_refinements.py             tests/test_m9_scoring.py
