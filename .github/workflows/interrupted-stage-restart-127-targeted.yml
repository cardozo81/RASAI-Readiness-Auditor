name: Interrupted stage restart 127 (targeted)

on:
  pull_request:
    paths:
      - "src/rasai/reprocess_measurements.py"
      - "src/rasai/m23_persistence.py"
      - "tests/test_m23_interrupted_resume.py"
      - "tests/test_m25_interrupted_stage_restart_126.py"
      - "docs/AUD_RPR_INTERRUPTED_STAGE_POLICY.md"
      - ".github/workflows/interrupted-stage-restart-127-targeted.yml"
  workflow_dispatch:

jobs:
  interrupted-stage-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and focused test runner
        run: python -m pip install -e . pytest
      - name: Run only M23/M25 interruption and directly related contracts
        run: |
          python -m pytest -q             tests/test_m23_interrupted_resume.py             tests/test_m23_integration.py             tests/test_m25_interrupted_stage_restart_126.py             tests/test_m25_synthetic_user_experience.py             tests/test_governed_reprocess_dependencies.py
