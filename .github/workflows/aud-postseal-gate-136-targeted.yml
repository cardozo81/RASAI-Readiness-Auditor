name: Initial AUD postseal AI gate 136 (isolated)
on:
  pull_request:
    paths:
      - 'src/rasai/audit_runner.py'
      - 'tests/test_shared_collection_ai_gate.py'
      - '.github/workflows/aud-postseal-gate-136-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aud-postseal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install affected runtime and pytest
        run: python -m pip install -e . pytest
      - name: Only direct AUD and RPR pre-AI gate regressions
        run: >-
          python -m pytest -q
          tests/test_shared_collection_ai_gate.py::test_both_orchestrators_use_gate_and_m24_cli_does_not_run_preseal_ai
          tests/test_shared_collection_ai_gate.py::test_initial_gate_uses_completed_passive_security_state_and_still_blocks_real_serp_deficit
