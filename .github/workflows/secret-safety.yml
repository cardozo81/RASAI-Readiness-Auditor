name: Secret and Configuration Safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install base RASAi runtime and test runner
        run: python -m pip install -e . pytest
      - name: Scan versioned repository for secret exposure
        run: python -m rasai.secret_safety
      - name: Validate secret redaction and property configuration
        run: python -m pytest -q tests/test_secret_safety.py
