name: RASAi visual semantics refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/rasai_visual_semantics_refinement.py'
      - '.github/rasai_visual_semantics_fixup.py'
      - '.github/workflows/rasai-visual-semantics-refinement.yml'
      - '.rasai-visual-semantics-trigger'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply refinement
        run: |
          python .github/rasai_visual_semantics_refinement.py
          python .github/rasai_visual_semantics_fixup.py
          rm -f .github/rasai_visual_semantics_refinement.py
          rm -f .github/rasai_visual_semantics_fixup.py
          rm -f .github/workflows/rasai-visual-semantics-refinement.yml
          rm -f .rasai-visual-semantics-trigger
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Targeted regression
        run: >-
          pytest -q
          tests/test_visual_semantics_refinement_20260908.py
          tests/test_report_semantics.py
          tests/test_rasai_readiness_reporting.py
          tests/test_report_registry_and_method_docs.py
          tests/test_post_smoke_adherence_20260908.py
          tests/test_reporting_governance_refinement_20260908.py
          tests/test_scoring_report_layout_20260908.py
      - name: Full regression
        run: pytest -q
      - name: Commit validated implementation
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No implementation changes to commit'; exit 1; }
          git commit -m 'Unify report visual semantics and remove unpublished alias'
          git push origin HEAD:main
