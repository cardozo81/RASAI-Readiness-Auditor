; RASAi canonical system defaults
; Versioned product baseline used by the interactive console and Restore Defaults.
; This file MUST NOT contain secrets. User overrides belong in rasai-console.ini.
; External credentials remain environment/OS/SaaS-secret concerns.

[metadata]
system_defaults_version = 1
policy = maximum-safe-without-required-credentials

[console]
config_version = 4
input_mode = url
target =
project =
language = pt-BR
market = BR
max_pages = 100
audits_root = audits
device = mobile

[presentation]
timezone = America/Sao_Paulo

[ai]
provider = none
model =
reasoning_effort =
timeout_seconds = 180
content_remediation = false
technical_remediation = false

[web_performance]
; PageSpeed/CrUX remain credential-driven AUTO capabilities.
enabled = false
max_pages = 10
timeout_seconds = 120
field_source = auto
lighthouse_categories = performance,accessibility,best-practices,seo,agentic-browsing

[synthetic_apdex]
; Low-load default. >=100 valid samples/context is the normal representative target.
enabled = true
threshold_seconds = 3
samples_per_context = 1
max_attempts_per_context = 2
max_pages = 1
timeout_seconds = 45
delay_seconds = 1
concurrency = 1

[synthetic_apdex_experience]
; Low-load default keeps every device in the 60/35/5 population represented.
; >=100 valid samples/page is the normal representative target.
enabled = true
samples_per_page = 20
max_attempts_per_page = 25
max_pages = 1
device_mix = mobile=60,desktop=35,tablet=5
session_mode = cold
kpm = USER_ACTION_DURATION
satisfied_seconds = 3
frustrated_seconds = 12
errors_affect_apdex = true
error_scope = first-party
settle_seconds = 5
delay_seconds = 1
concurrency = 1

dynatrace_import = false
dynatrace_base_url =
dynatrace_application_id =
dynatrace_config_json =

[improvement_intelligence]
enabled = false
domains = TECHNICAL_HTML,SEMANTICS_STRUCTURE,CONTENT,SEARCH_RANKING,FILES_DISCOVERY,PERFORMANCE,ACCESSIBILITY,BEST_PRACTICES,SECURITY,AI_ACCESS
max_recommendations = 30
timeout_seconds = 240

[environment]
; General application/runtime
RASAI_CONSOLE_MODE = local
RASAI_LOG_LEVEL = INFO
RASAI_AI_ANALYSIS_LANGUAGE = auto
RASAI_CONTENT_RISK_PROFILE = auto
RASAI_YMYL_CATEGORY = auto
RASAI_PAGE_PURPOSE = auto
RASAI_INTENDED_AUDIENCE = auto
RASAI_EXPERIENCE_REQUIREMENT = auto
RASAI_FRESHNESS_SENSITIVITY = auto
RASAI_CONTENT_ORIGIN = auto
RASAI_AI_EXCHANGE_LOG_MAX_BYTES = 524288
RASAI_REPROCESS_LIVE_VALIDITY_MINUTES = 1440

; AI provider policy values. They configure behavior but do not enable a provider without its credential.
; The selected model must exist and be enabled in the effective AI model catalog.
RASAI_OPENAI_MODEL = gpt-5.6-luna
RASAI_OPENAI_REASONING_EFFORT = NONE
RASAI_DEEPSEEK_MODEL = deepseek-v4-flash
RASAI_DEEPSEEK_REASONING_EFFORT = NONE
RASAI_MIMO_MODEL = mimo-v2.5
RASAI_MIMO_REASONING_EFFORT = NONE
RASAI_XAI_MODEL = grok-4.6
RASAI_XAI_REASONING_EFFORT = LOW
RASAI_QWEN_MODEL = qwen3.8-flash
RASAI_GEMINI_MODEL = gemini-3.8-flash
RASAI_GEMINI_REASONING_EFFORT = LOW
RASAI_ANTHROPIC_MODEL = claude-sonnet-5
RASAI_ANTHROPIC_REASONING_EFFORT = LOW
RASAI_COPILOT_MODEL = auto
RASAI_XAI_ENDPOINT = https://api.x.ai/v1/responses
RASAI_QWEN_ENDPOINT = https://dashscope-us.aliyuncs.com/compatible-mode/v1/chat/completions
RASAI_GEMINI_ENDPOINT = https://generativelanguage.googleapis.com/v1beta/interactions
RASAI_ANTHROPIC_ENDPOINT = https://api.anthropic.com/v1/messages

; Human-editable AI configuration lives under config/ at the repository/runtime root.
; SOURCE=auto uses the operator file when present and the packaged factory baseline when absent.
; Each console AUD snapshots the effective catalogs at execution start.
RASAI_AI_MODELS_SOURCE = auto
RASAI_AI_MODELS_FILE = config/ai-models.toml
RASAI_AI_TASK_PROFILES_SOURCE = auto
RASAI_AI_TASK_PROFILES_FILE = config/ai-task-profiles.toml
RASAI_AI_PRICING_SOURCE = auto
RASAI_AI_PRICING_FILE = config/ai-pricing.toml

; Synthetic Apdex physical acquisition policy. AUTO may reuse only compatible acquisitions;
; it does not change targets, device mix, thresholds or scoring.
RASAI_APDEX_ACQUISITION_MODE = auto

; Credential-free metrics/services are enabled by default, including external free services.
RASAI_DERIVED_READINESS_METRICS = true
RASAI_RETRIEVAL_METRICS = true
RASAI_OPEN_WEB_METRICS = true
RASAI_W3C_VALIDATOR = true
RASAI_W3C_CSS_VALIDATOR = true
RASAI_MDN_OBSERVATORY = true
RASAI_WEB_PLATFORM_BASELINE = true
RASAI_COMMON_CRAWL_ENABLED = true
RASAI_COMMON_CRAWL_MAX_URLS = 3
RASAI_COMMON_CRAWL_INDEX_COUNT = 2
RASAI_STANDARDS_MAX_URLS = 10
RASAI_STANDARDS_TIMEOUT_SECONDS = 20

; Credential-driven services are intentionally not forced true/false here unless
; an explicit opt-in is safer than automatic activation.
; RASAI_PAGESPEED_ENABLED = AUTO by requirements
; RASAI_CRUX_ENABLED = AUTO by requirements
; RASAI_CRUX_HISTORY_ENABLED = AUTO when the CrUX credential is available in the environment/secret store
; RASAI_GSC_ENABLED = AUTO by requirements
; GSC collection limits are safe defaults only; they do not configure OAuth or a property.
RASAI_GSC_SEARCH_ANALYTICS_DAYS = 1
RASAI_GSC_SEARCH_MAX_ROWS = 10000
RASAI_GSC_FINAL_DATA_LAG_DAYS = 3
; Microsoft Clarity is free but has a 10 requests/day/project quota, so it is explicit opt-in.
RASAI_CLARITY_ENABLED = false
RASAI_CLARITY_DAYS = 1
RASAI_CLARITY_DIMENSIONS = URL,Device

; Search Intelligence remains inactive until terms + provider/credential are configured.
; Competitive AI, when requested, uses the canonical RASAi AI selection (explicit or AUTO).
RASAI_SERP_MODE = disabled
RASAI_SERP_PROVIDER = serpapi
RASAI_SERP_MAX_QUERIES = 10
RASAI_SERP_MAX_REQUESTS = 10
RASAI_SERP_MAX_DEPTH = 20
RASAI_SERP_MAX_COMPETITORS = 10
RASAI_SERP_TIMEOUT_SECONDS = 20
RASAI_SERP_RETRIES = 1
RASAI_SERP_MIN_INTERVAL_SECONDS = 1

; Local/control-plane safe baseline. Administrative surfaces remain fail-closed.
RASAI_PLATFORM_DB_BACKEND = sqlite
RASAI_API_DOCS_ENABLED = false
RASAI_API_AUDITS_ROOT = audits
RASAI_API_AUTH_MODE = deny
RASAI_API_TRUSTED_USER_HEADER = x-rasai-user-id
RASAI_OIDC_ALGORITHMS = RS256,ES256
RASAI_OIDC_SCOPES = openid,profile,email
RASAI_OIDC_SESSION_TTL_SECONDS = 28800
RASAI_REMOTE_TIMEOUT_SECONDS = 30
RASAI_BROWSER_LOCALE = pt-BR
