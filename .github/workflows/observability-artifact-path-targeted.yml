name: Observability Artifact Path Targeted

on:
  push:
    branches:
      - feat/passive-security-catalog
    paths:
      - '.github/workflows/observability-artifact-path-targeted.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile touched observability consumers
        run: >-
          python -m py_compile
          src/rasai/observability/store.py
          src/rasai/observability/cli.py
          src/rasai/observability/reporting.py
          src/rasai/observability/diagnostics.py
          src/rasai/observability/external_sources.py
          src/rasai/monitoring/impact.py
          src/rasai/quality/analysis.py
          src/rasai/integration_state_contract.py
          src/rasai/catalog_state_trust.py
          src/rasai/catalog_projection_consistency.py
          src/rasai/catalog_report_search_trust.py
          src/rasai/standards_gsc_metrics.py
          src/rasai/standards_gsc_sitemap_metrics.py
          src/rasai/standards_gsc_visibility_metrics.py
          src/rasai/standards_gsc_crawl_freshness_metrics.py
          src/rasai/execution_consistency_runtime.py
          src/rasai/post_smoke_alignment.py
          src/rasai/post_smoke_hotfix.py
      - name: Run directly affected tests only
        run: >-
          pytest -q
          tests/test_observability_collectors.py
          tests/test_quality_observability_hardening.py
          tests/test_standards_gsc_metrics.py
          tests/test_standards_gsc_sitemap_metrics.py
          tests/test_standards_gsc_visibility_metrics.py
          tests/test_standards_gsc_crawl_freshness_metrics.py
          tests/test_integration_state_contract.py
          tests/test_post_smoke_alignment.py
          tests/test_gsc_inspection_failure_policy.py
          tests/test_crux_scope_hardening.py
          tests/test_gsc_scope_hardening.py
