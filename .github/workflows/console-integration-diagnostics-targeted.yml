name: Console Integration Diagnostics Targeted

on:
  workflow_dispatch:
  push:
    branches:
      - feat/passive-security-catalog
    paths:
      - 'src/rasai/console_ui_catalog.py'
      - 'src/rasai/integration_diagnostics_console.py'
      - 'src/rasai/console_operator_ux_consistency.py'
      - 'tests/test_console_integration_diagnostics_route.py'
      - 'tests/test_console_ui_refactor.py'
      - 'tests/test_console_operator_ux_consistency.py'
      - 'docs/INTEGRATION_DIAGNOSTICS.md'
      - 'docs/INTERACTIVE_CONSOLE.md'
      - '.github/workflows/console-integration-diagnostics-targeted.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile changed console modules
        run: |
          python -m py_compile \
            src/rasai/console_ui_catalog.py \
            src/rasai/integration_diagnostics_console.py \
            src/rasai/console_operator_ux_consistency.py

      - name: Run public routing and diagnostic policy tests
        run: >-
          pytest -q
          tests/test_console_integration_diagnostics_route.py
          tests/test_console_ui_refactor.py::test_top_level_integrations_reaches_final_integrations_router
          tests/test_console_operator_ux_consistency.py::test_integration_validation_actions_warn_about_possible_quota_use

      - name: Verify diagnostic backend is untouched by this scope
        shell: bash
        run: |
          baseline=4bbed860a03d5eea827ef18d5c91b98e87ca9331
          changed="$(git diff --name-only "${baseline}...HEAD")"
          echo "${changed}"
          if echo "${changed}" | grep -E '^src/rasai/integration_diagnostics\.py$'; then
            echo "Canonical integration diagnostic backend was modified."
            exit 1
          fi
