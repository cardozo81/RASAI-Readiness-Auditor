name: Public language gaps 120 - targeted

on:
  pull_request:
    paths:
      - 'src/rasai/public_language.py'
      - 'src/rasai/m24_reporting.py'
      - 'tests/test_user_facing_language_contract.py'
      - '.github/workflows/public-language-120-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-gaps-120:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Run only affected documentation/template/error-code checks
        run: >-
          python -m pytest -q
          tests/test_user_facing_language_contract.py::test_documentation_has_no_standalone_delivery_milestone_labels
          tests/test_user_facing_language_contract.py::test_technical_parity_matrix_is_not_scanned_as_public_documentation
          tests/test_user_facing_language_contract.py::test_user_facing_templates_have_no_standalone_delivery_milestone_labels
          tests/test_user_facing_language_contract.py::test_semantic_machine_literals_have_a_public_language_contract
          tests/test_user_facing_language_contract.py::test_known_experience_apdex_error_codes_have_public_diagnostic_labels
