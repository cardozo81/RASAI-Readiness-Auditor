name: CONS domain CDOM package 210
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/consolidation/domain_comparative_package_210.py'
      - 'src/rasai/consolidation/domain_comparative_preview_210.py'
      - 'src/rasai/consolidation/domain_comparative_index_210.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_cons_domain_comparative_index_210.py'
      - 'docs/CONS_DOMAIN_COMPARATIVE_210.md'
      - '.github/workflows/cons-domain-package-210.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/consolidation/domain_comparative_package_210.py'
      - 'src/rasai/consolidation/domain_comparative_preview_210.py'
      - 'src/rasai/consolidation/domain_comparative_index_210.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_cons_domain_comparative_index_210.py'
      - '.github/workflows/cons-domain-package-210.yml'
permissions:
  contents: read
jobs:
  cdom-safe-package:
    name: CDOM idempotent package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Isolated same-host index and CDOM package contracts
        run: python -m pytest -q tests/test_cons_domain_comparative_index_210.py tests/test_cons_domain_comparative_210.py
