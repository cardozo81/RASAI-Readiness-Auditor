name: Source quality safety

on:
  push:
    branches:
      - fix/audit-source-quality-tls-apdex
  pull_request:
    branches:
      - main
    paths:
      - 'src/searchgeo/source_quality.py'
      - 'src/searchgeo/source_quality_ai.py'
      - 'src/searchgeo/source_quality_browser.py'
      - 'src/searchgeo/audit_runner.py'
      - 'src/searchgeo/cli_extensions.py'
      - 'src/searchgeo/console_runtime.py'
      - 'tests/test_source_quality*.py'
      - 'docs/SOURCE_QUALITY_AND_REDIRECTS.md'
      - '.github/workflows/source-quality-safety.yml'

permissions:
  contents: read

jobs:
  source-quality-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Install Playwright Chromium for existing M23 E2E
        run: python -m playwright install --with-deps chromium

      - name: Compile changed runtime surface
        run: |
          python -m compileall -q \
            src/searchgeo/source_quality.py \
            src/searchgeo/source_quality_ai.py \
            src/searchgeo/source_quality_browser.py \
            src/searchgeo/audit_runner.py \
            src/searchgeo/cli_extensions.py \
            src/searchgeo/console_runtime.py

      - name: Source-quality regression tests
        run: |
          python -m pytest -q \
            tests/test_source_quality_fail_fast.py \
            tests/test_source_quality_ai.py

      - name: Directly affected subsystem regressions
        run: |
          python -m pytest -q \
            tests/test_m21_web_performance.py \
            tests/test_m23_integration.py \
            tests/test_console_progress_guidance.py \
            tests/test_m12_stable_baseline.py

      - name: Full regression suite
        run: python -m pytest -q
