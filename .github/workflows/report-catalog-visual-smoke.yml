name: Report catalog offline visual smoke

on:
  pull_request:
    paths:
      - "src/rasai/catalog_report_*.py"
      - "src/rasai/directed_analysis_reporting.py"
      - "tests/test_catalog_report_site.py"
      - "tests/report_catalog_visual_smoke.py"
      - "src/rasai/geo_report.py"
      - ".github/workflows/report-catalog-visual-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-visual-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout report candidate
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and browser testing
        run: |
          python -m pip install --disable-pip-version-check -e . pytest playwright
          python -m playwright install --with-deps chromium
      - name: Verify report pages and existing section regressions
        run: |
          python -m pytest -q tests/test_catalog_report_site.py tests/test_report_section_readability_328.py
      - name: Materialize offline synthetic report and capture mobile desktop print
        run: |
          python tests/report_catalog_visual_smoke.py --make-synthetic-fixture --output-dir "${{ runner.temp }}/rasai-catalog-report"
      - name: Publish synthetic screenshots and report for human visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasai-catalog-report-smoke
          path: ${{ runner.temp }}/rasai-catalog-report/
          retention-days: 14
          if-no-files-found: warn
