name: CAT-06 typed browser diagnostics (#109)

on:
  pull_request:
    paths:
      - 'src/rasai/catalog_report_analysis.py'
      - 'src/rasai/catalog_report_adherence.py'
      - 'tests/test_nav_browser_diagnostic_labels_109.py'
      - '.github/workflows/cat06-browser-labels-109.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/catalog_report_analysis.py'
      - 'src/rasai/catalog_report_adherence.py'
      - 'tests/test_nav_browser_diagnostic_labels_109.py'
      - '.github/workflows/cat06-browser-labels-109.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-cat06:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Only changed CAT-06 renderer
        run: python -m pytest -q tests/test_nav_browser_diagnostic_labels_109.py
