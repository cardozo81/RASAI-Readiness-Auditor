name: RASAi post-smoke adherence remediation

on:
  push:
    branches: [main]
    paths:
      - '.rasai-followup-trigger'

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply post-smoke remediation
        run: python .github/rasai_followup_fix.py
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            src/rasai/console_config.py \
            src/rasai/console_settings.py \
            src/rasai/interactive_console.py \
            src/rasai/console_help.py \
            src/rasai/console_environment.py \
            src/rasai/console_cost.py \
            src/rasai/rasai_readiness_reporting.py \
            src/rasai/m24_reporting.py \
            src/rasai/m23_apdex_profiles.py \
            src/rasai/m23_persistence.py \
            src/rasai/m23_apdex.py \
            src/rasai/m23_reporting.py \
            src/rasai/report_site.py \
            src/rasai/report_navigation.py \
            src/rasai/report_semantics.py
      - name: Targeted regression
        run: |
          python -m pytest -q \
            tests/test_post_smoke_adherence_20260908.py \
            tests/test_smoke_backlog_20260908.py \
            tests/test_console_settings.py \
            tests/test_interactive_console.py \
            tests/test_console_progress_guidance.py \
            tests/test_m24_crawling_discovery.py \
            tests/test_m23_integration.py \
            tests/test_m23_e2e_local.py \
            tests/test_rasai_readiness_reporting.py \
            tests/test_report_semantics.py
      - name: Full regression
        run: python -m pytest -q
      - name: Remove temporary implementation artifacts
        run: |
          rm -f .github/rasai_followup_fix.py
          rm -f .github/workflows/rasai-followup.yml
          rm -f .rasai-followup-trigger
      - name: Commit validated implementation directly to main
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix post-smoke configuration reporting and Apdex diagnostics'
          git push origin HEAD:main
