name: CAT-05 active SERP provenance 129 (isolated)

on:
  pull_request:
    paths:
      - "src/rasai/catalog_report_search_trust.py"
      - "tests/test_catalog_report_search_trust.py"
      - ".github/workflows/cat05-serp-active-129-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cat05-serp-active:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install only affected Python runtime and pytest
        run: python -m pip install -e . pytest
      - name: Only affected active CAT-05 SERP regressions
        run: >-
          python -m pytest -q
          tests/test_catalog_report_search_trust.py::test_serp_projection_exposes_incomplete_requested_depth
          tests/test_catalog_report_search_trust.py::test_active_cat05_serp_renderer_displays_provider_times_opt_in_and_repeat_evidence
