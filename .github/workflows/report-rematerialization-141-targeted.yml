name: Read-only Report Rematerialization #141

on:
  push:
    branches: [main]
    paths:
      - 'src/rasai/report_rematerialization.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_report_rematerialization_141.py'
      - '.github/workflows/report-rematerialization-141-targeted.yml'
  pull_request:
    paths:
      - 'src/rasai/report_rematerialization.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_report_rematerialization_141.py'
      - '.github/workflows/report-rematerialization-141-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-only-141:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Isolated #141 tests and existing report boundary
        run: pytest -q tests/test_report_rematerialization_141.py tests/test_report_catalog_output_contract.py
