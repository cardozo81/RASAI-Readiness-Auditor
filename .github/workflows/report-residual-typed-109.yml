name: Residual typed public fields #109

on:
  pull_request:
    paths:
      - 'src/rasai/catalog_report_evidence.py'
      - 'src/rasai/recommendation_governance_reporting.py'
      - 'src/rasai/request_remediation_intelligence.py'
      - 'src/rasai/accepted_audit_refinements.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/catalog_report_final_refinements.py'
      - 'src/rasai/ai_dependency_reporting.py'
      - 'tests/test_report_residual_typed_fields_109.py'
      - '.github/workflows/report-residual-typed-109.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/catalog_report_evidence.py'
      - 'src/rasai/recommendation_governance_reporting.py'
      - 'src/rasai/request_remediation_intelligence.py'
      - 'src/rasai/accepted_audit_refinements.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/catalog_report_final_refinements.py'
      - 'src/rasai/ai_dependency_reporting.py'
      - 'tests/test_report_residual_typed_fields_109.py'
      - '.github/workflows/report-residual-typed-109.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-report-109:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Focus only on residual display fields
        run: python -m pytest -q tests/test_report_residual_typed_fields_109.py
