name: AI Economic Telemetry 195 Targeted

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/rasai/ai_economic_telemetry.py'
      - 'src/rasai/ai_cost_policy.py'
      - 'src/rasai/dynamic_ai_routing.py'
      - 'src/rasai/m18_ai.py'
      - 'src/rasai/m20_ai.py'
      - 'src/rasai/provider_extensions.py'
      - 'src/rasai/provider_extensions_m20.py'
      - 'src/rasai/m24_ai.py'
      - 'src/rasai/source_quality_ai.py'
      - 'src/rasai/directed_analysis.py'
      - 'src/rasai/improvement_intelligence.py'
      - 'src/rasai/consolidation/specialist.py'
      - 'src/rasai/ai_orchestration_unification.py'
      - 'src/rasai/console_reprocess_final_refinements.py'
      - 'src/rasai/m18_persistence.py'
      - 'src/rasai/m20_persistence.py'
      - 'src/rasai/search_intelligence/perplexity.py'
      - 'src/rasai/m20_reporting.py'
      - 'src/rasai/m24_reporting.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/catalog_report_final_refinements.py'
      - 'src/rasai/catalog_report_search_trust.py'
      - 'src/rasai/consolidation/presentation.py'
      - 'src/rasai/cost_forecast.py'
      - 'src/rasai/platform/usage_ingestion.py'
      - 'src/rasai/fulfillment_execution_contract.py'
      - 'docs/REPORTING_AI_USAGE.md'
      - 'docs/AI_PRICING_CONFIGURATION.md'
      - 'tests/test_ai_economic_telemetry.py'
      - 'tests/test_ai_economic_reporting_195.py'
      - '.github/workflows/ai-economic-telemetry-195-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install package and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[web]' pytest

      - name: Compile affected economic and reporting boundaries
        run: |
          python -m py_compile \
            src/rasai/ai_economic_telemetry.py \
            src/rasai/dynamic_ai_routing.py \
            src/rasai/m18_ai.py \
            src/rasai/m20_ai.py \
            src/rasai/provider_extensions.py \
            src/rasai/provider_extensions_m20.py \
            src/rasai/m24_ai.py \
            src/rasai/source_quality_ai.py \
            src/rasai/directed_analysis.py \
            src/rasai/improvement_intelligence.py \
            src/rasai/consolidation/specialist.py \
            src/rasai/ai_orchestration_unification.py \
            src/rasai/console_reprocess_final_refinements.py \
            src/rasai/m18_persistence.py \
            src/rasai/m20_persistence.py \
            src/rasai/search_intelligence/perplexity.py \
            src/rasai/m20_reporting.py \
            src/rasai/m24_reporting.py \
            src/rasai/catalog_report_integrations.py \
            src/rasai/catalog_report_final_refinements.py \
            src/rasai/catalog_report_search_trust.py \
            src/rasai/consolidation/presentation.py \
            src/rasai/cost_forecast.py \
            src/rasai/platform/usage_ingestion.py \
            src/rasai/fulfillment_execution_contract.py

      - name: Economic policy and persistence
        run: >-
          pytest -q
          tests/test_ai_economic_telemetry.py
          tests/test_ai_cost_policy.py
          tests/test_ai_native_usage_pricing.py
          tests/test_cost_forecast.py
          tests/test_console_cost_confirmation.py
          tests/test_console_reprocess_final_refinements.py
          tests/test_fulfillment_execution_contract.py

      - name: Canonical orchestration regression
        run: >-
          pytest -q
          tests/test_ai_canonical_orchestration_190.py
          tests/test_ai_orchestration_190_characterization.py
          tests/test_ai_runtime_orchestration.py
          tests/test_provider_extensions.py
          tests/test_m18_multi_ai_provider.py
          tests/test_source_quality_ai.py
          tests/test_directed_analysis.py
          tests/test_improvement_intelligence.py
          tests/test_request_remediation_canonical_190.py

      - name: Economic reporting projections
        run: >-
          pytest -q
          tests/test_ai_economic_reporting_195.py
          tests/test_consolidation_presentation.py
          tests/test_content_analysis_context.py
          tests/test_catalog_report_final_refinements.py
          tests/test_catalog_report_search_trust.py
          tests/test_m24_crawling_discovery.py
