name: Portable SQLite Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/platform/**'
      - 'src/rasai/search_intelligence/**'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_portable_sqlite_safety.py'
      - 'tests/test_product_platform_architecture.py'
      - 'tests/test_search_intelligence_monitoring.py'
      - 'pyproject.toml'
      - '.github/workflows/portable-sqlite-safety.yml'
      - 'docs/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'src/rasai/platform/**'
      - 'src/rasai/search_intelligence/**'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_portable_sqlite_safety.py'
      - 'tests/test_product_platform_architecture.py'
      - 'tests/test_search_intelligence_monitoring.py'
      - 'pyproject.toml'
      - '.github/workflows/portable-sqlite-safety.yml'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  sqlite-portable:
    name: sqlite-portable-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RASAI_PLATFORM_DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install portable/base RASAi only
        run: python -m pip install -e . pytest
      - name: Prove PostgreSQL driver is not installed
        run: python -c "import importlib.util; assert importlib.util.find_spec('psycopg') is None, 'psycopg must remain optional for portable SQLite mode'"
      - name: Compile portable runtime
        run: python -m compileall -q src/rasai
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Portable SQLite isolation and regression
        run: python -m pytest -q tests/test_portable_sqlite_safety.py tests/test_product_platform_architecture.py tests/test_search_intelligence_monitoring.py
      - name: CLI startup without PostgreSQL
        run: python -m rasai --help
