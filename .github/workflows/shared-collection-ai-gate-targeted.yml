name: Shared collection/AI closure - targeted

on:
  pull_request:
    paths:
      - 'src/rasai/audit_collection_gate.py'
      - 'src/rasai/audit_runner.py'
      - 'src/rasai/cli_extensions.py'
      - 'src/rasai/governed_reprocess_runtime.py'
      - 'tests/test_shared_collection_ai_gate.py'
      - '.github/workflows/shared-collection-ai-gate-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection-ai-close-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and isolated test tool
        run: python -m pip install -e . pytest
      - name: Only affected gate and orchestration tests
        run: >-
          python -m pytest -q
          tests/test_shared_collection_ai_gate.py
          tests/test_governed_ai_pipeline.py
          tests/test_governed_reprocess_dependencies.py
          tests/test_m24_crawling_discovery.py
