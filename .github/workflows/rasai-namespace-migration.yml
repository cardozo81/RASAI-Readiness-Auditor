name: RASAi namespace migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/complete_rasai_namespace_migration.py'
      - '.github/workflows/rasai-namespace-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Apply canonical RASAi namespace migration
        run: python .github/scripts/complete_rasai_namespace_migration.py
      - name: Validate diff hygiene
        run: git diff --check
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile canonical package
        run: python -m compileall -q src/rasai
      - name: Full Linux regression suite
        run: python -m pytest -q
      - name: Commit canonical namespace to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No migration changes found"; exit 1; }
          git commit -m "Complete RASAi namespace migration"
          git push origin HEAD:main

  windows-regression:
    needs: migrate-and-linux-regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Compile canonical package
        run: python -m compileall -q src/rasai
      - name: Full Windows regression suite
        run: python -m pytest -q
