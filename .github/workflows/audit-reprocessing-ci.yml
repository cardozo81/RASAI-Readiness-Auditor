name: Audit Fulfillment and Reprocessing

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/rasai/audit_fulfillment.py'
      - 'src/rasai/audit_fulfillment_runtime.py'
      - 'src/rasai/audit_fulfillment_saas.py'
      - 'src/rasai/audit_reprocess.py'
      - 'src/rasai/audit_resume_runtime.py'
      - 'src/rasai/audit_configuration_reuse*.py'
      - 'src/rasai/audit_management*.py'
      - 'src/rasai/audit_catalog.py'
      - 'src/rasai/audit_catalog_extension.py'
      - 'src/rasai/console_audit_catalog_extension.py'
      - 'src/rasai/console_catalog_*.py'
      - 'src/rasai/console_navigation.py'
      - 'src/rasai/console_history_presentation.py'
      - 'src/rasai/console_usability_refinements.py'
      - 'src/rasai/console_audit_workflow.py'
      - 'src/rasai/console_reprocess_parity.py'
      - 'src/rasai/console_reprocess_final_refinements.py'
      - 'src/rasai/console_execution_profile*.py'
      - 'src/rasai/console_configuration_guidance.py'
      - 'src/rasai/console_entrypoint.py'
      - 'src/rasai/improvement_intelligence.py'
      - 'src/rasai/ai_dependency_*.py'
      - 'src/rasai/technical_ai_eligibility.py'
      - 'src/rasai/provider_runtime_policy.py'
      - 'src/rasai/improvement_intelligence_console.py'
      - 'src/rasai/improvement_intelligence_saas.py'
      - 'src/rasai/ai_orchestration_unification*.py'
      - 'src/rasai/core_reprocessing.py'
      - 'src/rasai/core_reprocessing_context.py'
      - 'src/rasai/m2.py'
      - 'src/rasai/m3.py'
      - 'src/rasai/m4.py'
      - 'src/rasai/m5.py'
      - 'src/rasai/m6.py'
      - 'src/rasai/m7.py'
      - 'src/rasai/m9.py'
      - 'src/rasai/m10.py'
      - 'src/rasai/m21_web_performance.py'
      - 'src/rasai/m23_apdex.py'
      - 'src/rasai/m25_apdex_experience.py'
      - 'src/rasai/pre_scoring_rules.py'
      - 'src/rasai/core_integrity_runtime.py'
      - 'src/rasai/governed_reprocess_runtime.py'
      - 'src/rasai/reprocess_*.py'
      - 'src/rasai/semantic_recovery_runtime.py'
      - 'src/rasai/technical_ai_eligibility.py'
      - 'src/rasai/ai_efficiency_policy.py'
      - 'src/rasai/consolidation/**'
      - 'src/rasai/entrypoint.py'
      - 'src/rasai/platform/**'
      - 'src/rasai/web/**'
      - 'src/rasai/worker.py'
      - 'src/rasai/execution_contract.py'
      - 'docs/AUDIT_REPROCESSING.md'
      - 'docs/AUDIT_CONFIGURATION_REUSE.md'
      - 'docs/AUDIT_STORAGE_MANAGEMENT.md'
      - 'docs/INTERACTIVE_CONSOLE.md'
      - 'docs/AUDIT_CATALOG_WORKFLOW.md'
      - 'docs/IMPROVEMENT_INTELLIGENCE.md'
      - 'docs/CONSOLIDATED_REPORTING.md'
      - 'docs/EXTERNAL_OBSERVABILITY_INTEGRATIONS.md'
      - 'docs/ENVIRONMENT_VARIABLES.md'
      - 'docs/REPROCESSING_HUMAN_SMOKE.md'
      - 'tests/test_audit_fulfillment_reprocessing.py'
      - 'tests/test_audit_resume_runtime.py'
      - 'tests/test_issue_18_fulfillment_lifecycle.py'
      - 'tests/test_issue_25_pre_scoring_resume.py'
      - 'tests/test_audit_configuration_reuse*.py'
      - 'tests/test_audit_management.py'
      - 'tests/test_audit_catalog_extension.py'
      - 'tests/test_console_navigation.py'
      - 'tests/test_console_history_presentation.py'
      - 'tests/test_console_usability_refinements.py'
      - 'tests/test_console_audit_workflow.py'
      - 'tests/test_console_reprocess_parity.py'
      - 'tests/test_console_reprocess_final_refinements.py'
      - 'tests/test_console_canonical_ai_orchestration.py'
      - 'tests/test_console_execution_profile_readiness.py'
      - 'tests/test_console_configuration_guidance.py'
      - 'tests/test_improvement_intelligence.py'
      - 'tests/test_issue_48_improvement_material_fingerprint.py'
      - 'tests/test_issue_50_preselection_reconciliation.py'
      - 'tests/test_issue_51_owned_standards_service_state.py'
      - 'tests/test_provider_runtime_policy.py'
      - 'tests/test_issue_43_reprocess_ai_timeout.py'
      - 'tests/test_issue_46_semantic_backfill_causality.py'
      - 'tests/test_reprocess_failure_preservation.py'
      - 'tests/test_reporting_read_only_boundary.py'
      - 'tests/test_consolidation_fulfillment_gate.py'
      - 'tests/test_core_reprocessing.py'
      - 'tests/test_core_reprocessing_context.py'
      - 'tests/test_issue_66_execution_reprocess_parity.py'
      - 'tests/test_core_integrity_runtime.py'
      - 'tests/test_reprocess_runtime_safety.py'
      - 'tests/test_reprocess_dependency_closure.py'
      - 'tests/test_governed_reprocess_dependencies.py'
      - 'tests/test_governed_ai_pipeline.py'
      - 'tests/test_semantic_recovery_runtime.py'
      - 'tests/test_audit_fulfillment_saas.py'
      - '.github/workflows/audit-reprocessing-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-local-runtime:
    name: Windows local runtime / console contract
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Fulfillment, reprocessing and reusable-AUD domain tests
        run: pytest -q tests/test_audit_fulfillment_reprocessing.py tests/test_audit_resume_runtime.py tests/test_issue_18_fulfillment_lifecycle.py tests/test_issue_25_pre_scoring_resume.py tests/test_issue_41_pre_m7_semantic_resume.py tests/test_issue_43_reprocess_ai_timeout.py tests/test_issue_46_semantic_backfill_causality.py tests/test_issue_50_preselection_reconciliation.py tests/test_issue_51_owned_standards_service_state.py tests/test_provider_runtime_policy.py tests/test_audit_configuration_reuse.py tests/test_audit_management.py tests/test_consolidation_fulfillment_gate.py tests/test_core_reprocessing.py tests/test_core_reprocessing_context.py tests/test_issue_66_execution_reprocess_parity.py tests/test_core_integrity_runtime.py tests/test_reprocess_runtime_safety.py tests/test_reprocess_dependency_closure.py tests/test_governed_reprocess_dependencies.py tests/test_governed_ai_pipeline.py tests/test_reprocess_failure_preservation.py tests/test_reporting_read_only_boundary.py tests/test_semantic_recovery_runtime.py tests/test_m7_semantic_provider.py tests/test_audit_catalog_extension.py
      - name: Console navigation, configuration reuse and publication regressions
        run: pytest -q tests/test_console_navigation.py tests/test_console_history_presentation.py tests/test_console_usability_refinements.py tests/test_console_audit_workflow.py tests/test_console_reprocess_parity.py tests/test_console_reprocess_final_refinements.py tests/test_audit_configuration_reuse_console.py tests/test_console_configuration_guidance.py tests/test_console_catalog_workflow.py tests/test_prepublication_configuration_contract.py tests/test_environment_surface_parity.py
      - name: Canonical AI orchestration in interactive console
        run: pytest -q tests/test_console_canonical_ai_orchestration.py tests/test_console_execution_profile_readiness.py tests/test_improvement_intelligence.py tests/test_issue_48_improvement_material_fingerprint.py tests/test_fulfillment_execution_contract.py
      - name: CLI surface smoke tests
        shell: pwsh
        run: |
          python -m rasai.entrypoint --help
          python -m rasai.entrypoint audit --help
          python -m rasai.entrypoint reprocess --help

  linux-saas-runtime:
    name: Linux SaaS / control-plane contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package, web dependencies and pytest
        run: python -m pip install -e '.[web]' pytest
      - name: SaaS fulfillment and configuration reuse integration tests
        run: pytest -q tests/test_audit_fulfillment_saas.py tests/test_audit_configuration_reuse_saas.py
      - name: SaaS execution and web API regressions
        run: pytest -q tests/test_saas_runtime_parity.py tests/test_web_api.py tests/test_web_pilot.py tests/test_product_platform_architecture.py
