name: Public Catalog Export Targeted

on:
  push:
    branches: [main]
    paths:
      - 'src/rasai/public_report_export.py'
      - 'tests/test_public_report_export.py'
      - 'docs/PUBLIC_REPORT_EXPORT.md'
      - '.github/workflows/public-catalog-export-targeted.yml'
  pull_request:
    paths:
      - 'src/rasai/public_report_export.py'
      - 'tests/test_public_report_export.py'
      - 'docs/PUBLIC_REPORT_EXPORT.md'
      - '.github/workflows/public-catalog-export-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-export:
    name: Offline candidate export on Windows and Linux
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install local runtime and pytest (no browser or external providers)
        run: python -m pip install -e . pytest
      - name: Test only public export integrity and security contracts
        run: python -m pytest -q tests/test_public_report_export.py
