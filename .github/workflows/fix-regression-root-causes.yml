name: Fix full regression root causes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path

          nav = Path('src/rasai/report_navigation.py')
          text = nav.read_text(encoding='utf-8')
          old_import = 'from rasai.report_contract import CANONICAL_NAV_ITEMS\n'
          new_import = 'from rasai.report_contract import CANONICAL_NAV_ITEMS, REPORT_ALIASES\n'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('report contract import not found')
          old_loop = '    for html_path in sorted(report_dir.glob("*.html")):\n        html = html_path.read_text(encoding="utf-8")\n'
          new_loop = '    for html_path in sorted(report_dir.glob("*.html")):\n        if html_path.name in REPORT_ALIASES:\n            continue\n        html = html_path.read_text(encoding="utf-8")\n'
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
              raise SystemExit('navigation loop not found')
          nav.write_text(text, encoding='utf-8', newline='\n')

          m26 = Path('src/rasai/m26_reporting.py')
          text = m26.read_text(encoding='utf-8')
          old = 'o RASAi não converte essa declaração em prova de coleta autenticada no sistema externo.'
          new = 'o RASAi não autentica o portal externo nem afirma que realizou coleta direta; a declaração de origem não é convertida em prova de coleta autenticada no sistema externo.'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('OGV provenance sentence not found')
          m26.write_text(text, encoding='utf-8', newline='\n')

          m21test = Path('tests/test_m21_web_performance.py')
          text = m21test.read_text(encoding='utf-8')
          text = text.replace(
              'def test_report_keeps_external_metrics_separate_from_score_geo_003(self) -> None:',
              'def test_report_keeps_external_metrics_separate_from_score_geo_004(self) -> None:',
          )
          text = text.replace('self.assertIn("SCORE-GEO-003", html)', 'self.assertIn("SCORE-GEO-004", html)')
          m21test.write_text(text, encoding='utf-8', newline='\n')
      - name: Remove one-shot workflow
        run: git rm .github/workflows/fix-regression-root-causes.yml
      - name: Commit fixes
        run: |
          git config user.name "RASAi regression repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/rasai/report_navigation.py src/rasai/m26_reporting.py tests/test_m21_web_performance.py
          git commit -m "Fix report alias normalization and stale regression contracts"
          git push origin HEAD:main
