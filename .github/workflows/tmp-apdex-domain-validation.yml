name: Temporary isolated Apdex domain validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apdex-domain-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run isolated mobile measurements sequentially
        shell: bash
        run: |
          python - <<'PY' | tee apdex-isolated-validation.json
          import json, math, statistics, time
          from rasai.m23_apdex import _classification as nav_classify
          from rasai.m23_apdex_profiles import MOBILE_STANDARD_PROFILE, PlaywrightSyntheticNavigationGateway
          from rasai.m25_apdex_experience import Calibration, PlaywrightSyntheticUxGateway, classify_measurement

          URL = "https://loja.bradescoseguros.com.br/"
          N = 10
          TIMEOUT = 30.0
          SETTLE = 5.0
          DELAY = 1.0
          calibration = Calibration(source="ISOLATED_VALIDATION", kpm="USER_ACTION_DURATION", satisfied_threshold_seconds=3.0, frustrated_threshold_seconds=12.0, errors_affect_apdex=True, metadata={})

          def pct(values, q):
              v = sorted(float(x) for x in values if x is not None and math.isfinite(float(x)))
              if not v: return None
              if len(v) == 1: return v[0]
              p = (len(v)-1)*q; lo=math.floor(p); hi=math.ceil(p)
              return v[lo] if lo == hi else v[lo]*(1-(p-lo))+v[hi]*(p-lo)

          def summary(rows, key):
              valid=[r for r in rows if r["classification"] is not None]
              vals=[r[key] for r in valid if r.get(key) is not None]
              cut=max(1,len(valid)//2)
              first=[r[key] for r in valid[:cut] if r.get(key) is not None]
              second=[r[key] for r in valid[cut:] if r.get(key) is not None]
              s=sum(r["classification"]=="SATISFIED" for r in valid); t=sum(r["classification"]=="TOLERATING" for r in valid); f=sum(r["classification"]=="FRUSTRATED" for r in valid)
              return {"attempts":len(rows),"valid":len(valid),"invalid":len(rows)-len(valid),"valid_ratio":len(valid)/len(rows) if rows else 0,"apdex":(s+.5*t)/len(valid) if valid else None,"counts":{"SATISFIED":s,"TOLERATING":t,"FRUSTRATED":f},"p50_ms":pct(vals,.5),"p75_ms":pct(vals,.75),"p95_ms":pct(vals,.95),"first_half_mean_ms":statistics.fmean(first) if first else None,"second_half_mean_ms":statistics.fmean(second) if second else None}

          nav_rows=[]
          nav=PlaywrightSyntheticNavigationGateway()
          nav_env=nav.environment()
          try:
              for i in range(1,N+1):
                  m=nav.measure(url=URL,profile=MOBILE_STANDARD_PROFILE,timeout_seconds=TIMEOUT)
                  nav_rows.append({"sample":i,"status":m.status,"duration_ms":m.duration_ms,"http_status":m.http_status,"final_url":m.final_url,"classification":nav_classify(m,3.0),"error_code":m.error_code,"profile_applied":m.profile_applied})
                  time.sleep(DELAY)
          finally:
              nav.close()

          ux_rows=[]
          ux=PlaywrightSyntheticUxGateway(session_mode="cold")
          ux_env=ux.environment()
          try:
              for i in range(1,N+1):
                  m=ux.measure(url=URL,device="MOBILE",profile=MOBILE_STANDARD_PROFILE,timeout_seconds=TIMEOUT,settle_seconds=SETTLE)
                  c,v,forced=classify_measurement(m,calibration,error_scope="first-party")
                  ux_rows.append({"sample":i,"status":m.status,"user_action_duration_ms":m.user_action_duration_ms,"kpm_value_ms":v,"navigation_duration_ms":m.navigation_duration_ms,"load_event_end_ms":m.load_event_end_ms,"http_status":m.http_status,"final_url":m.final_url,"classification":c,"error_forced_frustrated":forced,"javascript_error_count":m.javascript_error_count,"console_error_count":m.console_error_count,"request_failed_count":m.request_failed_count,"first_party_request_failed_count":m.first_party_request_failed_count,"http_error_count":m.http_error_count,"first_party_http_error_count":m.first_party_http_error_count,"xhr_fetch_count":m.xhr_fetch_count,"dynamic_resource_count":m.dynamic_resource_count,"network_settled":m.network_settled,"error_code":m.error_code,"profile_applied":m.profile_applied})
                  time.sleep(DELAY)
          finally:
              ux.close()

          ns=summary(nav_rows,"duration_ms"); us=summary(ux_rows,"user_action_duration_ms")
          forced=sum(bool(r["error_forced_frustrated"]) for r in ux_rows if r["classification"] is not None)
          console_samples=sum((r["console_error_count"] or 0)>0 for r in ux_rows)
          js_samples=sum((r["javascript_error_count"] or 0)>0 for r in ux_rows)
          fp_req_samples=sum((r["first_party_request_failed_count"] or 0)>0 or (r["first_party_http_error_count"] or 0)>0 for r in ux_rows)
          blocked=sum(r.get("http_status") in {403,429} for r in nav_rows+ux_rows)
          susp=[]
          if ns["valid_ratio"]<.8: susp.append("NAVIGATION_COLLECTION_VALID_RATIO_BELOW_80_PERCENT")
          if us["valid_ratio"]<.8: susp.append("EXPERIENCE_COLLECTION_VALID_RATIO_BELOW_80_PERCENT")
          if us["apdex"] is not None and not (.35<=us["apdex"]<=.75): susp.append("EXPERIENCE_APDEX_OUTSIDE_BROAD_DIAGNOSTIC_TOLERANCE_AROUND_REFERENCE")
          if us["valid"] and forced/us["valid"]>=.5: susp.append("EXPERIENCE_ERROR_FORCED_FRUSTRATED_AT_LEAST_50_PERCENT")
          for label,x in (("NAVIGATION",ns),("EXPERIENCE",us)):
              if x["first_half_mean_ms"] and x["second_half_mean_ms"] and x["second_half_mean_ms"]>x["first_half_mean_ms"]*1.5: susp.append(label+"_SECOND_HALF_MEAN_OVER_50_PERCENT_WORSE")
          if blocked: susp.append("HTTP_403_OR_429_OBSERVED_DURING_BATTERY")
          print(json.dumps({"url":URL,"device":"MOBILE","samples_per_mode":N,"execution_pattern":"SEQUENTIAL_ISOLATED_RUNTIMES","criteria":{"navigation":"T=3s; <=3 S; >3..12 T; >12/error F","experience":"USER_ACTION_DURATION; <3 S; 3..12 T; >12/error F; JS/pageerror+console.error global; request errors first-party"},"environments":{"navigation":nav_env,"experience":ux_env,"profile":MOBILE_STANDARD_PROFILE.as_dict()},"navigation":{"summary":ns,"samples":nav_rows},"experience":{"summary":us,"forced_frustrated_samples":forced,"samples_with_console_error":console_samples,"samples_with_javascript_error":js_samples,"samples_with_first_party_request_error":fp_req_samples,"user_reference_apdex":[.5,.6],"samples":ux_rows},"blocked_403_429_observations":blocked,"routine_suspicions":susp},ensure_ascii=False,indent=2))
          PY
      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: isolated-apdex-mobile-validation
          path: apdex-isolated-validation.json
