name: RASAi consolidated backlog remediation v2

on:
  push:
    branches: [main]
    paths:
      - .rasai-backlog-trigger-v2

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply consolidated backlog patch
        run: python .github/rasai_backlog_fix_v2.py

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            src/rasai/m5.py \
            src/rasai/m6.py \
            src/rasai/scoring.py \
            src/rasai/openai_provider.py \
            src/rasai/m18_ai.py \
            src/rasai/provider_extensions.py \
            src/rasai/m11.py \
            src/rasai/m17_reporting.py \
            src/rasai/reporting.py \
            src/rasai/m23_apdex.py \
            src/rasai/m23_reporting.py \
            src/rasai/m23_apdex_profiles.py \
            src/rasai/report_semantics.py \
            src/rasai/external_metrics_integrity.py

      - name: Run targeted regressions
        run: |
          python -m pytest -q \
            tests/test_consolidated_backlog_regressions.py \
            tests/test_m6_javascript_spa.py \
            tests/test_m23_integration.py \
            tests/test_openai_provider_hardening.py \
            tests/test_ai_retry_fallback_observability.py \
            tests/test_report_semantics.py \
            tests/test_hotfix_ai_reporting_integrity.py \
            tests/test_m21_web_performance.py

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Verify no temporary files enter final main
        run: |
          rm -f \
            .github/workflows/rasai-consolidated-backlog-fix.yml \
            .rasai-backlog-trigger \
            .github/workflows/rasai-consolidated-backlog-fix-v2.yml \
            .github/rasai_backlog_fix_v2.py \
            .rasai-backlog-trigger-v2
          git status --short

      - name: Commit validated remediation directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix consolidated RASAi audit backlog"
          git push origin HEAD:main
