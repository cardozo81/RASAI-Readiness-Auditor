name: Dynatrace RUM USQL 355 aggregates
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/dynatrace_rum_population_355.py'
      - 'tests/test_dynatrace_rum_population_355.py'
      - 'docs/APDEX_DYNATRACE_ARCH_ADVISORY_355.md'
      - '.github/workflows/dynatrace-rum-usql-355.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/dynatrace_rum_population_355.py'
      - 'tests/test_dynatrace_rum_population_355.py'
      - '.github/workflows/dynatrace-rum-usql-355.yml'
permissions:
  contents: read
jobs:
  scoped-rum-aggregates:
    name: USQL aggregated RUM actions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test USQL response contract via fake HTTP
        run: python -m pytest -q tests/test_dynatrace_rum_population_355.py
