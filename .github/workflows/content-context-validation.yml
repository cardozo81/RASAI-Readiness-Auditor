name: Temporary content context validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/searchgeo/content_context.py'
      - 'src/searchgeo/content_context_persistence.py'
      - 'src/searchgeo/indicator_provenance.py'
      - 'src/searchgeo/openai_provider.py'
      - 'src/searchgeo/m20_ai.py'
      - 'src/searchgeo/m20_reporting.py'
      - 'src/searchgeo/provider_runtime_policy.py'
      - 'src/searchgeo/console_config.py'
      - 'src/searchgeo/console_environment.py'
      - 'src/searchgeo/report_semantics.py'
      - 'src/searchgeo/report_navigation.py'
      - 'src/searchgeo/rule_references.py'
      - 'tests/test_content_analysis_context.py'
      - 'tests/test_indicator_provenance.py'
      - 'tests/test_console_environment_guidance.py'
      - 'tests/test_m20_content_remediation.py'
      - 'docs/CONTENT_ANALYSIS_CONTEXT.md'
      - 'docs/INDICATOR_PROVENANCE.md'
      - 'docs/AI_GUIDE.md'
      - 'docs/CONFIGURATION.md'
      - 'docs/ENVIRONMENT_VARIABLES.md'
      - 'docs/INTERACTIVE_CONSOLE.md'
      - 'docs/RULES_GUIDE.md'
      - 'docs/SCORING_GUIDE.md'
      - 'docs/specification/15_ERROR_CENTRIC_REPORT_UX.md'
      - 'docs/specification/20_AI_CONTENT_REMEDIATION.md'
      - '.github/workflows/content-context-validation.yml'

permissions:
  contents: write

jobs:
  content-context-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic provenance integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str, *, required: bool = True) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  if required:
                      raise SystemExit(f'patch anchor not found: {path}: {old[:80]!r}')
                  return
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          patch(
              'src/searchgeo/report_semantics.py',
              'from typing import Any\n',
              'from typing import Any\n\nfrom searchgeo.indicator_provenance import enrich_indicator_provenance_html\n',
          )
          patch(
              'src/searchgeo/report_semantics.py',
              '    elif page_name == "web-performance.html":\n        html = _enhance_web_performance(html)\n    return html\n\n\ndef _decorate_metrics',
              '    elif page_name == "web-performance.html":\n        html = _enhance_web_performance(html)\n    return enrich_indicator_provenance_html(html, page_name=page_name)\n\n\ndef _decorate_metrics',
          )
          patch(
              'tests/test_m20_content_remediation.py',
              'self.assertEqual(attempt["contract_version"], "M20-CONTENT-REMEDIATION-v1")',
              'self.assertEqual(attempt["contract_version"], "M20-CONTENT-REMEDIATION-v2")',
          )
          patch(
              'src/searchgeo/report_navigation.py',
              '"BR-GEO-054": "Integridade do auditor · Verifica a reprodutibilidade do SCORE-GEO-001 persistido."',
              '"BR-GEO-054": "Integridade do auditor · Verifica a reprodutibilidade do SCORE-GEO-002 persistido."',
          )
          patch(
              'docs/RULES_GUIDE.md',
              'A coluna **Scoring** informa a dimensão de `SCORE-GEO-001`.',
              'A coluna **Scoring** informa a dimensão vigente de `SCORE-GEO-002`.',
          )
          patch(
              'docs/RULES_GUIDE.md',
              'recalcula `SCORE-GEO-001`, reabre scores/contributions e compara resultados',
              'recalcula `SCORE-GEO-002`, reabre scores/contributions e compara resultados',
          )

          additions = {
              'docs/SCORING_GUIDE.md': '''\n\n## Proveniência metodológica dos indicadores\n\nO relatório final classifica explicitamente a natureza dos indicadores e separa standards externos, orientação oficial de plataforma, métricas externas definidas, heurísticas SearchGEO, telemetria e saídas de IA. Consulte [INDICATOR_PROVENANCE.md](INDICATOR_PROVENANCE.md).\n\n`references.html#indicator-provenance` reproduz essa fronteira no próprio relatório, com fonte/entidade, link oficial quando aplicável e a parte específica implementada pelo SearchGEO.\n''',
              'docs/RULES_GUIDE.md': '''\n\n## Proveniência metodológica\n\nA classificação `OFFICIAL` / `STANDARD` / `HEURISTIC` de cada BR-GEO deve ser lida junto às fontes exibidas no report. Uma referência externa não promove automaticamente uma heurística a standard. O inventário consolidado está em [INDICATOR_PROVENANCE.md](INDICATOR_PROVENANCE.md) e em `report/references.html#indicator-provenance`.\n''',
              'docs/specification/15_ERROR_CENTRIC_REPORT_UX.md': '''\n\n## 17. Proveniência metodológica dos indicadores\n\nToda página final deve informar, de forma compacta e visível, a natureza dos indicadores centrais exibidos. `references.html` deve consolidar indicador, classificação metodológica, fonte/entidade, link oficial quando existir, lógica externa aplicável e decisão/transformação específica do SearchGEO.\n\nTaxonomia pública mínima: `RAW_OBSERVATION`, `EXTERNAL_STANDARD`, `OFFICIAL_PLATFORM_GUIDANCE`, `EXTERNAL_DEFINED_METRIC`, `SEARCHGEO_HEURISTIC`, `OPERATIONAL_TELEMETRY` e `AI_DERIVED_ADVISORY`.\n\nInformação metodológica essencial não pode depender somente de tooltip. Uma fonte oficial valida apenas o fenômeno no seu escopo e nunca deve ser usada para sugerir homologação externa do `SCORE-GEO-002`.\n''',
          }
          for path, block in additions.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              marker = block.strip().splitlines()[0]
              if marker not in text:
                  p.write_text(text.rstrip() + block + '\n', encoding='utf-8', newline='\n')
          PY

          if ! git diff --quiet; then
            git config user.name 'SearchGEO validation automation'
            git config user.email 'actions@users.noreply.github.com'
            git add src/searchgeo/report_semantics.py src/searchgeo/report_navigation.py tests/test_m20_content_remediation.py docs/RULES_GUIDE.md docs/SCORING_GUIDE.md docs/specification/15_ERROR_CENTRIC_REPORT_UX.md
            git commit -m 'Integrar proveniência dos indicadores e alinhar SCORE-GEO-002'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Install Chromium for report/browser regressions
        run: python -m playwright install --with-deps chromium

      - name: Compile changed Python surface
        run: |
          python -m compileall -q \
            src/searchgeo/content_context.py \
            src/searchgeo/content_context_persistence.py \
            src/searchgeo/indicator_provenance.py \
            src/searchgeo/openai_provider.py \
            src/searchgeo/m20_ai.py \
            src/searchgeo/m20_reporting.py \
            src/searchgeo/provider_runtime_policy.py \
            src/searchgeo/console_config.py \
            src/searchgeo/console_environment.py \
            src/searchgeo/report_semantics.py \
            src/searchgeo/report_navigation.py \
            src/searchgeo/rule_references.py

      - name: Targeted context and report regressions
        run: |
          python -m pytest -q \
            tests/test_content_analysis_context.py \
            tests/test_indicator_provenance.py \
            tests/test_console_environment_guidance.py \
            tests/test_openai_provider_hardening.py \
            tests/test_m20_content_remediation.py \
            tests/test_interactive_console.py \
            tests/test_console_progress_guidance.py

      - name: Full regression suite
        run: python -m pytest -q
