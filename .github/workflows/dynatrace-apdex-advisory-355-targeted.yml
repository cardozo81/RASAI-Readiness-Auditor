name: Dynatrace Apdex architecture advisory 355 (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/dynatrace_apdex_arch_advisory_355.py'
      - 'src/rasai/dynatrace_effective_values_adapter_355.py'
      - 'src/rasai/dynatrace_apdex_review_cli_355.py'
      - 'tests/test_dynatrace_apdex_arch_advisory_355.py'
      - 'docs/APDEX_DYNATRACE_ARCH_ADVISORY_355.md'
      - '.github/workflows/dynatrace-apdex-advisory-355-targeted.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/dynatrace_apdex_arch_advisory_355.py'
      - 'src/rasai/dynatrace_effective_values_adapter_355.py'
      - 'src/rasai/dynatrace_apdex_review_cli_355.py'
      - 'tests/test_dynatrace_apdex_arch_advisory_355.py'
      - '.github/workflows/dynatrace-apdex-advisory-355-targeted.yml'

permissions:
  contents: read

jobs:
  dynatrace-apdex-advisory:
    name: Dynatrace RUM advisory no-provider regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Architecture-specific RUM advice and unchanged synthetic observations
        run: >-
          python -m pytest -q
          tests/test_dynatrace_apdex_arch_advisory_355.py
          tests/test_apdex_content_readiness_322.py
