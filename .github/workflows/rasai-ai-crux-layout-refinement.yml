name: RASAi AI CrUX layout refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/rasai_ai_crux_layout_refinement.py'
      - '.github/workflows/rasai-ai-crux-layout-refinement.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rasai-ai-crux-layout-refinement
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Apply refinement
        run: python .github/rasai_ai_crux_layout_refinement.py
      - name: Compile changed runtime
        run: python -m compileall -q src/rasai
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Targeted regression
        run: >-
          pytest -q
          tests/test_ai_crux_layout_refinement.py
          tests/test_provider_extensions.py
          tests/test_provider_extensions_m20.py
          tests/test_m18_multi_ai_provider.py
          tests/test_m18_timeout_and_report_layout.py
          tests/test_m24_crawling_discovery.py
          tests/test_report_semantics.py
          tests/test_report_navigation_normalization.py
          tests/test_consolidated_backlog_regressions.py
      - name: Full regression
        run: pytest -q
      - name: Commit validated refinement
        if: success()
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git rm -f .github/rasai_ai_crux_layout_refinement.py .github/workflows/rasai-ai-crux-layout-refinement.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'Refine AI diagnostics CrUX traceability and report layout'
          git push origin HEAD:main
