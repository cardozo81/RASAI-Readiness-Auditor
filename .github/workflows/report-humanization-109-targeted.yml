name: Humanização contextual de relatórios - testes pontuais

on:
  pull_request:
    paths:
      - 'src/rasai/catalog_report_public_labels.py'
      - 'src/rasai/catalog_report_search_trust.py'
      - 'src/rasai/report_presentation.py'
      - 'tests/test_report_humanization_109.py'
      - '.github/workflows/report-humanization-109-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  humanization-109:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Only changed report presentation surfaces
        run: >-
          python -m pytest -q
          tests/test_report_humanization_109.py
          tests/test_report_presentation.py
          tests/test_user_facing_language_contract.py
