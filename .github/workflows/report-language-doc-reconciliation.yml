name: Temporary report language reconciliation

on:
  push:
    branches:
      - fix/report-language-doc-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message != 'Reconcile report language and documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          milestone_names = {
              0: 'Bootstrap e fundação do projeto',
              1: 'Auditoria e persistência',
              2: 'Descoberta e aquisição HTTP',
              3: 'Renderização Desktop e Mobile',
              4: 'Extração e evidências',
              5: 'Motor de regras determinísticas',
              6: 'JavaScript e SPA',
              7: 'Análise semântica e fallback',
              8: 'Comparação Desktop e Mobile',
              9: 'Scoring e confiabilidade',
              10: 'Priorização e recomendações',
              11: 'Relatório HTML estático',
              12: 'Testes críticos e baseline local estável',
              13: 'Remediação GEO acionável',
              14: 'Auditoria multi-URL e evidência visual',
              15: 'Experiência e organização dos relatórios',
              16: 'Remediação por causa raiz e elemento',
              17: 'Precisão e consistência das recomendações',
              18: 'Análise semântica por IA, roteamento e telemetria',
              19: 'Aplicabilidade e mínimos do SearchGEO Readiness',
              20: 'Sugestões e remediação de conteúdo por IA',
              21: 'Web Performance externo',
              22: 'Acessibilidade automatizada e diagnósticos Web',
              23: 'Synthetic Navigation Apdex',
              24: 'Rastreamento, descoberta e acesso de crawlers',
              25: 'Synthetic User Experience Apdex',
              26: 'Observed Generative Visibility',
          }

          standalone = re.compile(r'(?<![\w-])M(\d{1,2})(?![\w-])')
          def replace_milestones(text: str) -> str:
              def repl(m: re.Match[str]) -> str:
                  n = int(m.group(1))
                  return milestone_names.get(n, 'etapa de implementação')
              return standalone.sub(repl, text)

          # Documentation: remove delivery-milestone labels from prose while
          # preserving versioned internal identifiers such as M20-CONTENT-*.
          docs = [ROOT / 'README.md', *sorted((ROOT / 'docs').rglob('*.md'))]
          for path in docs:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = replace_milestones(text)
              text = text.replace(
                  '**Status:** IMPLEMENTADO EM BRANCH — aguardando smoke humano antes de merge.',
                  '**Status:** INTEGRADO E VALIDADO.**'
              )
              text = text.replace(
                  '**Status:** IMPLEMENTAÇÃO EM BRANCH',
                  '**Status:** INTEGRADO E VALIDADO.'
              )
              text = text.replace(
                  '**Status:** APPROVED BASELINE + Auditoria multi-URL e evidência visual/Experiência e organização dos relatórios/Remediação por causa raiz e elemento/Precisão e consistência das recomendações/Análise semântica por IA, roteamento e telemetria/Sugestões e remediação de conteúdo por IA/Web Performance externo/Acessibilidade automatizada e diagnósticos Web/Synthetic Navigation Apdex/Rastreamento, descoberta e acesso de crawlers/Synthetic User Experience Apdex INTEGRADOS + Observed Generative Visibility EM BRANCH + SCORE-GEO-002 + SGRI-001 + REPORT-SITE-GEO-001',
                  '**Status:** BASELINE VIGENTE — capacidades integradas e documentação reconciliada com `main`.'
              )
              text = text.replace('## Evoluções formalizadas', '## Especificações funcionais complementares')
              text = text.replace('## Fronteiras dos marcos externos/non-scoring', '## Fronteiras dos domínios complementares')
              text = text.replace('| Marco | Domínio | Regra de fronteira |', '| Domínio | Finalidade | Regra de fronteira |')
              text = text.replace('## Critério de encerramento de marco', '## Critério de encerramento de alteração')
              text = text.replace('Branches de marco são temporárias.', 'Branches de trabalho são temporárias.')
              text = text.replace('branch de marco', 'branch de trabalho').replace('branches de marco', 'branches de trabalho')
              text = text.replace('marco concorrente', 'alteração concorrente').replace('marco implementado', 'alteração implementada')
              path.write_text(text, encoding='utf-8', newline='\n')

          # Reconcile known stale status/capability language.
          readme = ROOT / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Em implementação no Observed Generative Visibility, sem alterar scoring:', 'Observed Generative Visibility, sem alterar scoring:')
          if '## Operação sem IA' not in text:
              marker = '\n## IA\n'
              section = '''\n## Operação sem IA\n\nA IA é opcional. Com `--ai-provider none`, o SearchGEO continua executando as análises determinísticas de acesso técnico, redirects/TLS, indexabilidade, extração de conteúdo, crawling/discovery e comparação entre dispositivos. Synthetic Navigation Apdex e Synthetic User Experience Apdex também são independentes de LLM quando habilitados. Lighthouse/Core Web Vitals permanecem independentes de IA, mas dependem das respectivas fontes externas quando configuradas.\n\nAs dimensões predominantemente semânticas podem permanecer `UNKNOWN`/`NOT_CONSOLIDATED` sem IA. Isso reduz Coverage e pode impedir o Overall do SGRI-001; não transforma ausência de IA em falha do website e não aplica score zero artificial.\n'''
              text = text.replace(marker, section + marker)
          readme.write_text(text, encoding='utf-8', newline='\n')

          report_guide = ROOT / 'docs/REPORT_GUIDE.md'
          text = report_guide.read_text(encoding='utf-8')
          if '## Linguagem para o analista' not in text:
              text += '''\n\n## Linguagem para o analista\n\nO público principal dos relatórios é o profissional de análise de dados e SEO. O HTML deve explicar o fenômeno medido, o impacto, a evidência e a limitação sem exigir conhecimento de Python, SQLite, nomes de módulos, tabelas ou contratos internos.\n\nTermos técnicos podem permanecer quando forem documentados por fonte pública reconhecida e difundidos no domínio, como canonical, robots.txt, HTTP/HTTPS, TLS, JSON-LD, Schema.org, Lighthouse, Core Web Vitals, CrUX, LCP, INP, CLS, WCAG e Apdex. Termos menos triviais devem receber contexto, tooltip ou glossário.\n\nIdentificadores internos de implementação, nomes de módulos, classes, tabelas, parâmetros de runtime e códigos de entrega não devem compor a leitura principal. Códigos BR-GEO podem aparecer apenas como referência secundária de rastreabilidade.\n'''
          report_guide.write_text(text, encoding='utf-8', newline='\n')

          glossary = ROOT / 'docs/specification/11_REPORTING_LANGUAGE_GLOSSARY.md'
          text = glossary.read_text(encoding='utf-8')
          if '### Linguagem orientada ao analista' not in text:
              text += '''\n\n### Linguagem orientada ao analista\n\nA apresentação HTML é destinada a profissionais de análise de dados e SEO, não a desenvolvedores do SearchGEO. Termos técnicos só devem aparecer na leitura principal quando tiverem fonte pública reconhecida e uso difundido no domínio. Vocabulário interno de implementação deve permanecer fora da interface principal; quando tecnicamente necessário para suporte, deve ficar recolhido em detalhes técnicos e acompanhado de explicação humana. Identificadores históricos de etapas de entrega não fazem parte do vocabulário do produto e não devem aparecer em relatórios, console ou documentação operacional.\n'''
          glossary.write_text(text, encoding='utf-8', newline='\n')

          decisions = ROOT / 'docs/specification/10_DECISIONS.md'
          text = decisions.read_text(encoding='utf-8')
          if '### D-041 — Linguagem pública por domínio funcional' not in text:
              text += '''\n\n### D-041 — Linguagem pública por domínio funcional\n\nA documentação de produto, o console e os relatórios destinados ao usuário devem nomear capacidades pelo domínio funcional, não por identificadores históricos de etapas de entrega. Termos técnicos na apresentação só são admitidos quando documentados por fonte pública reconhecida e difundidos no domínio; vocabulário de código/runtime deve ficar oculto da leitura principal. O público-alvo primário é o analista de dados/SEO.\n'''
          decisions.write_text(text, encoding='utf-8', newline='\n')

          reqs = ROOT / 'docs/specification/07_FUNCTIONAL_REQUIREMENTS.md'
          text = reqs.read_text(encoding='utf-8')
          if '### FR-GEO-173' not in text:
              text += '''\n\n### FR-GEO-173\nA camada de apresentação não deve expor identificadores históricos de etapas de entrega; capacidades devem ser nomeadas pelo domínio funcional.\n\n### FR-GEO-174\nO HTML deve ser compreensível por analista de dados/SEO sem conhecimento do código, preservando apenas termos técnicos externamente documentados e difundidos, com contexto/glossário quando necessário.\n\n### FR-GEO-175\nEstados `UNAVAILABLE`, `INCOMPLETE`, ausência de evidência ou coleta não executada devem ser apresentados de forma neutra e nunca como resultado ruim, zero ou ausência de falha do website.\n'''
          reqs.write_text(text, encoding='utf-8', newline='\n')

          # User-facing source modules: remove standalone delivery labels only.
          user_facing = [
              'src/searchgeo/m18_reporting.py',
              'src/searchgeo/m20_reporting.py',
              'src/searchgeo/m21_reporting.py',
              'src/searchgeo/m22_quality_domains.py',
              'src/searchgeo/m23_reporting.py',
              'src/searchgeo/m24_reporting.py',
              'src/searchgeo/m25_reporting.py',
              'src/searchgeo/m26_reporting.py',
              'src/searchgeo/report_consistency_v2.py',
              'src/searchgeo/report_navigation.py',
              'src/searchgeo/report_semantics.py',
              'src/searchgeo/searchgeo_readiness_reporting.py',
              'src/searchgeo/indicator_provenance.py',
              'src/searchgeo/console_help.py',
              'src/searchgeo/source_quality_report_summary.py',
          ]
          for name in user_facing:
              path = ROOT / name
              if path.exists():
                  path.write_text(replace_milestones(path.read_text(encoding='utf-8')), encoding='utf-8', newline='\n')

          # Human-facing wording cleanup.
          replacements = {
              'non-scoring': 'informativo; não altera o índice',
              'outcome observado': 'visibilidade observada',
              'provider FALLBACK': 'avaliação determinística sem IA',
              'provider <strong>FALLBACK</strong>': 'método <strong>avaliação determinística sem IA</strong>',
              'scoring_impact=NONE': 'sem impacto no SearchGEO Readiness Index',
              'não cria RuleExecution/ScoreContribution': 'não altera regras nem o SearchGEO Readiness Index',
              'Projeção estática derivada do audit.db': 'Relatório gerado a partir dos dados persistidos da auditoria',
          }
          for name in user_facing:
              path = ROOT / name
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8', newline='\n')

          # Distinguish intentional AI disablement from missing credentials.
          semantic = ROOT / 'src/searchgeo/semantic.py'
          text = semantic.read_text(encoding='utf-8')
          text = text.replace('ProviderCallResult(ProviderState.NOT_CONFIGURED, reason="AI_NOT_CONFIGURED")', 'ProviderCallResult(ProviderState.NOT_CONFIGURED, reason="AI_DISABLED_BY_CONFIGURATION")', 1)
          semantic.write_text(text, encoding='utf-8', newline='\n')

          # Neutral presentation for missing evidence; zero automated occurrences
          # are not proof that no accessibility issue exists.
          sem = ROOT / 'src/searchgeo/report_semantics.py'
          text = sem.read_text(encoding='utf-8')
          text = text.replace(
              'return ("good", "Sem falhas detectadas", True) if number == 0 else ("bad", "Correção necessária", True)',
              'return ("neutral", "Nenhuma ocorrência registrada", True) if number == 0 else ("bad", "Correção necessária", True)'
          )
          text = text.replace(
              'if key == "cwv":\n            if normalized == "pass":\n                return "good", "Aprovado no p75", True\n            if normalized == "fail":\n                return "bad", "Não aprovado no p75", True',
              'if key == "cwv":\n            if normalized == "pass":\n                return "good", "Aprovado no p75", True\n            if normalized == "fail":\n                return "bad", "Não aprovado no p75", True\n            if normalized in {"unavailable", "incomplete", "—", "-", "n/a", "não disponível", "nao disponivel"}:\n                return "neutral", "Dados de campo indisponíveis", True'
          )
          sem.write_text(text, encoding='utf-8', newline='\n')

          # Final report reconciliation: translate selected internal reason codes
          # without touching raw artifacts/evidence captured from the website.
          consistency = ROOT / 'src/searchgeo/report_consistency_v2.py'
          text = consistency.read_text(encoding='utf-8')
          if '_USER_REASON_REPLACEMENTS' not in text:
              insert = '''\n_USER_REASON_REPLACEMENTS: tuple[tuple[str, str], ...] = (\n    ("AI_DISABLED_BY_CONFIGURATION", "Análise por IA desabilitada nesta execução"),\n    ("AI_NOT_CONFIGURED", "IA selecionada sem credencial/configuração disponível"),\n    ("LIGHTHOUSE_RESULT_MISSING", "O Lighthouse não retornou um resultado utilizável"),\n    ("RESULT_MISSING", "A fonte externa não retornou o resultado esperado"),\n    ("RESOURCE_EXHAUSTED", "Limite de quota do serviço externo atingido"),\n)\n'''
              text = text.replace('_PRESENTATION_REPLACEMENTS: tuple[tuple[str, str], ...] = (', insert + '\n_PRESENTATION_REPLACEMENTS: tuple[tuple[str, str], ...] = (', 1)
              text = text.replace(
                  'for old, new in _PRESENTATION_REPLACEMENTS:\n        html = html.replace(old, new)',
                  'for old, new in _PRESENTATION_REPLACEMENTS:\n        html = html.replace(old, new)\n    for old, new in _USER_REASON_REPLACEMENTS:\n        html = html.replace(old, new)'
              )
          consistency.write_text(text, encoding='utf-8', newline='\n')

          # Add a glossary panel to the final references page using only
          # externally documented / widely used terms.
          nav = ROOT / 'src/searchgeo/report_navigation.py'
          text = nav.read_text(encoding='utf-8')
          if 'GLOSSARY_ANALYST_V1' not in text:
              marker = 'BRASILIA_TIMEZONE = ZoneInfo("America/Sao_Paulo")'
              glossary_block = '''GLOSSARY_ANALYST_V1 = (\n    ("Apdex", "Índice de satisfação baseado em tempos de resposta e limiar T."),\n    ("canonical", "Sinal que indica a URL preferencial entre páginas equivalentes ou muito semelhantes."),\n    ("Core Web Vitals", "Conjunto de métricas de experiência do usuário do ecossistema Chrome/Google."),\n    ("CrUX", "Chrome UX Report, fonte de dados agregados de experiência real quando há amostra suficiente."),\n    ("JSON-LD", "Formato JSON para dados vinculados, comumente usado para Structured Data."),\n    ("Lighthouse", "Ferramenta automatizada de auditoria de qualidade Web mantida no ecossistema Chrome."),\n    ("LCP", "Largest Contentful Paint."),\n    ("INP", "Interaction to Next Paint."),\n    ("CLS", "Cumulative Layout Shift."),\n    ("RUM", "Real User Monitoring; observação de usuários reais, diferente dos testes sintéticos do SearchGEO."),\n    ("TLS", "Protocolo de segurança usado por HTTPS para autenticação e proteção da conexão."),\n    ("WCAG", "Web Content Accessibility Guidelines, recomendações do W3C para acessibilidade Web."),\n)\n\n'''
              text = text.replace(marker, glossary_block + marker, 1)
          nav.write_text(text, encoding='utf-8', newline='\n')

          # Regression guard: docs and SearchGEO presentation sources cannot
          # reintroduce standalone milestone labels.
          guard = ROOT / 'tests/test_user_facing_language_contract.py'
          guard.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\nimport re\n\nROOT = Path(__file__).resolve().parents[1]\nMILESTONE = re.compile(r"(?<![\\w-])M\\d{1,2}(?![\\w-])")\n\n\ndef test_documentation_has_no_standalone_delivery_milestone_labels() -> None:\n    paths = [ROOT / "README.md", *sorted((ROOT / "docs").rglob("*.md"))]\n    failures = []\n    for path in paths:\n        text = path.read_text(encoding="utf-8")\n        matches = sorted(set(MILESTONE.findall(text)))\n        if matches:\n            failures.append(f"{path.relative_to(ROOT)}: {matches}")\n    assert not failures, "\\n".join(failures)\n\n\ndef test_user_facing_templates_have_no_standalone_delivery_milestone_labels() -> None:\n    names = [\n        "m18_reporting.py", "m20_reporting.py", "m21_reporting.py",\n        "m22_quality_domains.py", "m23_reporting.py", "m24_reporting.py",\n        "m25_reporting.py", "m26_reporting.py", "report_consistency_v2.py",\n        "report_navigation.py", "report_semantics.py",\n        "searchgeo_readiness_reporting.py", "indicator_provenance.py",\n        "console_help.py", "source_quality_report_summary.py",\n    ]\n    failures = []\n    for name in names:\n        path = ROOT / "src" / "searchgeo" / name\n        text = path.read_text(encoding="utf-8")\n        matches = sorted(set(MILESTONE.findall(text)))\n        if matches:\n            failures.append(f"{name}: {matches}")\n    assert not failures, "\\n".join(failures)\n\n\ndef test_accessibility_zero_is_not_presented_as_proof_of_no_failures() -> None:\n    from searchgeo.report_semantics import enhance_report_html\n    html = "<div class='metric'><small>Falhas automatizadas</small><strong>0</strong></div>"\n    rendered = enhance_report_html(html, page_name="accessibility.html", report_dir=ROOT)\n    assert "Nenhuma ocorrência registrada" in rendered\n    assert "Sem falhas detectadas" not in rendered\n\n\ndef test_unavailable_cwv_is_neutral() -> None:\n    from searchgeo.report_semantics import enhance_report_html\n    html = "<div class='metric'><small>CWV</small><strong>UNAVAILABLE</strong></div>"\n    rendered = enhance_report_html(html, page_name="web-performance.html", report_dir=ROOT)\n    assert "Dados de campo indisponíveis" in rendered\n    assert "result-state-neutral" in rendered\n''', encoding='utf-8', newline='\n')

          # Remove the temporary workflow before committing the validated patch.
          Path('.github/workflows/report-language-doc-reconciliation.yml').unlink()
          PY
      - name: Install project
        run: python -m pip install -e .
      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_user_facing_language_contract.py \
            tests/test_report_semantics.py \
            tests/test_console_progress_guidance.py \
            tests/test_searchgeo_readiness_reporting.py
      - name: Full tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Verify no standalone milestone labels in docs/presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = re.compile(r'(?<![\w-])M\d{1,2}(?![\w-])')
          bad=[]
          for f in [Path('README.md'), *Path('docs').rglob('*.md')]:
              if p.search(f.read_text(encoding='utf-8')):
                  bad.append(str(f))
          if bad:
              raise SystemExit('milestone labels remain: ' + ', '.join(bad))
          PY
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "SearchGEO automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcile report language and documentation"
          git push origin HEAD:fix/report-language-doc-reconciliation
