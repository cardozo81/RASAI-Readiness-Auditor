name: Claim review #603 focused offline gate

on:
  pull_request:
    paths:
      - 'src/rasai/claim_aud_binding.py'
      - 'src/rasai/claim_review_batch.py'
      - 'src/rasai/claim_review_physical_gate.py'
      - 'src/rasai/report_claim_review_advisory.py'
      - 'src/rasai/contextual_documents.py'
      - 'src/rasai/document_*.py'
      - 'tests/test_contextual_documents.py'
      - 'tests/test_document_*.py'
      - 'pyproject.toml'
      - 'docs/CLAIM_VERIFICATION.md'
      - 'docs/REPORT_REMATERIALIZATION.md'
      - 'tests/test_claim_review_batch.py'
      - 'scripts/claim_review_windows_acceptance.py'
      - 'scripts/claim_review_prepare_handoff.py'
      - 'scripts/claim_review_reviewer_finalize.py'
      - 'tests/test_claim_reviewer_finalize.py'
      - 'tests/test_claim_windows_preflight.py'
      - 'tests/test_claim_private_handoff.py'
      - '.github/workflows/claim-review-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-review-offline:
    name: Physical binding and signed review contract (no provider)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline runtime and pytest
        run: python -m pip install -e ".[documents]" pytest
      - name: Compile changed claim verification modules
        run: >-
          python -m py_compile
          src/rasai/claim_aud_binding.py
          src/rasai/claim_review_batch.py
          src/rasai/claim_review_physical_gate.py
          src/rasai/report_claim_review_advisory.py
          scripts/claim_review_windows_acceptance.py
          scripts/claim_review_prepare_handoff.py
          scripts/claim_review_reviewer_finalize.py
      - name: Run focused claim physical binding and executive advisory regressions
        run: >-
          python -m pytest -q
          tests/test_claim_review_batch.py
          tests/test_claim_collection_provenance.py
          tests/test_claim_windows_preflight.py
          tests/test_claim_private_handoff.py
          tests/test_claim_reviewer_finalize.py
      - name: Passive document discovery, extraction and immutable companion (offline)
        run: >-
          python -m pytest -q
          tests/test_contextual_documents.py
          tests/test_document_text.py
          tests/test_document_advisory.py
