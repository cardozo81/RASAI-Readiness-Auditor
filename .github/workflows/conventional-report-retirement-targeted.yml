name: Conventional Report Retirement Targeted

on:
  workflow_dispatch:
  push:
    branches:
      - feat/passive-security-catalog
    paths:
      - 'src/rasai/audit_runner.py'
      - 'src/rasai/m9.py'
      - 'src/rasai/cli.py'
      - 'src/rasai/cli_extensions.py'
      - 'src/rasai/report_completion.py'
      - 'src/rasai/entrypoint.py'
      - 'src/rasai/console_entrypoint.py'
      - 'src/rasai/console_artifacts.py'
      - 'src/rasai/context_scope_runtime.py'
      - 'src/rasai/improvement_intelligence_runtime.py'
      - 'src/rasai/progress_completion_refinement.py'
      - 'src/rasai/audit_fulfillment.py'
      - 'src/rasai/governed_report_projection_runtime.py'
      - 'src/rasai/governed_analysis_runtime.py'
      - 'src/rasai/runtime_adherence_extensions.py'
      - 'src/rasai/integration_state_contract.py'
      - 'src/rasai/standards_runtime.py'
      - 'src/rasai/standards_structured_data_reconciliation.py'
      - 'src/rasai/standards_ir_reconciliation.py'
      - 'src/rasai/standards_operational_reconciliation.py'
      - 'src/rasai/standards_css_validation.py'
      - 'src/rasai/standards_gsc_observability_runtime.py'
      - 'src/rasai/external_observability_runtime.py'
      - 'src/rasai/external_observability_console.py'
      - 'src/rasai/external_observability_safety.py'
      - 'src/rasai/web/pilot.py'
      - 'src/rasai/audit_reprocess.py'
      - 'src/rasai/core_reprocessing.py'
      - 'src/rasai/core_reprocessing_context.py'
      - 'tests/test_conventional_report_retirement.py'
      - 'tests/test_m12_stable_baseline.py'
      - 'tests/test_m16_root_cause.py'
      - 'tests/test_m17_precision_reporting.py'
      - 'tests/test_web_pilot.py'
      - 'tests/test_catalog_report_site.py'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/conventional-report-retirement-targeted.yml'

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package, Web extras and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[web]' pytest

      - name: Compile only changed runtime modules
        run: |
          python -m py_compile \
            src/rasai/audit_runner.py \
            src/rasai/m9.py \
            src/rasai/cli.py \
            src/rasai/cli_extensions.py \
            src/rasai/report_completion.py \
            src/rasai/entrypoint.py \
            src/rasai/console_entrypoint.py \
            src/rasai/console_artifacts.py \
            src/rasai/context_scope_runtime.py \
            src/rasai/improvement_intelligence_runtime.py \
            src/rasai/progress_completion_refinement.py \
            src/rasai/audit_fulfillment.py \
            src/rasai/governed_report_projection_runtime.py \
            src/rasai/governed_analysis_runtime.py \
            src/rasai/runtime_adherence_extensions.py \
            src/rasai/integration_state_contract.py \
            src/rasai/standards_runtime.py \
            src/rasai/standards_structured_data_reconciliation.py \
            src/rasai/standards_ir_reconciliation.py \
            src/rasai/standards_operational_reconciliation.py \
            src/rasai/standards_css_validation.py \
            src/rasai/standards_gsc_observability_runtime.py \
            src/rasai/external_observability_runtime.py \
            src/rasai/external_observability_console.py \
            src/rasai/external_observability_safety.py \
            src/rasai/web/pilot.py \
            src/rasai/audit_reprocess.py \
            src/rasai/core_reprocessing.py \
            src/rasai/core_reprocessing_context.py

      - name: Reject imports of removed conventional report modules
        shell: bash
        run: |
          if git grep -n -E 'from rasai\.(m11|m14_reporting|m15_reporting|m16_reporting|m17_reporting|m18_reporting|m19_reporting|report_site|reporting|report_scope_clarity) import|import rasai\.(m11|m14_reporting|m15_reporting|m16_reporting|m17_reporting|m18_reporting|m19_reporting|report_site|reporting|report_scope_clarity)' -- src/rasai; then
            echo "Removed conventional-report module is still imported by runtime source."
            exit 1
          fi

      - name: Reject old report paths in primary operational flow
        shell: bash
        run: |
          files=(
            src/rasai/audit_runner.py
            src/rasai/entrypoint.py
            src/rasai/cli.py
            src/rasai/cli_extensions.py
            src/rasai/console_artifacts.py
            src/rasai/audit_reprocess.py
            src/rasai/core_reprocessing.py
            src/rasai/core_reprocessing_context.py
            src/rasai/web/pilot.py
          )
          if git grep -n -E 'report/index\.html|workspace\.root / "report"|workspace / "report"|/ "report\.html"|/ "remediation\.html"' -- "${files[@]}"; then
            echo "Conventional audit report path remains in the primary operational flow."
            exit 1
          fi

      - name: Prove catalog source stayed untouched in this scope
        shell: bash
        run: |
          baseline=e8870710cf2e0f59e4a47a897522d16f2c39e94e
          changed="$(git diff --name-only "${baseline}...HEAD")"
          echo "${changed}"
          if echo "${changed}" | grep -E '^src/rasai/catalog_report_|^src/rasai/audit_catalog\.py$'; then
            echo "Catalog source changed during conventional report retirement."
            exit 1
          fi

      - name: Import smoke for affected composition roots
        run: |
          python - <<'PY'
          import rasai.audit_runner
          import rasai.entrypoint
          import rasai.console_entrypoint
          import rasai.report_completion
          import rasai.audit_reprocess
          import rasai.web.pilot_app
          print("affected imports: OK")
          PY

      - name: Run retirement contract tests
        run: pytest -q tests/test_conventional_report_retirement.py

      - name: Run persisted-data regression tests
        run: >-
          pytest -q
          tests/test_m12_stable_baseline.py::M12StableBaselineTests::test_end_to_end_pipeline_preserves_data_without_conventional_html
          tests/test_m16_root_cause.py::M16RootCauseTests::test_materializes_exact_set_context_and_global_scopes
          tests/test_m17_precision_reporting.py::M17PrecisionReportingTests::test_canonical_absence_becomes_precise_cause_and_target_selector

      - name: Run catalog and SaaS boundary regressions
        run: >-
          pytest -q
          tests/test_catalog_report_site.py::test_catalog_report_materializes_without_conventional_report_tree
          tests/test_web_pilot.py::test_report_boundary_serves_only_authorized_catalog_report_tree
