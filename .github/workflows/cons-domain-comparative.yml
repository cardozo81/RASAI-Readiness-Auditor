name: CONS same-domain advisory 210 isolated
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/consolidation/domain_comparative_preview.py'
      - 'src/rasai/consolidation/domain_comparative_index.py'
      - 'src/rasai/consolidation/domain_comparative_html.py'
      - 'tests/test_cons_domain_comparative.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_cons_domain_comparative_index.py'
      - 'docs/CONS_DOMAIN_COMPARATIVE.md'
      - '.github/workflows/cons-domain-comparative.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/consolidation/domain_comparative_preview.py'
      - 'src/rasai/consolidation/domain_comparative_index.py'
      - 'src/rasai/consolidation/domain_comparative_html.py'
      - 'tests/test_cons_domain_comparative.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_cons_domain_comparative_index.py'
      - '.github/workflows/cons-domain-comparative.yml'
permissions:
  contents: read
jobs:
  same-domain-contract:
    name: CONS domain safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Same-domain advisory only; no full CONS audit
        run: python -m pytest -q tests/test_cons_domain_comparative.py tests/test_cons_domain_comparative_index.py
