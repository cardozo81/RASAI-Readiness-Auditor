name: PostgreSQL control-plane validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/platform/**'
      - 'src/rasai/search_intelligence/**'
      - 'src/rasai/web/**'
      - 'src/rasai/audit_execution_contract.py'
      - 'src/rasai/execution_contract.py'
      - 'src/rasai/worker.py'
      - 'src/rasai/m25_cli.py'
      - 'src/rasai/m25_dynatrace_defaults.py'
      - 'src/rasai/provider_registry.py'
      - 'src/rasai/provider_runtime_policy.py'
      - 'tests/test_postgresql_*.py'
      - 'tests/test_worker_execution.py'
      - 'tests/test_web_saas_management.py'
      - 'tests/test_saas_runtime_parity.py'
      - 'pyproject.toml'
      - '.github/workflows/postgresql-control-plane-ci.yml'
      - 'docs/POSTGRESQL*.md'
      - 'docs/POSTGRES*.md'
      - 'docs/SAAS*.md'
      - 'docs/DATABASE*.md'
      - 'docs/PLATFORM*.md'
  push:
    branches: [main]
    paths:
      - 'src/rasai/platform/**'
      - 'src/rasai/search_intelligence/**'
      - 'src/rasai/web/**'
      - 'src/rasai/audit_execution_contract.py'
      - 'src/rasai/execution_contract.py'
      - 'src/rasai/worker.py'
      - 'src/rasai/m25_cli.py'
      - 'src/rasai/m25_dynatrace_defaults.py'
      - 'src/rasai/provider_registry.py'
      - 'src/rasai/provider_runtime_policy.py'
      - 'tests/test_postgresql_*.py'
      - 'tests/test_worker_execution.py'
      - 'tests/test_web_saas_management.py'
      - 'tests/test_saas_runtime_parity.py'
      - 'pyproject.toml'
      - '.github/workflows/postgresql-control-plane-ci.yml'
      - 'docs/POSTGRESQL*.md'
      - 'docs/POSTGRES*.md'
      - 'docs/SAAS*.md'
      - 'docs/DATABASE*.md'
      - 'docs/PLATFORM*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  postgres-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Docker Official Image via Google's public Docker Hub cache.
        # ECR Public returned "toomanyrequests: Data limit exceeded"
        # before the job could execute. Keep the same major version and tests.
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_DB: rasai_control_plane
          POSTGRES_USER: rasai_app
          POSTGRES_PASSWORD: rasai_test_password
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasai_app -d rasai_control_plane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RASAI_TEST_POSTGRES_URL: postgresql://rasai_app:rasai_test_password@127.0.0.1:5432/rasai_control_plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install RASAi with PostgreSQL and Web support
        run: python -m pip install -e ".[postgresql,web]" pytest
      - name: Compile PostgreSQL, SaaS and execution integration
        run: >-
          python -m compileall -q
          src/rasai/platform
          src/rasai/search_intelligence
          src/rasai/web
          src/rasai/audit_execution_contract.py
          src/rasai/execution_contract.py
          src/rasai/worker.py
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: PostgreSQL control-plane parity
        run: python -m pytest -q tests/test_postgresql_*.py
      - name: SaaS and runtime contract parity
        run: >-
          python -m pytest -q
          tests/test_worker_execution.py
          tests/test_web_saas_management.py
          tests/test_saas_runtime_parity.py
