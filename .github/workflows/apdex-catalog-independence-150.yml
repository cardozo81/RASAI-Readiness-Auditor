name: Apdex catalog independence #150

on:
  pull_request:
    paths:
      - 'src/rasai/synthetic_acquisition_engine.py'
      - 'src/rasai/synthetic_acquisition_runtime.py'
      - 'src/rasai/m25_apdex_experience.py'
      - 'tests/test_synthetic_acquisition_runtime.py'
      - 'src/rasai/console_catalog_plan.py'
      - 'src/rasai/console_m23.py'
      - 'src/rasai/m23_cli.py'
      - 'src/rasai/cli_extensions.py'
      - 'src/rasai/audit_execution_contract.py'
      - 'src/rasai/worker.py'
      - 'src/rasai/system_default_dependencies.py'
      - 'src/rasai/console_apdex_configuration.py'
      - 'src/rasai/console_ui_catalog.py'
      - 'src/rasai/system_defaults.py'
      - 'src/rasai/console_profile_capability_architecture.py'
      - 'src/rasai/execution_capabilities.py'
      - 'tests/test_apdex_catalog_independence_150.py'
      - 'tests/test_console_catalog_configuration_refinements.py'
      - 'tests/test_m25_console_integration.py'
      - 'tests/test_worker_execution.py'
      - 'tests/test_system_defaults.py'
      - '.github/workflows/apdex-catalog-independence-150.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/synthetic_acquisition_engine.py'
      - 'src/rasai/synthetic_acquisition_runtime.py'
      - 'src/rasai/m25_apdex_experience.py'
      - 'tests/test_synthetic_acquisition_runtime.py'
      - 'src/rasai/console_catalog_plan.py'
      - 'src/rasai/console_m23.py'
      - 'src/rasai/m23_cli.py'
      - 'src/rasai/cli_extensions.py'
      - 'src/rasai/audit_execution_contract.py'
      - 'src/rasai/worker.py'
      - 'src/rasai/system_default_dependencies.py'
      - 'src/rasai/console_apdex_configuration.py'
      - 'src/rasai/console_ui_catalog.py'
      - 'src/rasai/system_defaults.py'
      - 'src/rasai/console_profile_capability_architecture.py'
      - 'src/rasai/execution_capabilities.py'
      - 'tests/test_apdex_catalog_independence_150.py'
      - 'tests/test_console_catalog_configuration_refinements.py'
      - 'tests/test_m25_console_integration.py'
      - 'tests/test_worker_execution.py'
      - 'tests/test_system_defaults.py'
      - '.github/workflows/apdex-catalog-independence-150.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-apdex-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Run only #150 regressions and directly changed contracts
        run: |
          python -m pytest -q \
            tests/test_synthetic_acquisition_runtime.py \
            tests/test_apdex_catalog_independence_150.py \
            tests/test_console_catalog_configuration_refinements.py::test_catalog_selection_round_trips_through_console_ini \
            tests/test_console_catalog_configuration_refinements.py::test_remove_navigation_apdex_preserves_independent_experience_and_returns \
            tests/test_console_catalog_configuration_refinements.py::test_remove_experience_apdex_preserves_navigation_catalog \
            tests/test_m25_console_integration.py::M25ConsoleIntegrationTests::test_m25_can_run_without_standard_m23_in_console_state \
            tests/test_worker_execution.py::test_experience_apdex_job_can_run_without_navigation_apdex \
            tests/test_system_defaults.py::test_first_run_preserves_explicit_environment_precedence
