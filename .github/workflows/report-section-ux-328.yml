name: CAT report section UX 328 targeted
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/catalog_report_page.py'
      - 'src/rasai/catalog_report_style.py'
      - 'tests/test_report_section_readability_328.py'
      - 'docs/REPORT_SECTION_UX_328.md'
      - '.github/workflows/report-section-ux-328.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/catalog_report_page.py'
      - 'src/rasai/catalog_report_style.py'
      - 'tests/test_report_section_readability_328.py'
      - '.github/workflows/report-section-ux-328.yml'
permissions:
  contents: read
jobs:
  html-sections:
    name: Report section grammar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Focused section markup and CAT-07 boundary
        run: >-
          python -m pytest -q
          tests/test_report_section_readability_328.py
          tests/test_cat07_architecture_integration_358.py
