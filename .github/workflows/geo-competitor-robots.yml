name: GEO competitor robots opt-in 330
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/geo_competitor_fetch.py'
      - 'src/rasai/entrypoint.py'
      - 'src/rasai/geo_competitor_pinned_egress.py'
      - 'tests/test_geo_competitor_fetch.py'
      - 'tests/test_geo_competitor_pinned_egress.py'
      - 'docs/GEO_COMPETITOR_FETCH.md'
      - '.github/workflows/geo-competitor-robots.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/geo_competitor_fetch.py'
      - 'src/rasai/entrypoint.py'
      - 'src/rasai/geo_competitor_pinned_egress.py'
      - 'tests/test_geo_competitor_fetch.py'
      - 'tests/test_geo_competitor_pinned_egress.py'
      - '.github/workflows/geo-competitor-robots.yml'
permissions:
  contents: read
jobs:
  robots-contract:
    name: Robots gated public HTML contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test isolated robots policy with in-memory HTTP
        run: python -m pytest -q tests/test_geo_competitor_fetch.py tests/test_geo_competitor_pinned_egress.py
