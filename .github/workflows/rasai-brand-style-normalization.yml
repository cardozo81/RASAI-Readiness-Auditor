name: RASAi public brand normalization

on:
  push:
    paths:
      - '.github/workflows/rasai-brand-style-normalization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize public brand and current-state documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          brand_re = re.compile(r'(?<![A-Za-z0-9_])RASAI(?![-A-Za-z0-9_])')

          paths = [Path('README.md'), Path('pyproject.toml'), Path('iniciar.cmd')]
          paths += list(Path('docs').rglob('*.md'))
          paths += list(Path('src/searchgeo').rglob('*.py'))
          paths += list(Path('tests').rglob('*.py'))

          for path in paths:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = brand_re.sub('RASAi', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='\n')

          # Formal acronym is intentionally uppercase; RASAi is the public stylization.
          branding_py = Path('src/searchgeo/branding.py')
          text = branding_py.read_text(encoding='utf-8')
          if 'PRODUCT_ACRONYM = "RASAI"' not in text:
              text = text.replace(
                  'PRODUCT_NAME = "RASAi"\n',
                  'PRODUCT_ACRONYM = "RASAI"\nPRODUCT_NAME = "RASAi"\n',
                  1,
              )
          branding_py.write_text(text, encoding='utf-8', newline='\n')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Estado funcional'
          if marker not in text:
              raise SystemExit('README marker not found')
          rest = text[text.index(marker):]
          prefix = '''# RASAi — Search & AI Readiness Auditor

> **RASAi** é a identidade pública do produto. O acrônimo formal **RASAI** deriva de **R**eadiness **A**ssessment for **S**earch & **AI**. A grafia **RASAi**, com `i` minúsculo, é uma escolha tipográfica de marca para destacar visualmente a ligação do produto com inteligência artificial sem alterar o significado formal do acrônimo.

**Descriptor:** Search & AI Readiness Auditor  
**Framework:** RASAi Framework  
**Índice:** `SARI-001` — Search & AI Readiness Index

A forma **RASAi** deve ser usada em interfaces, relatórios e documentação. **RASAI** em caixa alta fica restrito à explicação formal do acrônimo ou a identificadores técnicos cuja grafia faça parte do contrato.

RASAi é um auditor de **Search & AI Readiness** com evidência persistida, scoring reproduzível, análise semântica opcional por IA, remediação textual advisory, diagnóstico de crawling/discovery, Acessibilidade, Web Performance/Lighthouse/CrUX, Apdex sintético e outcomes observados de AI Search importáveis.

O produto avalia sinais técnicos e semânticos úteis para Search e sistemas generativos sem prometer ranking, tráfego, citação ou presença em respostas de IA. **Readiness, visibilidade observada, ranking, citação e tráfego são conceitos distintos.**

'''
          text = prefix + rest
          text = text.replace(
              '> O `SARI-001` é um índice proprietário e reprodutível. `SCORE-GEO-003` é o método padrão para novas auditorias: as dimensões permanecem determinísticas/evidence-based e o Overall exige modelo calibrado `VALIDATED`. Sem model artifact validado, o Overall fica `NOT_CONSOLIDATED`; nenhum coeficiente é inventado e não há fallback silencioso para `SCORE-GEO-002`. Auditorias `SCORE-GEO-002` permanecem históricas e não são recalculadas. Lighthouse, Core Web Vitals, Acessibilidade automatizada, Apdex e outcomes observados mantêm seus domínios próprios.',
              '> O `SARI-001` é um índice proprietário e reprodutível. `SCORE-GEO-003` é o método de scoring aplicado às auditorias: as dimensões permanecem determinísticas/evidence-based e o Overall exige model artifact `VALIDATED`. Sem model artifact validado, o Overall fica `NOT_CONSOLIDATED`; nenhum coeficiente ou resultado substituto é inventado. Lighthouse, Core Web Vitals, Acessibilidade automatizada, Apdex e outcomes observados mantêm seus domínios próprios.'
          )
          text = text.replace(
              'Relatórios consolidados devem segmentar séries por `scoring_version`; `SCORE-GEO-002` e `SCORE-GEO-003` não são a mesma série metodológica.',
              'Relatórios consolidados preservam `scoring_version`, `model_version`, `dataset_version` e demais metadados necessários para comparação metodologicamente válida.'
          )
          text = text.replace('- [docs/SEARCHGEO_READINESS_INDEX.md](docs/SEARCHGEO_READINESS_INDEX.md)', '- [docs/SARI_READINESS_INDEX.md](docs/SARI_READINESS_INDEX.md)')
          readme.write_text(text, encoding='utf-8', newline='\n')

          Path('docs/BRANDING_AND_COMPATIBILITY.md').write_text('''# RASAi / SARI — identidade e compatibilidade

## Identidade pública

- **Marca:** RASAi
- **Acrônimo formal:** RASAI
- **Fundamento do acrônimo:** Readiness Assessment for Search & AI
- **Descriptor:** Search & AI Readiness Auditor
- **Framework:** RASAi Framework
- **Índice:** Search & AI Readiness Index — `SARI-001`

## Fundamento da grafia RASAi

`RASAI` é a composição formal de **R**eadiness **A**ssessment for **S**earch & **AI**. A marca é apresentada como **RASAi**. O `i` minúsculo é uma decisão tipográfica para dar identidade ao trecho final associado à inteligência artificial e tornar a marca visualmente distinta, sem criar uma segunda expansão do acrônimo.

Convenção de escrita:

- use **RASAi** em UI, console, relatórios, HTML, README e documentação;
- use **RASAI** quando o texto estiver explicando o acrônimo formal;
- preserve identificadores técnicos cuja grafia em caixa alta faça parte do contrato, como `RASAI-OBS-*`;
- comandos e arquivos executáveis permanecem em minúsculas, por exemplo `rasai` e `rasai-console`.

## Superfície operacional

A página principal do índice é `report/readiness.html`.

Os comandos preferenciais são `rasai`, `rasai-console`, `rasai audit`, `rasai visibility`, `rasai monitoring`, `rasai quality` e `rasai scoring`.

Por compatibilidade operacional, também são aceitos:

- `searchgeo` e `searchgeo-console`;
- namespace Python `src/searchgeo/`;
- variáveis de ambiente `SEARCHGEO_*`;
- arquivos de configuração suportados pelo runtime;
- nome de distribuição Python `searchgeo-readiness-auditor`;
- IDs normativos e persistidos como `BR-GEO-*`, `SCORE-GEO-*` e `RASAI-OBS-*`.

Esses elementos são contratos técnicos e não definem a marca exibida ao usuário.

## SARI e scoring

`SARI-001` identifica o **Search & AI Readiness Index**. A versão do índice e o `scoring_version` são metadados distintos.

O método de scoring aplicado às auditorias é `SCORE-GEO-003`. Lighthouse, Core Web Vitals, Acessibilidade, Synthetic Navigation Apdex, Synthetic User Experience Apdex e Observed AI Visibility permanecem metodologias independentes e não são combinadas silenciosamente no SARI.
''', encoding='utf-8', newline='\n')

          Path('docs/SEARCHGEO_READINESS_INDEX.md').write_text('''# Search & AI Readiness Index

A especificação operacional e metodológica do índice do RASAi está em [SARI_READINESS_INDEX.md](SARI_READINESS_INDEX.md).

O índice público é **SARI-001 — Search & AI Readiness Index**.
''', encoding='utf-8', newline='\n')

          Path('docs/SARI_READINESS_INDEX.md').write_text('''# Search & AI Readiness Index — SARI-001

## 1. Objetivo

O **Search & AI Readiness Index (`SARI-001`)** é a identidade pública da metodologia proprietária do RASAi para consolidar sinais de prontidão relacionados a descoberta, interpretação, recuperação, resposta e uso do conteúdo como evidência em Search e AI Search.

O índice é auditável e reprodutível. Ele não é padrão oficial de GEO/AEO nem nota de Google, Bing, OpenAI ou outro mantenedor.

## 2. Método de scoring

As auditorias usam:

```text
SCORE-GEO-003
```

As dez dimensões são calculadas deterministicamente a partir de regras e evidências persistidas. O Overall exige model artifact calibrado com estado `VALIDATED`.

## 3. Dimensões

1. `TECHNICAL_ACCESSIBILITY`
2. `INDEXABILITY`
3. `CONTENT_EXTRACTABILITY`
4. `SEMANTIC_STRUCTURE`
5. `ENTITY_CLARITY`
6. `STRUCTURED_DATA`
7. `ANSWERABILITY`
8. `CITATION_READINESS`
9. `EVIDENCE_TRUST`
10. `INTENT_COVERAGE`

Desktop e Mobile permanecem separados.

## 4. Score das dimensões

```text
Dimension Score = Σ(weight × result_factor) / Σ(weight evaluated) × 100
```

Fatores padrão:

```text
PASS    = 1.00
WARNING = 0.50
FAIL    = 0.00
```

`UNKNOWN`, `ERROR` e `NOT_APPLICABLE` não são convertidos automaticamente em `FAIL`.

## 5. Overall

Com dimensões aplicáveis suficientemente consolidadas e model artifact `VALIDATED`:

```text
Overall = 100 × sigmoid(β0 + Σ βi × feature_i)
```

As features são as dez dimensões normalizadas. Sem model artifact validado, o Overall fica `NOT_CONSOLIDATED`; nenhum número substituto é fabricado.

## 6. Calibração

Outcome inicial:

```text
CITED / NOT_CITED
```

Fonte: query-runs controlados do domínio Observed Generative Visibility.

Promotion gate mínimo:

- 40 domínios;
- 12 domínios no holdout;
- 2 engines;
- 10 queries por domínio;
- 3 repetições por query/engine;
- 2400 observações válidas;
- AUC holdout >= 0,60;
- Brier menor que baseline por prevalência de treino.

O split é por domínio para reduzir leakage. Detalhes: `SCORE_GEO_003.md` e `SCORING_VALIDATION.md`.

## 7. Coverage, Confidence e Consolidation

Coverage mede completude do universo aplicável avaliado; não mede qualidade do site.

Confidence das dimensões é baseada em cobertura, evidência e erros. No Overall, a Confidence também é limitada pela `calibration_confidence` do artifact.

Consolidation informa se existe base suficiente para publicar uma conclusão agregada.

## 8. Groundability

Groundability é exposta como conjunto de sinais, não como novo subscore:

- `ANSWERABILITY`;
- `CITATION_READINESS`;
- `EVIDENCE_TRUST`.

Não é criada uma segunda agregação sem contrato próprio.

## 9. YMYL e E-E-A-T

YMYL/E-E-A-T são contexto de rigor da análise e remediação, não scores oficiais.

O RASAi não apresenta “E-E-A-T Score” nem “YMYL Score” como métricas oficiais do Google.

## 10. Métricas externas

Não entram automaticamente no Overall:

- Core Web Vitals;
- Lighthouse Performance;
- Lighthouse Accessibility/WCAG;
- Synthetic Navigation Apdex;
- Synthetic User Experience Apdex;
- métricas Bing source-reported.

Elas permanecem em seus domínios próprios, salvo se uma calibração formal demonstrar relação válida e o contrato metodológico for atualizado.

## 11. Readiness versus visibilidade observada

```text
Readiness
= sinais medidos no site

Observed Generative Visibility
= resultado efetivamente observado em engine/query/período
```

Outcomes observados podem alimentar a calibração do Overall, mas isso não torna cada auditoria uma garantia de citação futura.

## 12. Relatórios

```text
index.html             -> síntese executiva
readiness.html         -> SARI-001
score-geo-003.html     -> modelo/dataset/gates do SCORE-GEO-003
ai-visibility.html     -> outcomes observados
web-performance.html   -> CWV + Lighthouse
accessibility.html     -> acessibilidade automatizada
apdex.html             -> Synthetic Navigation Apdex
apdex-experience.html  -> Synthetic User Experience Apdex
```

O dashboard não cria agregação transversal entre metodologias.

## 13. Rastreabilidade e comparabilidade

Resultados preservam `scoring_version`, `model_version`, `dataset_version`, SHA-256 dos artifacts e demais metadados necessários para reconstrução e comparação válida.

Mudança incompatível de fórmula, features ou gates exige um identificador metodológico distinto.

## 14. Estado de validação

```text
Fundamentação conceitual: evidence-based
Dimensões determinísticas: sim
Overall empiricamente calibrável: sim
Holdout por domínio: sim
Artifact reprodutível: sim
Homologação externa do índice composto: não
Garantia causal de citação: não
```
''', encoding='utf-8', newline='\n')

          # Current-only references in report text.
          registry = Path('src/searchgeo/report_registry.py')
          t = registry.read_text(encoding='utf-8')
          t = t.replace(
              'SCORE-GEO-003 é o método vigente e SCORE-GEO-002 permanece apenas histórico.',
              'SCORE-GEO-003 é o método de scoring aplicado e sua reprodutibilidade é verificada contra as evidências persistidas.'
          )
          t = t.replace('The legacy report_navigation module owns rendering/polish.', 'The report_navigation module owns rendering/polish.')
          registry.write_text(t, encoding='utf-8', newline='\n')

          perf = Path('src/searchgeo/m21_reporting.py')
          t = perf.read_text(encoding='utf-8')
          t = t.replace('SCORE-GEO-002', 'SCORE-GEO-003')
          perf.write_text(t, encoding='utf-8', newline='\n')

          readiness = Path('src/searchgeo/searchgeo_readiness_reporting.py')
          t = readiness.read_text(encoding='utf-8')
          t = t.replace(
              'Scoring is\nversioned independently: new audits use ``SCORE-GEO-003`` while historical\n``SCORE-GEO-002`` results remain preserved.',
              'Scoring is versioned independently and uses ``SCORE-GEO-003`` as the method applied by the current audit pipeline.'
          )
          t = t.replace("<title>RASAi — relatório legado</title>", "<title>RASAi — readiness</title>")
          t = t.replace("<body><p>Este endereço é legado. Abra <a href='{SEARCHGEO_FILE}'>{SEARCHGEO_FILE}</a>.</p></body>", "<body><p>Abrindo <a href='{SEARCHGEO_FILE}'>{SEARCHGEO_FILE}</a>.</p></body>")
          readiness.write_text(t, encoding='utf-8', newline='\n')

          # Point current documentation references to SARI.
          for path in Path('docs').rglob('*.md'):
              t = path.read_text(encoding='utf-8')
              t = t.replace('`SEARCHGEO_READINESS_INDEX.md`', '`SARI_READINESS_INDEX.md`')
              t = t.replace('[SEARCHGEO_READINESS_INDEX.md](SEARCHGEO_READINESS_INDEX.md)', '[SARI_READINESS_INDEX.md](SARI_READINESS_INDEX.md)')
              path.write_text(t, encoding='utf-8', newline='\n')
          PY

      - name: Validate public documentation has no superseded-version narrative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          banned = ('SCORE-GEO-002', 'SGRI-001')
          hits = []
          for path in [Path('README.md'), *Path('docs').rglob('*.md')]:
              text = path.read_text(encoding='utf-8')
              for token in banned:
                  if token in text:
                      lines = [f'{i}: {line}' for i, line in enumerate(text.splitlines(), 1) if token in line]
                      hits.append(f'{path} :: {token}\n' + '\n'.join(lines))
          if hits:
              print('\n\n'.join(hits))
              raise SystemExit('Superseded-version narrative remains in public documentation')
          PY

      - name: Install package and browser
        shell: bash
        run: |
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src/searchgeo
      - name: Brand and report regression tests
        shell: bash
        run: |
          pytest -q tests/test_rasai_sari_branding.py tests/test_searchgeo_readiness_reporting.py tests/test_report_registry_and_method_docs.py tests/test_m21_web_performance.py
      - name: Full regression suite
        run: pytest -q
      - name: Remove migration runner and commit
        shell: bash
        run: |
          git rm .github/workflows/rasai-brand-style-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs src tests pyproject.toml iniciar.cmd
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Standardize public brand as RASAi"
          git push origin HEAD:main
