name: Perplexity Search Intelligence targeted

on:
  push:
    branches:
      - feat/perplexity-search-intelligence
    paths:
      - 'src/rasai/search_intelligence/perplexity.py'
      - 'src/rasai/platform/usage_ingestion.py'
      - 'src/rasai/console_search_intelligence.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/catalog_report_model.py'
      - 'tests/test_perplexity_search_intelligence.py'
      - 'tests/test_console_search_intelligence.py'
      - 'tests/test_provider_registry.py'
      - 'docs/AI_PRICING_CONFIGURATION.md'
      - 'docs/AI_RUNTIME_ORCHESTRATION.md'
      - 'docs/AUTO_COST_AWARE_AI_ROUTING.md'
      - 'docs/PROVIDER_REGISTRY.md'
      - 'docs/AI_GUIDE.md'
      - 'docs/CONFIGURATION.md'
      - 'docs/CLI_REFERENCE.md'
      - 'docs/EXTERNAL_CREDENTIALS.md'
      - 'docs/ENVIRONMENT_VARIABLES.md'
      - 'docs/PROVIDER_SETUP.md'
      - 'docs/REPORTING_AI_USAGE.md'
      - 'docs/CONSOLE_SEARCH_INTELLIGENCE.md'
      - 'docs/PERPLEXITY_SEARCH_INTELLIGENCE.md'
      - 'docs/README.md'
      - '.github/workflows/perplexity-search-intelligence-targeted.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/rasai/search_intelligence/perplexity.py'
      - 'src/rasai/platform/usage_ingestion.py'
      - 'src/rasai/console_search_intelligence.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/catalog_report_model.py'
      - 'tests/test_perplexity_search_intelligence.py'
      - 'tests/test_console_search_intelligence.py'
      - 'docs/AI_PRICING_CONFIGURATION.md'
      - 'docs/AI_RUNTIME_ORCHESTRATION.md'
      - 'docs/AUTO_COST_AWARE_AI_ROUTING.md'
      - 'docs/PROVIDER_REGISTRY.md'
      - 'docs/AI_GUIDE.md'
      - 'docs/CONFIGURATION.md'
      - 'docs/CLI_REFERENCE.md'
      - 'docs/EXTERNAL_CREDENTIALS.md'
      - 'docs/ENVIRONMENT_VARIABLES.md'
      - 'docs/PROVIDER_SETUP.md'
      - 'docs/REPORTING_AI_USAGE.md'
      - 'docs/CONSOLE_SEARCH_INTELLIGENCE.md'
      - 'docs/PERPLEXITY_SEARCH_INTELLIGENCE.md'
      - 'docs/README.md'
      - '.github/workflows/perplexity-search-intelligence-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile changed Python boundary
        run: |
          python -m compileall -q \
            src/rasai/search_intelligence/perplexity.py \
            src/rasai/console_search_intelligence.py \
            src/rasai/catalog_report_model.py \
            src/rasai/catalog_report_integrations.py
      - name: Run Perplexity and directly shared boundary tests
        run: |
          python -m pytest -q \
            tests/test_perplexity_search_intelligence.py \
            tests/test_console_search_intelligence.py \
            tests/test_provider_registry.py \
            tests/test_ai_native_usage_pricing.py \
            tests/test_ai_cost_policy.py \
            tests/test_m9_scoring.py
      - name: Optional real Perplexity FAST smoke when secret is available
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3
          import tempfile
          from pathlib import Path

          from rasai.persistence import AuditWorkspace
          from rasai.search_intelligence.perplexity import execute_perplexity_search

          if not os.environ.get("PERPLEXITY_API_KEY", "").strip():
              print("PERPLEXITY_REAL_SMOKE=SKIPPED_NO_SECRET")
              raise SystemExit(0)

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp) / "AUD-PERPLEXITY-SMOKE"
              root.mkdir()
              (root / "artifacts").mkdir()
              database = root / "audit.db"
              connection = sqlite3.connect(database)
              try:
                  connection.executescript(
                      """
                      PRAGMA foreign_keys=ON;
                      CREATE TABLE audits(audit_id TEXT PRIMARY KEY);
                      CREATE TABLE pages(page_id TEXT PRIMARY KEY,audit_id TEXT);
                      CREATE TABLE page_snapshots(snapshot_id TEXT PRIMARY KEY,page_id TEXT);
                      INSERT INTO audits(audit_id) VALUES ('AUD-PERPLEXITY-SMOKE');
                      """
                  )
                  connection.commit()
              finally:
                  connection.close()

              run = execute_perplexity_search(
                  AuditWorkspace.open(root),
                  audit_id="AUD-PERPLEXITY-SMOKE",
                  query="RASAi Search and AI readiness",
                  search_type="fast",
                  max_results=1,
                  timeout_seconds=15.0,
              )
              print(
                  "PERPLEXITY_REAL_SMOKE="
                  + json.dumps(
                      {
                          "status": run.status,
                          "http_status": run.http_status,
                          "sources": len(run.sources),
                          "estimated_cost": run.pricing.estimated_cost,
                          "pricing_context": run.pricing.pricing_context,
                          "attempt_persisted": bool(run.attempt_id),
                      },
                      sort_keys=True,
                  )
              )
          PY
