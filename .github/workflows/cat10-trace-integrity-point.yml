name: CAT10 Trace Integrity Point Test

on:
  push:
    branches:
      - feat/passive-security-catalog
    paths:
      - '.github/workflows/cat10-trace-integrity-point.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Run only CAT-10 trace integrity point test
        run: pytest -q tests/test_passive_security_catalog.py::test_cat10_integrity_accepts_mixed_trace_identifiers
