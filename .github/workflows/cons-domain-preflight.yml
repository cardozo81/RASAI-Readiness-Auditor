name: CONS 210 same-domain preflight (offline)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/consolidation/domain_preflight_210.py'
      - 'src/rasai/consolidation/selection.py'
      - 'tests/test_cons_domain_preflight_210.py'
      - '.github/workflows/cons-domain-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application and test runner
        run: python -m pip install -e . pytest
      - name: Test read-only comparison eligibility only
        run: python -m pytest -q tests/test_cons_domain_preflight_210.py
