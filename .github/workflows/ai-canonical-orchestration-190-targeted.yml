name: AI Canonical Orchestration 190 Targeted

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/rasai/ai_canonical_orchestration.py'
      - 'src/rasai/ai_resilience.py'
      - 'src/rasai/dynamic_ai_routing.py'
      - 'src/rasai/provider_runtime_policy.py'
      - 'src/rasai/m18_ai.py'
      - 'src/rasai/m20_ai.py'
      - 'src/rasai/provider_extensions.py'
      - 'src/rasai/provider_extensions_m20.py'
      - 'src/rasai/semantic_partial_runtime.py'
      - 'src/rasai/m24_ai.py'
      - 'src/rasai/m24_partial_runtime.py'
      - 'src/rasai/source_quality_ai.py'
      - 'src/rasai/directed_analysis.py'
      - 'src/rasai/ai_orchestration_unification.py'
      - 'src/rasai/consolidation/specialist.py'
      - 'src/rasai/reprocess_ai.py'
      - 'src/rasai/reprocess_policy.py'
      - 'src/rasai/audit_resume_runtime.py'
      - 'src/rasai/audit_execution_contract.py'
      - 'src/rasai/console_config.py'
      - 'src/rasai/console_settings.py'
      - 'src/rasai/console_environment.py'
      - 'src/rasai/ai_provider_console_management.py'
      - 'src/rasai/config/rasai-defaults.ini'
      - 'tests/test_ai_canonical_orchestration_190.py'
      - 'tests/test_ai_orchestration_190_characterization.py'
      - 'tests/test_ai_runtime_orchestration.py'
      - 'tests/test_ai_retry_fallback_observability.py'
      - 'tests/test_issue_43_reprocess_ai_timeout.py'
      - '.github/workflows/ai-canonical-orchestration-190-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install package and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[web]' pytest

      - name: Compile affected orchestration runtime
        run: |
          python -m py_compile \
            src/rasai/ai_canonical_orchestration.py \
            src/rasai/ai_resilience.py \
            src/rasai/dynamic_ai_routing.py \
            src/rasai/provider_runtime_policy.py \
            src/rasai/m18_ai.py \
            src/rasai/m20_ai.py \
            src/rasai/provider_extensions.py \
            src/rasai/provider_extensions_m20.py \
            src/rasai/semantic_partial_runtime.py \
            src/rasai/m24_ai.py \
            src/rasai/m24_partial_runtime.py \
            src/rasai/source_quality_ai.py \
            src/rasai/directed_analysis.py \
            src/rasai/ai_orchestration_unification.py \
            src/rasai/consolidation/specialist.py \
            src/rasai/reprocess_ai.py \
            src/rasai/reprocess_policy.py \
            src/rasai/audit_resume_runtime.py \
            src/rasai/audit_execution_contract.py \
            src/rasai/console_config.py \
            src/rasai/console_settings.py \
            src/rasai/console_environment.py \
            src/rasai/ai_provider_console_management.py

      - name: Canonical cycle, health and adapter matrix
        run: >-
          pytest -q
          tests/test_ai_canonical_orchestration_190.py
          tests/test_ai_orchestration_190_characterization.py
          tests/test_ai_runtime_orchestration.py
          tests/test_ai_retry_fallback_observability.py
          tests/test_provider_extensions.py
          tests/test_m18_multi_ai_provider.py

      - name: Governed partial and AUD/RPR parity
        run: >-
          pytest -q
          tests/test_issue_164_ai_evidence_snapshot.py
          tests/test_governed_ai_pipeline.py
          tests/test_issue_43_reprocess_ai_timeout.py
          tests/test_governed_reprocess_dependencies.py
          tests/test_issue_66_execution_reprocess_parity.py

      - name: Configuration, console and pricing boundaries
        run: >-
          pytest -q
          tests/test_provider_runtime_policy.py
          tests/test_console_canonical_ai_orchestration.py
          tests/test_console_configuration_transaction.py
          tests/test_system_defaults.py
          tests/test_ai_native_usage_pricing.py
