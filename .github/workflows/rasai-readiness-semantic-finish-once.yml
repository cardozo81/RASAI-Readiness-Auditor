name: RASAi readiness semantic finalization (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rasai-readiness-semantic-finish-once.yml'

permissions:
  contents: write

jobs:
  apply-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply semantic precedence fix
        run: python .github/rasai_semantic_order_fix_20260908.py
      - name: Compile changed contracts
        run: |
          python -m py_compile \
            src/rasai/report_semantics.py \
            tests/test_report_polish_20260908.py
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Targeted readiness smoke
        run: |
          pytest -q \
            tests/test_report_polish_20260908.py \
            tests/test_report_semantics.py \
            tests/test_rasai_readiness_reporting.py \
            tests/test_report_navigation.py \
            tests/test_user_facing_language_contract.py
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Full regression
        run: pytest -q
      - name: Remove temporary finalization files
        if: success()
        run: |
          rm -f .github/rasai_semantic_order_fix_20260908.py
          rm -f .github/workflows/rasai-readiness-semantic-finish-once.yml
      - name: Commit validated final state directly to main
        if: success()
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Finalize readiness semantic precedence'
          git push origin HEAD:main
