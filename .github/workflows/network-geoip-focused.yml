name: Network GeoIP Focused
on:
  pull_request:
    paths:
      - "src/rasai/network_*.py"
      - "src/rasai/console_provider_environment.py"
      - "pyproject.toml"
      - "tests/test_network_*.py"
      - ".github/workflows/network-geoip-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-666-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focal test dependencies
        run: python -m pip install -e ".[geoip]" pytest
      - name: Run issue 666 regression tests without external probes
        run: |
          python -m pytest -q \
            tests/test_network_traceroute.py \
            tests/test_network_active_probe.py \
            tests/test_network_auto_probe.py \
            tests/test_network_route_g1.py \
            tests/test_network_map.py \
            tests/test_network_active_policy.py \
            tests/test_network_geoip_bootstrap.py \
            tests/test_network_geoip_install.py \
            tests/test_network_geoip_operations.py \
            tests/test_network_geoip_maintenance.py \
            tests/test_network_geoip_schedule.py

  baseline-main-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install main branch test runtime
        run: python -m pip install -e . pytest
      - name: Reproduce unrelated failures on untouched main
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          cases = {
              "ai_cost_policy": "tests/test_ai_cost_policy.py::test_review_date_is_explicit_and_machine_readable",
              "geo_baseline": "tests/test_geo_baseline_without_perplexity.py::test_geo_works_without_optional_perplexity_with_scoped_serp_and_existing_ai",
              "namespace": "tests/test_rasai_namespace_contract.py::test_obsolete_product_namespace_is_absent_from_repository",
          }
          results = {}
          for name, test in cases.items():
              result = subprocess.run([sys.executable, "-m", "pytest", "-q", test], check=False)
              results[name] = result.returncode
              print("MAIN_BASELINE", name, result.returncode, flush=True)
          if any(code == 0 for code in results.values()):
              print("One or more allegedly pre-existing failures did not reproduce; investigate branch regression.")
              sys.exit(1)
          if any(code != 1 for code in results.values()):
              print("Baseline inconclusive due to collection/setup error.")
              sys.exit(1)
          print("All three failures reproducible on unmodified main.")
          PY
