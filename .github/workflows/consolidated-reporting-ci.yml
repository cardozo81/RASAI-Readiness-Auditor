name: Consolidated reporting safety

on:
  pull_request:
    branches: [main]
    paths:
      - "src/searchgeo/consolidation/**"
      - "src/searchgeo/console_entrypoint.py"
      - "tests/test_consolidation*.py"
      - "README.md"
      - "docs/INTERACTIVE_CONSOLE.md"
      - "docs/OUTPUTS_AND_ARTIFACTS.md"
      - "docs/CONSOLIDATED_REPORTING*.md"
      - ".github/workflows/consolidated-reporting-ci.yml"

permissions:
  contents: read

jobs:
  consolidation-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependency
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Compile changed Python surface
        run: python -m compileall -q src/searchgeo/consolidation src/searchgeo/console_entrypoint.py tests/test_consolidation*.py
      - name: Run consolidation regression tests
        run: python -m unittest discover -v -s tests -p "test_consolidation*.py"
      - name: Run existing console regression tests
        run: >-
          python -m unittest -v
          tests.test_interactive_console
          tests.test_console_environment_guidance
          tests.test_console_progress_guidance
          tests.test_console_provider_registry
          tests.test_console_settings
          tests.test_console_windows_environment
