name: Apply pending CI compatibility fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic fixes
        shell: python
        run: |
          from pathlib import Path

          reporting = Path('src/rasai/score_geo_004_reporting.py')
          text = reporting.read_text(encoding='utf-8')
          old = 'Overall consolidado pelos gates da metodologia persistida.'
          new = 'Overall determinístico consolidado pelos gates da metodologia persistida.'
          if old not in text and new not in text:
              raise SystemExit('expected _score_reason phrase not found')
          reporting.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          init = Path('tests/__init__.py')
          if not init.exists():
              init.write_text('"""RASAi regression test package.\n\nAllows test modules to reuse deterministic fixtures through ``tests.*`` imports.\n"""\n', encoding='utf-8', newline='\n')
      - name: Remove one-shot workflow
        run: git rm .github/workflows/fix-pending-ci.yml
      - name: Commit fixes
        run: |
          git config user.name "RASAi CI repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/rasai/score_geo_004_reporting.py tests/__init__.py
          git commit -m "Fix regression imports and deterministic score reason"
          git push origin HEAD:main
