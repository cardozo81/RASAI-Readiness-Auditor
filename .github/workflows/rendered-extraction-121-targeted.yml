name: RPR rendered-source extraction upgrade - targeted

on:
  pull_request:
    paths:
      - 'src/rasai/core_reprocessing.py'
      - 'src/rasai/m4.py'
      - 'src/rasai/public_language.py'
      - 'tests/test_rendered_extraction_upgrade_121.py'
      - '.github/workflows/rendered-extraction-121-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-extraction-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Only rendered recovery, M4 and immediate M3/RPR dependency tests
        run: >-
          python -m pytest -q
          tests/test_rendered_extraction_upgrade_121.py
          tests/test_core_reprocessing.py
          tests/test_core_reprocessing_context.py
          tests/test_m4_extraction_evidence.py
