name: Report Catalog Targeted

on:
  push:
    branches: [main]
    paths:
      - 'src/rasai/catalog_report_*.py'
      - 'tests/test_cat09_w3c_remediation.py'
      - 'tests/test_search_competitive_ai.py'
      - 'tests/test_competitive_acquisition_policy.py'
      - 'src/rasai/cost_forecast.py'
      - 'src/rasai/platform/usage_ingestion.py'
      - 'src/rasai/m18_persistence.py'
      - 'src/rasai/search_audit_runtime.py'
      - 'tests/test_cat08_actionable_guidance.py'
      - 'tests/test_cat03_auto_projection.py'
      - 'tests/test_catalog_report_search_trust.py'
      - 'tests/test_w3c_catalog_detail.py'
      - 'tests/test_standards_css_validation.py'
      - 'src/rasai/observability/external_sources.py'
      - 'src/rasai/execution_consistency_runtime.py'
      - 'src/rasai/standards_css_validation.py'
      - 'src/rasai/standards_metrics.py'
      - 'src/rasai/score_geo_004_reporting.py'
      - 'src/rasai/semantic.py'
      - 'src/rasai/accepted_audit_refinements.py'
      - 'src/rasai/improvement_intelligence.py'
      - 'src/rasai/editorial_risk_context.py'
      - 'src/rasai/selective_optional_reprocess.py'
      - 'tests/test_report_catalog_public_labels.py'
      - 'tests/test_catalog_report_package_integrity.py'
      - 'tests/test_catalog_source_inventory.py'
      - 'tests/test_catalog_report_assurance.py'
      - 'tests/test_catalog_report_final_refinements.py'
      - 'tests/test_cat03_ptbr_labels.py'
      - 'tests/test_ymyl_context_flow.py'
      - 'tests/test_improvement_fulfillment_effective_config.py'
      - '.github/workflows/report-catalog-targeted.yml'
  pull_request:
    paths:
      - 'src/rasai/catalog_report_*.py'
      - 'tests/test_cat09_w3c_remediation.py'
      - 'tests/test_search_competitive_ai.py'
      - 'tests/test_competitive_acquisition_policy.py'
      - 'src/rasai/cost_forecast.py'
      - 'src/rasai/platform/usage_ingestion.py'
      - 'src/rasai/m18_persistence.py'
      - 'src/rasai/search_audit_runtime.py'
      - 'tests/test_cat08_actionable_guidance.py'
      - 'tests/test_cat03_auto_projection.py'
      - 'tests/test_catalog_report_search_trust.py'
      - 'tests/test_w3c_catalog_detail.py'
      - 'tests/test_standards_css_validation.py'
      - 'src/rasai/observability/external_sources.py'
      - 'src/rasai/execution_consistency_runtime.py'
      - 'src/rasai/standards_css_validation.py'
      - 'src/rasai/standards_metrics.py'
      - 'src/rasai/score_geo_004_reporting.py'
      - 'src/rasai/semantic.py'
      - 'src/rasai/accepted_audit_refinements.py'
      - 'src/rasai/improvement_intelligence.py'
      - 'src/rasai/editorial_risk_context.py'
      - 'src/rasai/selective_optional_reprocess.py'
      - 'tests/test_report_catalog_public_labels.py'
      - 'tests/test_catalog_report_package_integrity.py'
      - 'tests/test_catalog_source_inventory.py'
      - 'tests/test_catalog_report_assurance.py'
      - 'tests/test_catalog_report_final_refinements.py'
      - 'tests/test_cat03_ptbr_labels.py'
      - 'tests/test_ymyl_context_flow.py'
      - 'tests/test_improvement_fulfillment_effective_config.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Run only tests affected by this report/YMYL patch
        run: >-
          pytest -q
          tests/test_report_catalog_public_labels.py
          tests/test_catalog_report_assurance.py
          tests/test_catalog_source_inventory.py
          tests/test_catalog_report_package_integrity.py
          tests/test_standards_css_validation.py
          tests/test_w3c_catalog_detail.py
          tests/test_catalog_report_search_trust.py
          tests/test_search_competitive_ai.py
          tests/test_competitive_acquisition_policy.py
          tests/test_cat09_w3c_remediation.py
          tests/test_cat03_auto_projection.py
          tests/test_cat08_actionable_guidance.py
          tests/test_catalog_report_final_refinements.py
          tests/test_cat03_ptbr_labels.py
          tests/test_ymyl_context_flow.py
          tests/test_improvement_fulfillment_effective_config.py
