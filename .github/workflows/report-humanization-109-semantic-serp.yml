name: CAT-03 and CAT-05 humanization #109 targeted

on:
  pull_request:
    paths:
      - 'src/rasai/semantic_coherence_reporting.py'
      - 'src/rasai/report_presentation.py'
      - 'src/rasai/catalog_report_search_trust.py'
      - 'tests/test_report_humanization_109_semantic_serp.py'
      - '.github/workflows/report-humanization-109-semantic-serp.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/semantic_coherence_reporting.py'
      - 'src/rasai/report_presentation.py'
      - 'src/rasai/catalog_report_search_trust.py'
      - 'tests/test_report_humanization_109_semantic_serp.py'
      - '.github/workflows/report-humanization-109-semantic-serp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-projection-109:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Only typed CAT-03/05 surfaces
        run: python -m pytest -q tests/test_report_humanization_109_semantic_serp.py
