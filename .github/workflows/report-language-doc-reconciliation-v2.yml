name: Temporary report language reconciliation v2

on:
  push:
    branches:
      - fix/report-language-doc-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message != 'Reconcile report language and documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reconciliation
        run: |
          python tools/reconcile_report_language.py
          python tools/reconcile_report_language_followup.py
          python tools/reconcile_report_language_cleanup.py
      - name: Install project and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
          python -m playwright install chromium
      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_user_facing_language_contract.py \
            tests/test_report_semantics.py \
            tests/test_console_progress_guidance.py \
            tests/test_searchgeo_readiness_reporting.py \
            tests/test_m7_semantic_provider.py \
            tests/test_report_navigation.py
      - name: Full tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Presentation and documentation guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          milestone = re.compile(r'(?<![\w-])M\d{1,2}(?![\w-])')
          stale = ('EM BRANCH', 'aguardando smoke humano', '**Milestone:**')
          bad=[]
          for f in [Path('README.md'), *Path('docs').rglob('*.md')]:
              text = f.read_text(encoding='utf-8')
              reasons=[]
              if milestone.search(text):
                  reasons.append('delivery label Mxx')
              reasons.extend(token for token in stale if token in text)
              if reasons:
                  bad.append(f"{f}: {', '.join(reasons)}")
          if bad:
              raise SystemExit('presentation/documentation guard failed:\n' + '\n'.join(bad))
          PY
      - name: Commit validated changes
        shell: bash
        run: |
          rm -f .github/workflows/report-language-doc-reconciliation.yml
          rm -f .github/workflows/report-language-doc-reconciliation-v2.yml
          rm -f tools/reconcile_report_language.py
          rm -f tools/reconcile_report_language_followup.py
          rm -f tools/reconcile_report_language_cleanup.py
          git config user.name "SearchGEO automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcile report language and documentation"
          git push origin HEAD:fix/report-language-doc-reconciliation
