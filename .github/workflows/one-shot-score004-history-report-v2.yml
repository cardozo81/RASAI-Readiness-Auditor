name: One-shot SCORE-GEO-004 cleanup and Search History report v2

on:
  push:
    branches:
      - feat/score-geo-004-cleanup-search-history-report
    paths:
      - .github/workflows/one-shot-score004-history-report-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/score-geo-004-cleanup-search-history-report
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply implementation
        run: python tools/one_shot_score004_history_report.py
      - name: Remove bootstrap files before contract validation
        run: |
          rm -f .github/workflows/one-shot-score004-history-report.yml
          rm -f .github/workflows/one-shot-score004-history-report-v2.yml
          rm -f tools/one_shot_score004_history_report.py
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Targeted validation
        run: |
          python -m compileall -q src/rasai
          python -m pytest -q \
            tests/test_search_intelligence_history.py \
            tests/test_scoring_report_contract.py \
            tests/test_release_gate_comparability.py \
            tests/test_release_gate_new_failures.py \
            tests/test_monitoring_observability.py \
            tests/test_quality_observability_hardening.py \
            tests/test_product_platform_architecture.py \
            tests/test_m26_observed_generative_visibility.py \
            tests/test_consolidated_backlog_regressions.py
          python -m rasai.public_contract_gate
      - name: Verify sole scoring contract
        shell: bash
        run: |
          if git grep -n -E 'SCORE-GEO-(001|002|003|[0-9]{3})' -- ':!*.pyc' | grep -v 'SCORE-GEO-004'; then
            echo 'A non-canonical SCORE-GEO identifier remains.' >&2
            exit 1
          fi
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce SCORE-GEO-004 and add Search History HTML reporting"
          git push origin HEAD:feat/score-geo-004-cleanup-search-history-report
