name: Console final authorization 374

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/console_cost_confirmation.py'
      - 'src/rasai/console_first_run_cost_preview.py'
      - 'tests/test_console_execution_gate_composition.py'
      - '.github/workflows/console-final-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-acceptance:
    name: Final authorization (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile changed authorization modules
        run: >-
          python -m py_compile
          src/rasai/console_cost_confirmation.py
          src/rasai/console_first_run_cost_preview.py
          tests/test_console_execution_gate_composition.py
      - name: Deterministic authorization and preceding Apdex cancellation regressions
        run: >-
          python -m pytest -q
          tests/test_console_execution_gate_composition.py
          tests/test_console_cost_confirmation.py
          tests/test_console_first_run_cost_preview.py
          tests/test_console_apdex_navigation.py
          tests/test_console_apdex_cancel_transaction.py
