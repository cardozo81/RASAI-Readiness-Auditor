name: Public Contract Consistency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check newly introduced filenames
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          python tests/test_repository_filename_policy.py --base "$BASE_SHA" --head HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Validate public contract
        run: python -m rasai.public_contract_gate
      - name: Contract-focused tests
        run: >-
          python -m unittest
          tests.test_report_registry_and_method_docs
          tests.test_rasai_runtime_branding_and_reports
          tests.test_public_runtime_language
          tests.test_version_contract
      - name: Documentation contract tests
        run: >-
          pytest -q
          tests/test_documentation_contract.py
          tests/test_prepublication_documentation_contract.py
          tests/test_repository_filename_policy.py
          tests/test_rasai_sari_branding.py::test_public_documentation_uses_current_contract

      - name: Architecture advisory context tests
        run: pytest -q tests/test_architecture_discovery.py tests/test_architecture_probe.py tests/test_architecture_live_capture.py tests/test_console_architecture_discovery.py tests/test_architecture_context.py tests/test_architecture_observation_reader.py tests/test_architecture_choice.py tests/test_architecture_choice_precedence.py tests/test_architecture_choice_snapshot.py tests/test_architecture_choice_audit_adapter.py tests/test_architecture_choice_runtime.py tests/test_architecture_choice_console_restore.py tests/test_m24_architecture.py
