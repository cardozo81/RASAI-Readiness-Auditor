name: Full RASAi Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/full-regression.yml'
      - 'src/rasai/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine fail-closed PR regression scope
        id: risk
        env:
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/ci_pr_risk_scope.py || echo "mode=full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install full test dependencies
        if: steps.risk.outputs.mode == 'full'
        run: python -m pip install -e ".[attestation,documents]" pytest
      - name: Install directed test dependencies
        if: steps.risk.outputs.mode != 'full'
        run: python -m pip install -e . pytest
      - name: Install Chromium for browser-backed tests
        if: steps.risk.outputs.mode == 'full'
        run: python -m playwright install chromium
      - name: Public contract gate (always)
        run: python -m rasai.public_contract_gate
      - name: Full pytest suite (core/unknown/workflow/manual)
        if: steps.risk.outputs.mode == 'full'
        run: pytest -q
      - name: Directed offline presentation regression
        if: steps.risk.outputs.mode == 'presentation'
        run: >-
          python -m pytest -q
          tests/report_presentation/test_source_display_contract.py
          tests/report_presentation/test_parallel_report.py
          tests/report_presentation/test_editorial_review.py
          tests/report_presentation/test_temporal_locale.py
      - name: Docs-only PR (dedicated document contract gate remains required)
        if: steps.risk.outputs.mode == 'docs'
        run: echo "Full regression not applicable to Markdown-only PR"
