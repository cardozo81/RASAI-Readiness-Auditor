name: Finalize documentation audit

on:
  push:
    branches:
      - docs/pt-br-md-audit-20260910

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/pt-br-md-audit-20260910
          fetch-depth: 0

      - name: Apply deterministic documentation normalization
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('docs/ENVIRONMENT_VARIABLES.md'),
              Path('docs/SERP_OBSERVATION.md'),
              Path('docs/specification/15_ERROR_CENTRIC_REPORT_UX.md'),
              Path('docs/specification/20_AI_CONTENT_REMEDIATION.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              normalized = text.replace('\u2013', '-').replace('\u2014', '-')
              if normalized != text:
                  path.write_text(normalized, encoding='utf-8')

          rules = Path('docs/specification/03_BUSINESS_RULES.md')
          text = rules.read_text(encoding='utf-8')
          marker = '**Ruleset vigente:** `BR-GEO-001..059`\n'
          note = ('\nO subconjunto `BR-GEO-001..056` corresponde ao conjunto anterior à introdução '
                  'das regras `BR-GEO-057..059` de Content Value. O ruleset vigente e normativo '
                  'permanece `BR-GEO-001..059`; a referência ao subconjunto existe apenas para '
                  'rastreabilidade do contrato anterior, sem reduzir ou substituir o ruleset atual.\n')
          if note.strip() not in text:
              if marker not in text:
                  raise SystemExit('Ruleset marker not found')
              text = text.replace(marker, marker + note, 1)
              rules.write_text(text, encoding='utf-8')

      - name: Commit normalized Markdown
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ENVIRONMENT_VARIABLES.md docs/SERP_OBSERVATION.md docs/specification/15_ERROR_CENTRIC_REPORT_UX.md docs/specification/20_AI_CONTENT_REMEDIATION.md docs/specification/03_BUSINESS_RULES.md
          git commit -m "docs: finalize prepublication documentation contract"
          git push origin HEAD:docs/pt-br-md-audit-20260910
