name: Temporary DeepSeek semantic and console correction gate

on:
  push:
    branches:
      - fix/deepseek-semantic-console-actions

permissions:
  contents: read

jobs:
  validate-committed-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify materialized correction
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'def _deepseek_semantic_output_schema' src/searchgeo/m18_ai.py
          grep -q 'AÇÕES' src/searchgeo/interactive_console.py
          if grep -E '^[[:space:]]*print\(.*\|.*\)' src/searchgeo/interactive_console.py | grep -E 'Salvar configuração|Ajuda / custos|Executar|Abrir última|Histórico / relatórios'; then
            echo 'Selectable action row still contains pipe separator.' >&2
            exit 1
          fi
      - name: Install test dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_deepseek_semantic_contract_and_console_actions.py' -v
          python -m unittest discover -s tests -p 'test_consolidation_console_integration.py' -v
          python -m unittest discover -s tests -p 'test_m18*.py' -v
      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
          git diff --check
          git diff --exit-code -- src/searchgeo docs tests README.md
