name: RASAi final adherence cleanup

on:
  push:
    branches: [main]
    paths:
      - .rasai-final-adherence-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fix residual SCORE-GEO-004 report label and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/rasai/report_site.py')
          text = path.read_text(encoding='utf-8')
          old = '<div class="kicker">SCORE-GEO-002</div><h2>Regras de cálculo</h2>'
          new = '<div class="kicker">SCORE-GEO-004</div><h2>Regras de cálculo</h2>'
          if old not in text:
              raise RuntimeError('current scoring reference anchor not found in report_site.py')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('tests/test_consolidated_backlog_regressions.py')
          text = path.read_text(encoding='utf-8')
          old = '            "src/rasai/external_metrics_integrity.py", "src/rasai/cli_extensions.py",\n'
          new = '            "src/rasai/external_metrics_integrity.py", "src/rasai/cli_extensions.py",\n            "src/rasai/report_site.py",\n'
          if old not in text:
              raise RuntimeError('regression selected-list anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium

      - name: Public contract gate
        run: python -m rasai.public_contract_gate

      - name: Targeted regression
        run: python -m pytest -q tests/test_consolidated_backlog_regressions.py

      - name: Full regression suite
        run: python -m pytest -q

      - name: Remove temporary orchestration
        run: |
          rm -f .github/workflows/rasai-final-adherence.yml .rasai-final-adherence-trigger
          git status --short

      - name: Commit final adherence fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final SCORE-GEO-004 report adherence"
          git push origin HEAD:main
