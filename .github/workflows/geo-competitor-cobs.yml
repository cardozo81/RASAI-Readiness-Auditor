name: GEO competitor sidecar provenance 330
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/geo_competitor_capture_bundle.py'
      - 'src/rasai/entrypoint.py'
      - 'src/rasai/geo_competitor_pair.py'
      - 'src/rasai/geo_competitor_pair_html.py'
      - 'tests/test_geo_competitor_capture_bundle.py'
      - 'docs/GEO_COMPETITOR_CAPTURE_BUNDLE.md'
      - '.github/workflows/geo-competitor-cobs.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/geo_competitor_capture_bundle.py'
      - 'src/rasai/entrypoint.py'
      - 'src/rasai/geo_competitor_pair.py'
      - 'src/rasai/geo_competitor_pair_html.py'
      - 'tests/test_geo_competitor_capture_bundle.py'
      - '.github/workflows/geo-competitor-cobs.yml'
permissions:
  contents: read
jobs:
  cobs-provenance:
    name: Competitor provenance COBS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test COBS physical provenance and upstream consent guards offline
        run: python -m pytest -q tests/test_geo_competitor_capture_bundle.py tests/test_geo_competitor_fetch.py
