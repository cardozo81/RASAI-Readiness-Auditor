name: RASAi scoring refinement implementation

on:
  push:
    branches: [main]
    paths:
      - '.rasai-scoring-refinement-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/rasai_scoring_refinement.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "'''        \"Não altere severidade, scoring, SCORE-GEO-004 ou SARI-001. \"\\n''',",
              "'''        \"determinísticos fornecidos. Não altere severidade, scoring, SCORE-GEO-004 ou SARI-001. \"\\n''',",
          )
          s = s.replace(
              "'''        \"Não invente pesos numéricos nem altere a fórmula do SCORE-GEO-004/SARI-001. \"\\n        \"Além das ações, classifique ROBOTS e/ou SITEMAP somente quando houver evidência fornecida, \"\\n        \"usando POSITIVE, NEUTRAL ou NEGATIVE. O runtime converte essa classe por fatores estáticos/versionados. \"\\n''',",
              "'''        \"determinísticos fornecidos. Não invente pesos numéricos nem altere a fórmula do SCORE-GEO-004/SARI-001. \"\\n        \"Além das ações, classifique ROBOTS e/ou SITEMAP somente quando houver evidência fornecida, \"\\n        \"usando POSITIVE, NEUTRAL ou NEGATIVE. O runtime converte essa classe por fatores estáticos/versionados. \"\\n''',",
          )
          s = s.replace(
              "'''{_metric(\"Impacto desta camada\", str(run[\"scoring_impact\"]) if run else \"NONE\")}\\n''',",
              "'''{_metric(\"Impacto desta camada\", \"NENHUM\" if run and str(run[\"scoring_impact\"]) == \"NONE\" else (str(run[\"scoring_impact\"]) if run else \"NENHUM\"))}\\n''',",
          )
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          python .github/rasai_scoring_refinement.py
          rm -f .github/rasai_scoring_refinement.py
          rm -f .github/workflows/rasai-scoring-refinement.yml
          rm -f .rasai-scoring-refinement-trigger
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Targeted regression
        run: |
          pytest -q \
            tests/test_scoring_discovery_refinement_20260908.py \
            tests/test_m2_discovery_http.py \
            tests/test_m9_scoring.py \
            tests/test_score_geo_004.py \
            tests/test_score_geo_004_applicability.py \
            tests/test_m24_crawling_discovery.py \
            tests/test_post_smoke_adherence_20260908.py \
            tests/test_no_ai_semantic_baseline.py
      - name: Full regression
        run: pytest -q
      - name: Commit validated implementation
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No implementation changes to commit'; exit 1; }
          git commit -m 'Refine SARI discovery structured data and Lighthouse resilience'
          git push origin HEAD:main
