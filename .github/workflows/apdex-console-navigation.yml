name: Apdex console Navigation risk 380

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/system_defaults.py'
      - 'src/rasai/console_apdex_configuration.py'
      - 'tests/test_console_apdex_navigation_380.py'
      - '.github/workflows/apdex-console-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-risk:
    name: Navigation risk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile changed console modules
        run: >-
          python -m py_compile
          src/rasai/system_defaults.py
          src/rasai/console_apdex_configuration.py
          tests/test_console_apdex_navigation_380.py
      - name: Navigation policy and cancellation regression (no AUD / network)
        run: >-
          python -m pytest -q
          tests/test_console_apdex_navigation_380.py
          tests/test_console_apdex_cancel_transaction.py
          tests/test_console_input_navigation_contract.py::test_apdex_edit_restores_previous_values_when_cancelled_mid_form
          tests/test_cat07_architecture_integration_358.py::test_rejected_guided_preview_restores_state_and_environment
