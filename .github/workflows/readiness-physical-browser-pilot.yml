name: Primary content readiness physical browser pilot 322

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/readiness_probe_cost_pilot.py'
      - 'src/rasai/faq_existing_page_pilot.py'
      - 'src/rasai/m3_experimental_faq_runtime.py'
      - 'src/rasai/m25_experimental_probe_runtime.py'
      - 'src/rasai/m3_render_deadline_runtime.py'
      - 'src/rasai/m3.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_m3_experimental_faq_runtime.py'
      - 'tests/test_m25_experimental_probe_runtime.py'
      - 'src/rasai/readiness_matched_pilot.py'
      - 'tests/test_readiness_matched_pilot.py'
      - 'src/rasai/playwright_primary_content_probe.py'
      - 'src/rasai/same_sample_observation.py'
      - 'src/rasai/m25_apdex_experience.py'
      - 'src/rasai/device_context_capture.py'
      - 'tests/test_same_sample_observation.py'
      - 'tests/test_m25_advisory_sample_bridge.py'
      - 'tests/test_readiness_probe_cost_pilot.py'
      - 'tests/test_faq_existing_page_pilot.py'
      - 'tests/test_playwright_real_browser_readiness.py'
      - '.github/workflows/readiness-physical-browser-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/readiness_probe_cost_pilot.py'
      - 'src/rasai/faq_existing_page_pilot.py'
      - 'src/rasai/m3_experimental_faq_runtime.py'
      - 'src/rasai/m25_experimental_probe_runtime.py'
      - 'src/rasai/m3_render_deadline_runtime.py'
      - 'src/rasai/m3.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_m3_experimental_faq_runtime.py'
      - 'tests/test_m25_experimental_probe_runtime.py'
      - 'src/rasai/readiness_matched_pilot.py'
      - 'tests/test_readiness_matched_pilot.py'
      - 'src/rasai/playwright_primary_content_probe.py'
      - 'src/rasai/same_sample_observation.py'
      - 'src/rasai/m25_apdex_experience.py'
      - 'src/rasai/device_context_capture.py'
      - 'tests/test_same_sample_observation.py'
      - 'tests/test_m25_advisory_sample_bridge.py'
      - 'tests/test_readiness_probe_cost_pilot.py'
      - 'tests/test_faq_existing_page_pilot.py'
      - 'tests/test_playwright_real_browser_readiness.py'
      - '.github/workflows/readiness-physical-browser-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ${{ matrix.os }}
    name: Readiness pilot pure deterministic (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/test_readiness_probe_cost_pilot.py
          tests/test_readiness_matched_pilot.py
          tests/test_playwright_primary_content_probe.py
          tests/test_apdex_content_readiness.py
          tests/test_m25_advisory_sample_bridge.py
          tests/test_m25_experimental_probe_runtime.py

  physical-browser-pilot:
    runs-on: ubuntu-latest
    name: Offline Chromium real DOM pilot (not M25)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Verify preinstalled GitHub runner Chrome (no browser downloads)
        run: google-chrome --version
      - name: Run offline same-browser-sample DOM tests (no site/network/provider)
        env:
          RASAI_322_CHROME_CHANNEL: chrome
        run: python -m pytest -q tests/test_playwright_real_browser_readiness.py tests/test_faq_existing_page_pilot.py tests/test_same_sample_observation.py tests/test_m3_experimental_faq_runtime.py
