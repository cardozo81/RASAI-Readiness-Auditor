name: RASAi stability refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'rasai-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply refinement
        run: |
          python .github/rasai_stability_refinement.py
          sed -i 's/Os diagnósticos M24 são advisory/Os diagnósticos técnicos são advisory/g' docs/CLI_REFERENCE.md docs/CONSOLE_COST_AND_USAGE.md docs/AI_GUIDE.md || true
          sed -i 's/URLs descobertas são uma fronteira observada/fronteira observada do crawl/' tests/test_stability_refinement_20260908.py
          sed -i 's/AuditWorkspace(root=root, database=db)/AuditWorkspace(root)/' tests/test_stability_refinement_20260908.py
          sed -i 's/<td>Alta (P1)<\/td>/<td>Muito alta (P1)<\/td>/' tests/test_report_presentation.py
          rm -f .github/rasai_stability_refinement.py
          rm -f .github/workflows/rasai-stability-refinement.yml
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Targeted regression
        run: >-
          pytest -q
          tests/test_stability_refinement_20260908.py
          tests/test_scoring_discovery_refinement_20260908.py
          tests/test_sari_input_traceability_20260908.py
          tests/test_rasai_readiness_reporting.py
          tests/test_report_semantics.py
          tests/test_report_navigation.py
          tests/test_interactive_console.py
          tests/test_report_presentation.py
      - name: Full regression
        run: pytest -q
      - name: Commit validated implementation
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No implementation changes to commit'; exit 1; }
          git commit -m 'Refine scope coverage technical AI and priority reporting'
          git push origin HEAD:main
