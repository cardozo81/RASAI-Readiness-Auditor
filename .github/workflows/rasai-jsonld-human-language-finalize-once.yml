name: RASAi JSON-LD and human-language finalization (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rasai-jsonld-human-language-finalize-once.yml'

permissions:
  contents: write

jobs:
  apply-validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply JSON-LD and language hardening
        run: python .github/rasai_jsonld_human_language_fix_20260908.py
      - name: Align existing context-panel assertions with public labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_content_analysis_context.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    assert "CONFIGURADO" in html\n    assert "AUTO" in html\n', '    assert "Configurado" in html\n    assert "Inferido" in html\n', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Compile changed modules
        run: |
          python -m py_compile \
            src/rasai/report_presentation.py \
            src/rasai/m20_reporting.py \
            tests/test_user_facing_language_contract.py \
            tests/test_m20_jsonld_artifact_view.py \
            tests/test_content_analysis_context.py
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Targeted language and JSON-LD smoke
        run: |
          pytest -q \
            tests/test_user_facing_language_contract.py \
            tests/test_m20_jsonld_artifact_view.py \
            tests/test_content_analysis_context.py \
            tests/test_report_presentation.py \
            tests/test_report_polish_20260908.py \
            tests/test_report_navigation.py
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Full regression
        run: pytest -q
      - name: Remove temporary finalization files
        if: success()
        run: |
          rm -f .github/rasai_jsonld_human_language_fix_20260908.py
          rm -f .github/workflows/rasai-jsonld-human-language-finalize-once.yml
      - name: Commit validated final state directly to main
        if: success()
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Expose persisted JSON-LD and humanize public report states'
          git push origin HEAD:main
