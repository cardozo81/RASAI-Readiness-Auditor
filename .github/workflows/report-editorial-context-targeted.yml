name: PR 733 - materialidade, esforco IA e fuso horario (testes focais)

on:
  pull_request:
    paths:
      - 'src/rasai/parallel_report/presentation_labels.py'
      - 'src/rasai/parallel_report/executive_evidence.py'
      - 'src/rasai/parallel_report/search_visibility_synthesis.py'
      - 'src/rasai/parallel_report/__init__.py'
      - 'src/rasai/parallel_report/publication.py'
      - 'tests/report_presentation/test_temporal_locale.py'
      - 'tests/report_presentation/test_search_visibility_semantic_patch.py'
      - 'tests/report_presentation/test_editorial_review.py'
      - 'tests/report_presentation/test_parallel_report.py'
      - '.github/workflows/report-editorial-context-targeted.yml'

permissions:
  contents: read

jobs:
  editorial-733-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Regressao pontual da apresentacao
        run: >-
          python -m pytest -q
          tests/report_presentation/test_temporal_locale.py
          tests/report_presentation/test_search_visibility_semantic_patch.py
          tests/report_presentation/test_editorial_review.py
          tests/report_presentation/test_parallel_report.py
