name: Web API and execution foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/web/**'
      - 'src/rasai/worker.py'
      - 'src/rasai/worker_cli.py'
      - 'src/rasai/platform/**'
      - 'tests/test_web_api.py'
      - 'tests/test_web_cli.py'
      - 'tests/test_web_pilot.py'
      - 'tests/test_web_identity.py'
      - 'tests/test_web_ui_auth_mode.py'
      - 'tests/test_identity_directory.py'
      - 'tests/test_worker_execution.py'
      - 'tests/test_execution_queue.py'
      - 'pyproject.toml'
      - '.github/workflows/web-api-foundation.yml'
      - 'docs/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'src/rasai/web/**'
      - 'src/rasai/worker.py'
      - 'src/rasai/worker_cli.py'
      - 'src/rasai/platform/**'
      - 'tests/test_web_api.py'
      - 'tests/test_web_cli.py'
      - 'tests/test_web_pilot.py'
      - 'tests/test_web_identity.py'
      - 'tests/test_web_ui_auth_mode.py'
      - 'tests/test_identity_directory.py'
      - 'tests/test_worker_execution.py'
      - 'tests/test_execution_queue.py'
      - 'pyproject.toml'
      - '.github/workflows/web-api-foundation.yml'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install RASAi with web support
        run: python -m pip install -e ".[web]" pytest
      - name: Compile web and worker modules
        run: python -m compileall -q src/rasai/web src/rasai/worker.py src/rasai/worker_cli.py src/rasai/platform
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Web API, pilot, identity and execution tests
        run: >-
          python -m pytest -q
          tests/test_web_api.py
          tests/test_web_cli.py
          tests/test_web_pilot.py
          tests/test_web_identity.py
          tests/test_web_ui_auth_mode.py
          tests/test_identity_directory.py
          tests/test_execution_queue.py
          tests/test_worker_execution.py
