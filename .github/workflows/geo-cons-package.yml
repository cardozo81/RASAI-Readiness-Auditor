name: GEO CONS versioned companion 311
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/geo_cons_package_311.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_geo_cons_package.py'
      - 'docs/GEO_CONS_PACKAGE.md'
      - '.github/workflows/geo-cons-package.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/geo_cons_package_311.py'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_geo_cons_package.py'
      - '.github/workflows/geo-cons-package.yml'
permissions:
  contents: read
jobs:
  geo-cons-sidecar:
    name: GEO CONS companion hashes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Test isolated GEO CONS sidecar and existing read-only companion
        run: python -m pytest -q tests/test_geo_cons_package.py tests/test_geo_cons_companion.py
