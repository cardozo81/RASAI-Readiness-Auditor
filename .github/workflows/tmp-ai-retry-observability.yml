name: Temporary AI retry fallback observability gate
on:
  push:
    branches:
      - feature/ai-retry-fallback-observability
permissions:
  contents: write
jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply implementation patch
        run: |
          python .github/tmp_apply_ai_retry_observability.py
          python .github/tmp_fix_ai_retry_regressions.py
          python .github/tmp_fix_ai_cost_level_expectations.py
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Focused AI resilience regressions
        run: |
          python -m pytest -q \
            tests/test_ai_retry_fallback_observability.py \
            tests/test_m18_multi_ai_provider.py \
            tests/test_deepseek_semantic_contract_and_console_actions.py \
            tests/test_provider_extensions.py \
            tests/test_provider_extensions_m20.py \
            tests/test_console_provider_registry.py \
            tests/test_interactive_console.py
      - name: Full regression suite
        run: python -m pytest -q
      - name: Static validation
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/searchgeo/ai_resilience.py \
            src/searchgeo/m18_ai.py \
            src/searchgeo/provider_extensions.py \
            src/searchgeo/provider_extensions_m20.py \
            src/searchgeo/m20_ai.py \
            src/searchgeo/m18_persistence.py \
            src/searchgeo/m18_reporting.py \
            src/searchgeo/searchgeo_readiness_reporting.py \
            src/searchgeo/console_cost.py \
            tests/test_m18_multi_ai_provider.py \
            tests/test_ai_retry_fallback_observability.py \
            tests/test_console_provider_registry.py \
            tests/test_interactive_console.py \
            docs/specification/18_MULTI_AI_PROVIDER_ROUTING.md
          if git diff --cached --quiet; then
            echo "No functional changes to commit"
          else
            git commit -m "feat: bound AI retries and expose fallback diagnostics"
            git push origin HEAD:feature/ai-retry-fallback-observability
          fi
