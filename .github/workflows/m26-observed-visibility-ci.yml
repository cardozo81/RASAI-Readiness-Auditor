name: M26 observed generative visibility safety

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/rasai/m26_*.py'
      - 'src/rasai/entrypoint.py'
      - 'src/rasai/__main__.py'
      - 'src/rasai/observability/**'
      - 'tests/test_m26_*.py'
      - 'tests/test_cli_provider_extensions.py'
      - 'tests/test_m23_integration.py'
      - 'pyproject.toml'
      - '.github/workflows/m26-observed-visibility-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  m26-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Compile M26 and entrypoints
        run: |
          python -m compileall -q \
            src/rasai/entrypoint.py \
            src/rasai/__main__.py \
            src/rasai/m26_cli.py \
            src/rasai/m26_persistence.py \
            src/rasai/m26_visibility.py
      - name: M26 directed tests
        run: python -m pytest -q tests/test_m26_observed_generative_visibility.py
      - name: CLI regression
        run: python -m pytest -q tests/test_cli_provider_extensions.py tests/test_m23_integration.py
