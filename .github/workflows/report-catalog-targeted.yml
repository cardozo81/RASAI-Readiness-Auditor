name: Report Catalog Targeted

on:
  push:
    branches: [main]
    paths:
      - 'src/rasai/catalog_report_*.py'
      - 'src/rasai/score_geo_004_reporting.py'
      - 'src/rasai/accepted_audit_refinements.py'
      - 'src/rasai/improvement_intelligence.py'
      - 'src/rasai/editorial_risk_context.py'
      - 'src/rasai/selective_optional_reprocess.py'
      - 'tests/test_report_catalog_public_labels.py'
      - 'tests/test_cat03_ptbr_labels.py'
      - 'tests/test_ymyl_context_flow.py'
      - 'tests/test_improvement_fulfillment_effective_config.py'
      - '.github/workflows/report-catalog-targeted.yml'
  pull_request:
    paths:
      - 'src/rasai/catalog_report_*.py'
      - 'src/rasai/score_geo_004_reporting.py'
      - 'src/rasai/accepted_audit_refinements.py'
      - 'src/rasai/improvement_intelligence.py'
      - 'src/rasai/editorial_risk_context.py'
      - 'src/rasai/selective_optional_reprocess.py'
      - 'tests/test_report_catalog_public_labels.py'
      - 'tests/test_cat03_ptbr_labels.py'
      - 'tests/test_ymyl_context_flow.py'
      - 'tests/test_improvement_fulfillment_effective_config.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Run only tests affected by this report/YMYL patch
        run: >-
          pytest -q
          tests/test_report_catalog_public_labels.py
          tests/test_cat03_ptbr_labels.py
          tests/test_ymyl_context_flow.py
          tests/test_improvement_fulfillment_effective_config.py
