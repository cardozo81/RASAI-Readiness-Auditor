name: Historical Duration Preview 319 Targeted
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/audit_duration_forecast_319.py'
      - 'src/rasai/console_cost_confirmation.py'
      - 'src/rasai/console_first_run_cost_preview.py'
      - 'tests/test_audit_duration_forecast_319.py'
      - 'docs/PRE_EXECUTION_COST_FORECAST.md'
      - '.github/workflows/duration-forecast-319-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duration-preview:
    name: Physical timing forecast read-only / regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and run focused tests without provider calls
        run: |
          python -m pip install -e . pytest
          python -m compileall -q src/rasai/audit_duration_forecast_319.py src/rasai/console_cost_confirmation.py src/rasai/console_first_run_cost_preview.py
          python -m pytest -q tests/test_audit_duration_forecast_319.py tests/test_audit_attempt_timeline_319.py tests/test_audit_cost_explain_319.py tests/test_cost_forecast.py tests/test_console_cost_confirmation.py tests/test_console_first_run_cost_preview.py
