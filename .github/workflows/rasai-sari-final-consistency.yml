name: RASAI SARI final consistency

on:
  push:
    branches:
      - feature/rasai-sari-rebrand

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/rasai-sari-rebrand

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Reconcile SARI with current scoring default
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/searchgeo/searchgeo_readiness_reporting.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'identifier for the current Search & AI Readiness Index presentation; the persisted\ncalculation engine remains ``SCORE-GEO-002`` until the arithmetic itself changes.',
              'identifier for the current Search & AI Readiness Index presentation. Scoring is\nversioned independently: new audits use ``SCORE-GEO-003`` while historical\n``SCORE-GEO-002`` results remain preserved.',
          )
          text = text.replace(
              'COMPATIBLE_ENGINE_VERSION = "SCORE-GEO-002"',
              'COMPATIBLE_ENGINE_VERSION = "SCORE-GEO-003"',
          )
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('docs/BRANDING_AND_COMPATIBILITY.md')
          text = path.read_text(encoding='utf-8')
          old = '`SARI-001` identifica publicamente o Search & AI Readiness Index. Ele não substitui a versão do motor persistido. A troca `SGRI-001` → `SARI-001` é nominal e não altera pesos, fatores, thresholds, fórmula ou calibração.'
          new = old + '\n\nNovas auditorias usam `SCORE-GEO-003`; `SCORE-GEO-002` permanece histórico e não é recalculado. O identificador SARI e o `scoring_version` devem ser apresentados separadamente.'
          if new not in text:
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('tests/test_rasai_sari_branding.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    PUBLIC_METHOD_VERSION,\n    SEARCHGEO_FILE,',
              '    COMPATIBLE_ENGINE_VERSION,\n    PUBLIC_METHOD_VERSION,\n    SEARCHGEO_FILE,',
          )
          text = text.replace(
              '    assert PUBLIC_METHOD_VERSION == "SARI-001"\n    assert SEARCHGEO_FILE == "readiness.html"',
              '    assert PUBLIC_METHOD_VERSION == "SARI-001"\n    assert COMPATIBLE_ENGINE_VERSION == "SCORE-GEO-003"\n    assert SEARCHGEO_FILE == "readiness.html"',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Install runtime, tests and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m playwright install chromium

      - name: Compile and validate CLI compatibility
        run: |
          python -m compileall -q src/searchgeo
          rasai --version
          searchgeo --version

      - name: Full regression suite
        run: python -m pytest -q

      - name: Final naming and scoring invariants
        run: |
          grep -q 'PUBLIC_INDEX_VERSION = "SARI-001"' src/searchgeo/branding.py
          grep -q 'COMPATIBLE_ENGINE_VERSION = "SCORE-GEO-003"' src/searchgeo/searchgeo_readiness_reporting.py
          grep -q 'Novas auditorias usam' docs/SARI_READINESS_INDEX.md
          grep -q 'SCORE-GEO-003' docs/SARI_READINESS_INDEX.md
          grep -q 'SCORE-GEO-002.*histórico' docs/SARI_READINESS_INDEX.md
          grep -R 'BR-GEO-' -n src/searchgeo docs >/dev/null
          grep -R 'SEARCHGEO_' -n src/searchgeo >/dev/null

      - name: Commit final consistency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/searchgeo/searchgeo_readiness_reporting.py docs/BRANDING_AND_COMPATIBILITY.md tests/test_rasai_sari_branding.py
          if git diff --cached --quiet; then
            echo "No final consistency changes to commit."
            exit 0
          fi
          git commit -m "Align SARI reporting with SCORE-GEO-003 default"
          git push origin HEAD:feature/rasai-sari-rebrand
