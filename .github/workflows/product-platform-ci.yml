name: Product platform architecture

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/rasai/platform/**'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_product_platform_architecture.py'
      - 'tests/test_rasai_namespace_contract.py'
      - 'docs/PRODUCT_PLATFORM_ARCHITECTURE.md'
      - '.github/workflows/product-platform-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/rasai/platform/**'
      - 'src/rasai/entrypoint.py'
      - 'tests/test_product_platform_architecture.py'
      - 'tests/test_rasai_namespace_contract.py'
      - 'docs/PRODUCT_PLATFORM_ARCHITECTURE.md'
      - '.github/workflows/product-platform-ci.yml'

permissions:
  contents: read

jobs:
  platform-cross-platform:
    name: Platform unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Compile product platform
        run: python -m compileall -q src/rasai/platform src/rasai/entrypoint.py
      - name: RASAi namespace contract
        run: python -m pytest -q tests/test_rasai_namespace_contract.py
      - name: Product platform tests
        run: python -m pytest -q tests/test_product_platform_architecture.py
      - name: Existing monitor/quality regressions
        run: python -m pytest -q tests/test_monitoring_observability.py tests/test_quality_observability_hardening.py

  full-regression-linux:
    name: Full regression suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Install Chromium for existing browser regressions
        run: python -m playwright install --with-deps chromium
      - name: Full regression suite
        run: python -m pytest -q
