name: GEO competitor content 330 offline
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/geo_competitor_content_provenance_330.py'
      - 'tests/test_geo_competitor_content_provenance_330.py'
      - 'docs/GEO_COMPETITOR_CONTENT_PROVENANCE.md'
      - '.github/workflows/geo-competitor-content-330.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/geo_competitor_content_provenance_330.py'
      - 'tests/test_geo_competitor_content_provenance_330.py'
      - '.github/workflows/geo-competitor-content-330.yml'
permissions:
  contents: read
jobs:
  persisted-html:
    name: GEO competitor persisted evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Offline SQLite source-only contract
        run: python -m pytest -q tests/test_geo_competitor_content_provenance_330.py
