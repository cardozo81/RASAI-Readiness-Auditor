name: Target scope reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'src/rasai/target_scope_reconciliation.py'
      - 'src/rasai/interactive_console.py'
      - 'src/rasai/console_search_intelligence.py'
      - 'src/rasai/console_ui_refactor.py'
      - 'src/rasai/console_search_parameter_menu.py'
      - 'src/rasai/console_perplexity_run_gate.py'
      - 'src/rasai/console_search_scope_presentation.py'
      - 'src/rasai/console_catalog_ui.py'
      - 'tests/test_target_scope_reconciliation.py'
      - '.github/workflows/target-scope-focal.yml'
permissions:
  contents: read
jobs:
  target-scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline test dependencies
        run: python -m pip install -e . pytest
      - name: Validate target/source isolation without external API
        run: |
          python -m pytest -q tests/test_target_scope_reconciliation.py \
            tests/test_perplexity_serp_copy.py \
            tests/test_console_perplexity_run_gate.py
