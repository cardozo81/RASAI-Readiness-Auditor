name: Cost forecast monetary coverage - targeted

on:
  pull_request:
    paths:
      - 'src/rasai/cost_forecast.py'
      - 'tests/test_cost_forecast.py'
      - 'docs/PRE_EXECUTION_COST_FORECAST.md'
      - '.github/workflows/cost-forecast-coverage-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-forecast-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Run only financial forecast consumer regressions
        run: python -m pytest -q tests/test_cost_forecast.py
