name: Core Dependency Point Test

on:
  push:
    branches:
      - feat/passive-security-catalog
    paths:
      - '.github/workflows/observability-artifact-path-targeted.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Run only core-dependent invalidation point test
        run: pytest -q tests/test_core_reprocessing.py::test_core_dependency_invalidation_reopens_only_passive_security
