name: AI audit boundary 199 200 targeted

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rasai/ai_exchange_log.py'
      - 'src/rasai/m18_ai.py'
      - 'src/rasai/ai_orchestration_unification.py'
      - 'src/rasai/improvement_intelligence.py'
      - 'src/rasai/directed_analysis.py'
      - 'src/rasai/search_audit_runtime.py'
      - 'src/rasai/catalog_report_integrations.py'
      - 'src/rasai/catalog_report_final_refinements.py'
      - 'tests/test_ai_audit_boundary_regressions.py'
      - '.github/workflows/ai-audit-boundary-199-200-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile only changed AI boundary modules
        run: >-
          python -m py_compile
          src/rasai/ai_exchange_log.py
          src/rasai/m18_ai.py
          src/rasai/ai_orchestration_unification.py
          src/rasai/improvement_intelligence.py
          src/rasai/directed_analysis.py
          src/rasai/search_audit_runtime.py
          src/rasai/catalog_report_integrations.py
          src/rasai/catalog_report_final_refinements.py
          tests/test_ai_audit_boundary_regressions.py
      - name: Run isolated post-refactor boundary regressions
        run: >-
          python -m pytest -q
          tests/test_ai_audit_boundary_regressions.py
          tests/test_ai_exchange_log_recorder_switch.py
          tests/test_search_competitive_ai.py::CompetitiveAiAuditPhaseTests::test_governed_hook_consumes_only_sealed_persisted_competitive_evidence
