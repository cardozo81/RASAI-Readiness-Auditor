name: SCORE-GEO-004 validation

on:
  push:
    branches:
      - main
    paths:
      - 'src/rasai/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/score-geo-004-validation.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-geo-004:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile SCORE-GEO-004 surface
        run: |
          python -m compileall -q src/rasai/score_geo_004.py src/rasai/scoring.py src/rasai/scoring_v004.py src/rasai/score_geo_004_cli.py src/rasai/score_geo_004_reporting.py src/rasai/rasai_readiness_reporting.py src/rasai/m9.py src/rasai/entrypoint.py
      - name: SCORE-GEO-004 directed tests
        run: |
          python -m pytest -q tests/test_score_geo_004.py tests/test_score_geo_004_applicability.py tests/test_score_geo_004_reopenability.py tests/test_m9_scoring.py tests/test_rasai_readiness_reporting.py tests/test_rasai_runtime_branding_and_reports.py tests/test_rasai_sari_branding.py
      - name: Current scoring inspection
        run: python -m rasai scoring inspect
