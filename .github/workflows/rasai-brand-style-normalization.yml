name: RASAi public brand normalization

on:
  push:
    paths:
      - '.github/workflows/rasai-brand-style-normalization.yml'
      - '.github/scripts/rasai_brand_normalize.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize public brand and documentation
        run: python .github/scripts/rasai_brand_normalize.py
      - name: Install package and browser
        run: |
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src/searchgeo
      - name: Brand and report regression tests
        run: pytest -q tests/test_rasai_sari_branding.py tests/test_searchgeo_readiness_reporting.py tests/test_report_registry_and_method_docs.py tests/test_m21_web_performance.py
      - name: Full regression suite
        run: pytest -q
      - name: Remove normalization runner and commit
        run: |
          git rm .github/workflows/rasai-brand-style-normalization.yml .github/scripts/rasai_brand_normalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs src tests pyproject.toml iniciar.cmd
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Standardize public brand as RASAi"
          git push origin HEAD:main
