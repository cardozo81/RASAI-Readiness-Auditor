name: Network G1 focused validation

on:
  push:
    branches: [feat/network-path-observatory]
    paths:
      - 'src/rasai/network_*.py'
      - 'src/rasai/catalog_report_site.py'
      - 'src/rasai/catalog_report_contract.py'
      - 'src/rasai/report_completion.py'
      - 'tests/test_network_*.py'
      - '.github/workflows/network-g1-focused.yml'
  pull_request:
    paths:
      - 'src/rasai/network_*.py'
      - 'src/rasai/catalog_report_site.py'
      - 'src/rasai/catalog_report_contract.py'
      - 'src/rasai/report_completion.py'
      - 'tests/test_network_*.py'
      - '.github/workflows/network-g1-focused.yml'

permissions:
  contents: read

jobs:
  network-g1-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: G1 network and canonical catalog contracts
        run: >-
          python -m pytest -q
          tests/test_network_observation.py
          tests/test_network_active_probe.py
          tests/test_network_enrichment.py
          tests/test_network_traceroute.py
          tests/test_network_progression.py
          tests/test_network_map.py
          tests/test_network_reporting.py
          tests/test_catalog_report_site.py
