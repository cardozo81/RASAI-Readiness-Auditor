name: Temporary isolated Apdex domain validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apdex-domain-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run isolated mobile measurements
        shell: bash
        run: |
          python - <<'PY' | tee apdex-isolated-validation.json
          import json
          import math
          import statistics
          import time

          from rasai.m23_apdex import _classification as navigation_classification
          from rasai.m23_apdex_profiles import MOBILE_STANDARD_PROFILE, PlaywrightSyntheticNavigationGateway
          from rasai.m25_apdex_experience import Calibration, PlaywrightSyntheticUxGateway, classify_measurement

          URL = "https://loja.bradescoseguros.com.br/"
          SAMPLES = 10
          TIMEOUT_SECONDS = 30.0
          SETTLE_SECONDS = 5.0
          DELAY_SECONDS = 1.0
          NAV_T_SECONDS = 3.0

          calibration = Calibration(
              source="ISOLATED_VALIDATION",
              kpm="USER_ACTION_DURATION",
              satisfied_threshold_seconds=3.0,
              frustrated_threshold_seconds=12.0,
              errors_affect_apdex=True,
              metadata={},
          )

          def apdex(rows):
              values = [row["classification"] for row in rows if row["classification"] is not None]
              if not values:
                  return None
              satisfied = sum(value == "SATISFIED" for value in values)
              tolerating = sum(value == "TOLERATING" for value in values)
              return (satisfied + 0.5 * tolerating) / len(values)

          def percentile(values, fraction):
              clean = sorted(float(v) for v in values if v is not None and math.isfinite(float(v)))
              if not clean:
                  return None
              if len(clean) == 1:
                  return clean[0]
              position = (len(clean) - 1) * fraction
              low = math.floor(position)
              high = math.ceil(position)
              if low == high:
                  return clean[low]
              weight = position - low
              return clean[low] * (1.0 - weight) + clean[high] * weight

          def summarize(rows, duration_key):
              valid = [row for row in rows if row["classification"] is not None]
              durations = [row[duration_key] for row in valid if row.get(duration_key) is not None]
              first = [row[duration_key] for row in valid[: max(1, len(valid)//2)] if row.get(duration_key) is not None]
              second = [row[duration_key] for row in valid[max(1, len(valid)//2):] if row.get(duration_key) is not None]
              counts = {name: sum(row["classification"] == name for row in valid) for name in ("SATISFIED", "TOLERATING", "FRUSTRATED")}
              return {
                  "attempts": len(rows),
                  "valid": len(valid),
                  "invalid": len(rows) - len(valid),
                  "valid_ratio": len(valid) / len(rows) if rows else 0.0,
                  "apdex": apdex(rows),
                  "counts": counts,
                  "p50_ms": percentile(durations, 0.50),
                  "p75_ms": percentile(durations, 0.75),
                  "p95_ms": percentile(durations, 0.95),
                  "first_half_mean_ms": statistics.fmean(first) if first else None,
                  "second_half_mean_ms": statistics.fmean(second) if second else None,
              }

          navigation = PlaywrightSyntheticNavigationGateway()
          experience = PlaywrightSyntheticUxGateway(session_mode="cold")
          nav_rows = []
          ux_rows = []
          try:
              environments = {
                  "navigation": navigation.environment(),
                  "experience": experience.environment(),
                  "profile": MOBILE_STANDARD_PROFILE.as_dict(),
              }
              for index in range(1, SAMPLES + 1):
                  nav = navigation.measure(
                      url=URL,
                      profile=MOBILE_STANDARD_PROFILE,
                      timeout_seconds=TIMEOUT_SECONDS,
                  )
                  nav_rows.append({
                      "sample": index,
                      "status": nav.status,
                      "duration_ms": nav.duration_ms,
                      "http_status": nav.http_status,
                      "final_url": nav.final_url,
                      "classification": navigation_classification(nav, NAV_T_SECONDS),
                      "error_code": nav.error_code,
                      "profile_applied": nav.profile_applied,
                  })
                  time.sleep(DELAY_SECONDS)

                  ux = experience.measure(
                      url=URL,
                      device="MOBILE",
                      profile=MOBILE_STANDARD_PROFILE,
                      timeout_seconds=TIMEOUT_SECONDS,
                      settle_seconds=SETTLE_SECONDS,
                  )
                  classification, value, forced = classify_measurement(
                      ux,
                      calibration,
                      error_scope="first-party",
                  )
                  ux_rows.append({
                      "sample": index,
                      "status": ux.status,
                      "user_action_duration_ms": ux.user_action_duration_ms,
                      "kpm_value_ms": value,
                      "navigation_duration_ms": ux.navigation_duration_ms,
                      "load_event_end_ms": ux.load_event_end_ms,
                      "http_status": ux.http_status,
                      "final_url": ux.final_url,
                      "classification": classification,
                      "error_forced_frustrated": forced,
                      "javascript_error_count": ux.javascript_error_count,
                      "console_error_count": ux.console_error_count,
                      "request_failed_count": ux.request_failed_count,
                      "first_party_request_failed_count": ux.first_party_request_failed_count,
                      "http_error_count": ux.http_error_count,
                      "first_party_http_error_count": ux.first_party_http_error_count,
                      "xhr_fetch_count": ux.xhr_fetch_count,
                      "dynamic_resource_count": ux.dynamic_resource_count,
                      "network_settled": ux.network_settled,
                      "error_code": ux.error_code,
                      "profile_applied": ux.profile_applied,
                  })
                  time.sleep(DELAY_SECONDS)
          finally:
              navigation.close()
              experience.close()

          nav_summary = summarize(nav_rows, "duration_ms")
          ux_summary = summarize(ux_rows, "user_action_duration_ms")
          forced_count = sum(bool(row["error_forced_frustrated"]) for row in ux_rows if row["classification"] is not None)
          console_samples = sum(int(row["console_error_count"] or 0) > 0 for row in ux_rows)
          js_samples = sum(int(row["javascript_error_count"] or 0) > 0 for row in ux_rows)
          first_request_error_samples = sum(
              int(row["first_party_request_failed_count"] or 0) > 0 or int(row["first_party_http_error_count"] or 0) > 0
              for row in ux_rows
          )
          blocked_statuses = sum(row.get("http_status") in {403, 429} for row in nav_rows + ux_rows)

          suspicions = []
          if nav_summary["valid_ratio"] < 0.8:
              suspicions.append("NAVIGATION_COLLECTION_VALID_RATIO_BELOW_80_PERCENT")
          if ux_summary["valid_ratio"] < 0.8:
              suspicions.append("EXPERIENCE_COLLECTION_VALID_RATIO_BELOW_80_PERCENT")
          if ux_summary["apdex"] is not None and not (0.35 <= ux_summary["apdex"] <= 0.75):
              suspicions.append("EXPERIENCE_APDEX_OUTSIDE_BROAD_DIAGNOSTIC_TOLERANCE_AROUND_REFERENCE")
          if ux_summary["valid"] and forced_count / ux_summary["valid"] >= 0.5:
              suspicions.append("EXPERIENCE_ERROR_FORCED_FRUSTRATED_AT_LEAST_50_PERCENT")
          for label, summary in (("NAVIGATION", nav_summary), ("EXPERIENCE", ux_summary)):
              first = summary["first_half_mean_ms"]
              second = summary["second_half_mean_ms"]
              if first and second and second > first * 1.5:
                  suspicions.append(f"{label}_SECOND_HALF_MEAN_OVER_50_PERCENT_WORSE")
          if blocked_statuses:
              suspicions.append("HTTP_403_OR_429_OBSERVED_DURING_BATTERY")

          result = {
              "url": URL,
              "device": "MOBILE",
              "samples_per_mode": SAMPLES,
              "execution_pattern": "INTERLEAVED_NAVIGATION_THEN_EXPERIENCE",
              "navigation_criteria": {"T_seconds": 3.0, "satisfied": "<=3s", "tolerating": ">3s and <=12s", "frustrated": ">12s or qualifying navigation error"},
              "experience_criteria": {"kpm": "USER_ACTION_DURATION", "satisfied": "<3s", "tolerating": "3s through 12s", "frustrated": ">12s or qualifying error", "runtime_errors": "all JavaScript/pageerror and console.error", "request_errors": "first-party"},
              "environments": environments,
              "navigation": {"summary": nav_summary, "samples": nav_rows},
              "experience": {
                  "summary": ux_summary,
                  "forced_frustrated_samples": forced_count,
                  "samples_with_console_error": console_samples,
                  "samples_with_javascript_error": js_samples,
                  "samples_with_first_party_request_error": first_request_error_samples,
                  "user_reference_apdex": [0.5, 0.6],
                  "samples": ux_rows,
              },
              "blocked_403_429_observations": blocked_statuses,
              "routine_suspicions": suspicions,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: isolated-apdex-mobile-validation
          path: apdex-isolated-validation.json
