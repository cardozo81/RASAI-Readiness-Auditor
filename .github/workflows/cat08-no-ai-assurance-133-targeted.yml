name: CAT-08 no-AI assurance 133 (isolated)
on:
  pull_request:
    paths:
      - 'src/rasai/catalog_report_assurance.py'
      - 'tests/test_cat08_no_ai_assurance_133.py'
      - '.github/workflows/cat08-no-ai-assurance-133-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cat08-opt-out:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install affected runtime and pytest
        run: python -m pip install -e . pytest
      - name: Only five CAT-08 applicability regressions
        run: python -m pytest -q tests/test_cat08_no_ai_assurance_133.py
