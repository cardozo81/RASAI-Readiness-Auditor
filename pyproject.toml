[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rasai-readiness-auditor"
version = "0.1.0"
description = "RASAi - Search & AI Readiness Auditor. Python package namespace: rasai."
requires-python = ">=3.13,<3.14"
dependencies = [
    "playwright>=1.57,<2",
    "tzdata>=2026.1",
]

[project.scripts]
rasai = "rasai.entrypoint:main"
rasai-console = "rasai.console_entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
