name: Temporary report language reconciliation v2

on:
  push:
    branches:
      - fix/report-language-doc-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message != 'Reconcile report language and documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reconciliation
        run: |
          python tools/reconcile_report_language.py
          python tools/reconcile_report_language_followup.py
      - name: Install project and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest
          python -m playwright install chromium
      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_user_facing_language_contract.py \
            tests/test_report_semantics.py \
            tests/test_console_progress_guidance.py \
            tests/test_searchgeo_readiness_reporting.py \
            tests/test_m7_semantic_provider.py \
            tests/test_report_navigation.py
      - name: Full tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src tests
      - name: Presentation guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = re.compile(r'(?<![\w-])M\d{1,2}(?![\w-])')
          bad=[]
          for f in [Path('README.md'), *Path('docs').rglob('*.md')]:
              if p.search(f.read_text(encoding='utf-8')):
                  bad.append(str(f))
          if bad:
              raise SystemExit('milestone labels remain: ' + ', '.join(bad))
          PY
      - name: Commit validated changes
        shell: bash
        run: |
          rm -f .github/workflows/report-language-doc-reconciliation.yml
          rm -f .github/workflows/report-language-doc-reconciliation-v2.yml
          rm -f tools/reconcile_report_language.py
          rm -f tools/reconcile_report_language_followup.py
          git config user.name "SearchGEO automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcile report language and documentation"
          git push origin HEAD:fix/report-language-doc-reconciliation
