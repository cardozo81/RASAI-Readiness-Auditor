name: RASAi scoring report layout refinement

on:
  push:
    branches: [main]
    paths:
      - '.rasai-scoring-layout-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply scoring layout refinement
        run: |
          python .github/rasai_scoring_layout_refinement.py
          rm -f .github/rasai_scoring_layout_refinement.py
          rm -f .github/workflows/rasai-scoring-layout-refinement.yml
          rm -f .rasai-scoring-layout-trigger
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Targeted regression
        run: |
          pytest -q \
            tests/test_scoring_report_layout_20260908.py \
            tests/test_score_geo_004.py \
            tests/test_score_geo_004_applicability.py \
            tests/test_reporting_governance_refinement_20260908.py
      - name: Full regression
        run: pytest -q
      - name: Commit validated implementation
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No implementation changes to commit'; exit 1; }
          git commit -m 'Improve scoring report readability'
          git push origin HEAD:main
