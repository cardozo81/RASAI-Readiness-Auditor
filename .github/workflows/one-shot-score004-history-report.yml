          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = ROOT / raw.decode('utf-8')
              if path.name == 'one-shot-score004-history-report.yml' or not path.is_file():
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
