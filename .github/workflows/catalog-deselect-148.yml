name: Catalog deselect dependency #148

on:
  pull_request:
    paths:
      - 'src/rasai/console_catalog_plan.py'
      - 'tests/test_console_catalog_configuration_refinements.py'
      - '.github/workflows/catalog-deselect-148.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/console_catalog_plan.py'
      - 'tests/test_console_catalog_configuration_refinements.py'
      - '.github/workflows/catalog-deselect-148.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-deselect-148:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Run only the #148 regressions
        run: |
          python -m pytest -q             tests/test_console_catalog_configuration_refinements.py::test_remove_navigation_apdex_preserves_independent_experience_and_returns             tests/test_console_catalog_configuration_refinements.py::test_remove_experience_apdex_preserves_navigation_catalog             tests/test_console_catalog_configuration_refinements.py::test_removed_apdex_catalogs_are_not_projected_into_next_audit
