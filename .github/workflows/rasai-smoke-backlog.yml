name: RASAi smoke backlog implementation

on:
  push:
    branches: [main]
    paths:
      - .rasai-smoke-backlog-trigger

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m playwright install --with-deps chromium
      - name: Apply consolidated backlog patch
        run: python .github/rasai_smoke_backlog_fix.py
      - name: Align public wording and layout regression
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("src/rasai/rasai_readiness_reporting.py")
          text = runtime.read_text(encoding="utf-8")
          old = "Nenhum indicador externo é convertido no SARI-001."
          new = "Nenhum Lighthouse, Core Web Vitals, Accessibility ou Apdex é convertido no SARI-001."
          if old not in text:
              raise SystemExit("dashboard methodology wording not found")
          runtime.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          test = Path("tests/test_rasai_readiness_reporting.py")
          text = test.read_text(encoding="utf-8")
          replacements = {
              'assert "Mobile 81-88/100" in html': 'assert "<small>Mobile</small><strong>81-88/100</strong>" in html',
              'assert "Desktop 95/100" in html': 'assert "<small>Desktop</small><strong>95/100</strong>" in html',
              'assert "Mobile 0.820" in html': 'assert "<small>Mobile</small><strong>0.820</strong>" in html',
              'assert "Desktop 0.910" in html': 'assert "<small>Desktop</small><strong>0.910</strong>" in html',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected assertion not found: {old}")
              text = text.replace(old, new, 1)
          test.write_text(text, encoding="utf-8", newline="\n")

          language_replacements = {
              "docs/AI_GUIDE.md": {
                  "O M20 restringe `finding_id` e `evidence_ids` ao universo enviado": "A remediação de conteúdo restringe `finding_id` e `evidence_ids` ao universo enviado",
                  "A IA técnica M24 não possui autoridade para elevar Confidence ou SARI por julgamento.": "A IA técnica de crawling/discovery não possui autoridade para elevar Confidence ou SARI por julgamento.",
              },
              "docs/SCORING_GUIDE.md": {
                  "Os diagnósticos aprofundados M24 permanecem advisory": "Os diagnósticos aprofundados de crawling/discovery permanecem advisory",
              },
              "src/rasai/m24_reporting.py": {
                  "Os diagnósticos M24 desta página são advisory/non-scoring": "Os diagnósticos aprofundados desta página são advisory/non-scoring",
                  '"Impacto M24", "NENHUM direto"': '"Impacto desta camada", "NENHUM direto"',
                  "a remediação M24 permanece advisory e não altera scoring": "a remediação técnica desta camada permanece advisory e não altera scoring",
              },
          }
          for filename, replacements in language_replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f"public-language source not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Targeted regression
        run: |
          pytest -q \
            tests/test_smoke_backlog_20260908.py \
            tests/test_rasai_readiness_reporting.py \
            tests/test_m20_content_remediation.py \
            tests/test_report_semantics.py \
            tests/test_m23_integration.py \
            tests/test_user_facing_language_contract.py
      - name: Full RASAi regression
        run: pytest -q
      - name: Remove temporary implementation artifacts
        run: |
          find . -maxdepth 1 -type f -name '.*.tmp' -print0 | xargs -0 -r git rm -f --ignore-unmatch --
          git rm -f --ignore-unmatch .rasai-smoke-backlog-trigger
          git rm -f --ignore-unmatch .github/rasai_smoke_backlog_fix.py
          git rm -f --ignore-unmatch .github/workflows/rasai-smoke-backlog.yml
      - name: Commit validated implementation to main
        run: |
          git config user.name "RASAi CI"
          git config user.email "rasai-ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
            exit 0
          fi
          git commit -m "Fix smoke backlog reporting AI and Apdex diagnostics"
          git push origin HEAD:main
