name: CAT-03 semantic provenance summary #109

on:
  pull_request:
    paths:
      - 'src/rasai/catalog_report_evidence.py'
      - 'tests/test_semantic_summary_provenance_109.py'
      - '.github/workflows/cat03-semantic-summary-109.yml'
  push:
    branches: [main]
    paths:
      - 'src/rasai/catalog_report_evidence.py'
      - 'tests/test_semantic_summary_provenance_109.py'
      - '.github/workflows/cat03-semantic-summary-109.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary-provenance-109:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - name: Only semantic summary provenance
        run: python -m pytest -q tests/test_semantic_summary_provenance_109.py
