name: RASAi reporting governance refinement

on:
  push:
    branches: [main]
    paths:
      - '.rasai-reporting-governance-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply governance refinement
        run: |
          python .github/rasai_reporting_governance_refinement.py
          rm -f .github/rasai_reporting_governance_refinement.py
          rm -f .github/workflows/rasai-reporting-governance-refinement.yml
          rm -f .rasai-reporting-governance-trigger
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Targeted regression
        run: |
          pytest -q \
            tests/test_reporting_governance_refinement_20260908.py \
            tests/test_scoring_discovery_refinement_20260908.py \
            tests/test_post_smoke_adherence_20260908.py \
            tests/test_m24_crawling_discovery.py \
            tests/test_m9_scoring.py \
            tests/test_score_geo_004.py \
            tests/test_score_geo_004_applicability.py \
            tests/test_report_public_contract_adherence.py
      - name: Full regression
        run: pytest -q
      - name: Commit validated implementation
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No implementation changes to commit'; exit 1; }
          git commit -m 'Improve report governance and SARI explainability'
          git push origin HEAD:main
