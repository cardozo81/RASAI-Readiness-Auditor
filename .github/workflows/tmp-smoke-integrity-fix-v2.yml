name: Temporary smoke-integrity correction gate v2

on:
  push:
    branches:
      - fix/smoke-integrity-console-solid-reports

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply, validate and materialize corrections
        shell: bash
        run: |
          set -euo pipefail
          MESSAGE="$(git log -1 --pretty=%B)"
          if printf '%s' "$MESSAGE" | grep -Eq '\[(patch-debug|validation-debug)\]'; then
            exit 0
          fi

          PATCH_RUN=1
          if printf '%s' "$MESSAGE" | grep -Fq '[smoke-integrity-patch]'; then
            PATCH_RUN=0
          else
            set +e
            python .github/tmp_apply_smoke_integrity_fix.py > /tmp/patch-driver.log 2>&1
            PATCH_RC=$?
            set -e

            if [ "$PATCH_RC" -ne 0 ] && grep -Fq 'gradient declarations remain in report sources: src/searchgeo/report_navigation.py' /tmp/patch-driver.log; then
              PATCH_RC=0
            fi

            if [ "$PATCH_RC" -ne 0 ]; then
              cp /tmp/patch-driver.log .github/patch-driver-diagnostic.txt
              git config user.name 'SearchGEO CI'
              git config user.email 'actions@users.noreply.github.com'
              git add .github/patch-driver-diagnostic.txt
              git commit -m '[patch-debug] capture smoke-integrity patch failure' || true
              git push origin HEAD:fix/smoke-integrity-console-solid-reports
              exit "$PATCH_RC"
            fi

            python - <<'PY'
          from pathlib import Path

          report = Path('src/searchgeo/report_navigation.py')
          text = report.read_text(encoding='utf-8')
          text = text.replace(
              'background:linear-gradient(135deg,#eef2fb 0%,#f4f0fa 100%)',
              'background:#eef2fb',
          )
          report.write_text(text, encoding='utf-8', newline='\n')

          console = Path('src/searchgeo/console_environment.py')
          text = console.read_text(encoding='utf-8')
          old = '    print(" 0. cancelar")\n    raw = input("Escolha: ").strip()\n    if raw == "0":\n        return None'
          new = '    print(" V. Voltar")\n    raw = input("Escolha: ").strip().upper()\n    if raw == "V":\n        return None'
          if old not in text:
              raise SystemExit('console_environment _prompt_choice 0/cancel contract not found')
          console.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          fi

          set +e
          (
            set -euo pipefail
            python -m pip install --upgrade pip
            python -m pip install -e .
            python -m playwright install --with-deps chromium

            python -m unittest -v \
              tests.test_smoke_integrity_regressions \
              tests.test_m9_scoring \
              tests.test_source_quality_browser_identity \
              tests.test_m18_multi_ai_provider
            python -m unittest discover -s tests -v
            python -m compileall -q src tests
            git diff --check

            if grep -RniE 'linear-gradient|radial-gradient' src/searchgeo/report*.py src/searchgeo/*reporting*.py; then
              echo 'Gradient declaration found in report source.' >&2
              exit 1
            fi
            if grep -Fn '0. cancelar' src/searchgeo/interactive_console.py src/searchgeo/console_environment.py; then
              echo 'Legacy 0=cancelar back action remains.' >&2
              exit 1
            fi
          ) > /tmp/validation.log 2>&1
          VALIDATION_RC=$?
          set -e

          if [ "$VALIDATION_RC" -ne 0 ]; then
            cp /tmp/validation.log .github/validation-diagnostic.txt
            git config user.name 'SearchGEO CI'
            git config user.email 'actions@users.noreply.github.com'
            git add .github/validation-diagnostic.txt
            git commit -m '[validation-debug] capture smoke-integrity validation failure' || true
            git push origin HEAD:fix/smoke-integrity-console-solid-reports
            exit "$VALIDATION_RC"
          fi

          if [ "$PATCH_RUN" -eq 1 ]; then
            git config user.name 'SearchGEO CI'
            git config user.email 'actions@users.noreply.github.com'
            git add src tests docs
            git commit -m '[smoke-integrity-patch] fix report integrity, redirect recovery and console UX'
            git push origin HEAD:fix/smoke-integrity-console-solid-reports
          fi
