name: RASAi report consistency remediation (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rasai-report-polish-once.yml'

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed remediation
        run: |
          python .github/rasai_report_polish_20260908.py
          python .github/rasai_report_polish_followup_20260908.py
      - name: Compile changed Python contracts
        run: |
          python -m py_compile \
            src/rasai/rasai_readiness_reporting.py \
            src/rasai/report_presentation.py \
            src/rasai/report_semantics.py \
            src/rasai/report_contract.py \
            src/rasai/report_navigation.py \
            src/rasai/report_registry.py \
            src/rasai/consolidation/reporting.py \
            tests/test_report_polish_20260908.py
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Targeted report and language smoke
        run: |
          pytest -q \
            tests/test_report_polish_20260908.py \
            tests/test_user_facing_language_contract.py \
            tests/test_rasai_readiness_reporting.py \
            tests/test_report_registry_and_method_docs.py \
            tests/test_report_semantics.py \
            tests/test_report_presentation.py \
            tests/test_report_navigation.py \
            tests/test_consolidation.py \
            tests/test_consolidation_reporting_ux.py \
            tests/test_consolidated_backlog_regressions.py \
            tests/test_consolidation_comparability.py
      - name: Public contract gate
        run: python -m rasai.public_contract_gate
      - name: Documentation consistency guard
        run: |
          ! grep -RniE 'SCORE-GEO-003 permanece histórico|CONS-2|Legacy consolidated analytical cache' README.md docs --include='*.md'
      - name: Install Chromium for browser regressions
        run: python -m playwright install chromium
      - name: Full regression
        run: pytest -q
      - name: Remove one-shot automation
        if: success()
        run: |
          rm -f .github/rasai_report_polish_20260908.py
          rm -f .github/rasai_report_polish_followup_20260908.py
          rm -f .github/workflows/rasai-report-polish-once.yml
      - name: Commit validated changes directly to main
        if: success()
        run: |
          git config user.name 'RASAi CI'
          git config user.email 'rasai-ci@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Align report semantics, readiness and consolidated reporting'
          git push origin HEAD:main
